<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2622; --muted:#7a6f66; --line:#e6ddd0;
  --accent:#8a4b2a; --accent-soft:#f3e4d8; --ok:#2f7a55; --warn:#a0621c; --warn-soft:#fbefdc;
  --g1:#ffd9b8; --g2:#bcd4f6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1917;--card:#26221f;--ink:#efe8df;--muted:#a8998b;--line:#3a332d;--accent:#e0a37c;--accent-soft:#3a2b22;--ok:#6fc49a;--warn:#e7b26b;--warn-soft:#3a2f1f;--g1:#3d2340;--g2:#123049;}
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(150deg,var(--g1) 0%,var(--g2) 100%) fixed;min-height:100vh;color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;font-size:16px;line-height:1.55}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{font-family:Fraunces,serif;font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0}
main{max-width:760px;margin:0 auto;padding:8px 16px 60px}
nav.tabs{display:flex;gap:6px;margin:12px 0 16px;overflow-x:auto}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(60,40,30,.08);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.period{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;margin-bottom:6px}
.daytitle{font-family:Fraunces,serif;font-size:22px;margin:2px 0 8px}
.reads{list-style:none;padding:0;margin:0 0 6px}
.reads li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reads li:last-child{border-bottom:0}
.dk{font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.members{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mem{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;user-select:none;font-weight:600;font-size:14px}
.mem.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mem .box{width:16px;height:16px;border-radius:4px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.sec h3{font-family:Fraunces,serif;font-size:17px;margin:16px 0 4px}
.sec p,.sec li{margin:4px 0}
.sec ul{padding-left:20px;margin:4px 0}
.tag{font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;white-space:nowrap}
.tag.g{background:var(--accent-soft);color:var(--accent)}
.tag.r{background:#e3eef8;color:#2a5b86}
@media (prefers-color-scheme: dark){.tag.r{background:#1f3242;color:#8fc0ea}}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:15px}
.empty{color:var(--muted);font-size:15px}
.srcs{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.srcs a{color:var(--accent)}
a{color:var(--accent)}
.list input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.dayrow{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow:hover{background:var(--accent-soft)}
.dnum{font-weight:700;min-width:44px;color:var(--muted);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.dtext{flex:1;font-size:14px}
.ticks{font-size:12px;color:var(--ok);font-weight:700;white-space:nowrap}
.has{font-size:11px;font-weight:700;color:var(--accent);margin-left:4px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.prog > div{height:100%;background:var(--ok)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input.t,input[type=date]{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.hide{display:none}
.reads li{display:block}
.rbtn{padding:5px 10px;font-size:13px}
.reader{margin:8px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.rtabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.rtabs button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.rtabs button.on{background:var(--accent);color:#fff}
.rbody{padding:10px 12px;max-height:70vh;overflow:auto}
.rframe{width:100%;height:60vh;border:0;border-radius:8px;background:#fff}
.rtext .rv{margin:4px 0;line-height:1.7}
.rtext sup{color:var(--accent);font-weight:700;margin-right:2px}
.rtext.rtl{direction:rtl;text-align:right;font-size:20px}
.rch{font-weight:700;margin:10px 0 4px;color:var(--muted);font-size:13px}
.rnote{font-size:12px;color:var(--muted);margin-top:8px}
</style>

function toID(seg){
  seg = seg.trim();
  const names = Object.keys(BOOKS).sort((a,b)=>b.length-a.length);
  for(const n of names){ if(seg.startsWith(n)) return {id: BOOKS[n] + seg.slice(n.length), en:n, rest:seg.slice(n.length).trim()}; }
  return {id:seg,en:"",rest:""};
}
function isDK(r){
  if(DK.includes(r.en)) return true;
  if(r.en==="Esther" && /1[1-6]/.test(r.rest)) return true;
  if(r.en==="Daniel" && /1[34]/.test(r.rest)) return true;
  return false;
}

1:{ covers:"Kejadian 1–2 dan Mazmur 19", html:`
<h3>🔧 BAGAIMANA caranya?</h3>
<p>${T_G} Di Kejadian 1, menurut catatan Alkitab resmi para uskup (NABRE), Allah menghadirkan alam semesta yang teratur dari kekacauan awal hanya dengan bersabda. Di Kejadian 2, Allah digambarkan seperti tukang periuk yang membentuk tubuh manusia dari tanah, lalu mengembuskan napas ke hidungnya.</p>
<h3>👤 SIAPA manusia itu?</h3>
<ul>
<li>${T_G} Kata "gambar" dan "rupa" Allah menunjukkan bahwa manusia berharga, punya nilai dalam dirinya sendiri (NABRE Kej 1).</li>
<li>${T_G} "Adam" artinya "manusia". Dalam bahasa Ibrani ada permainan kata antara <i>'adam</i> (manusia) dan <i>'adama</i> (tanah). Jadi manusia itu "si dari tanah" (NABRE Kej 2).</li>
<li>${T_G} Perempuan disebut "penolong yang sepadan". Menurut NABRE, kata "penolong" tidak berarti lebih rendah, karena Allah sendiri juga disebut penolong. Perempuan dibuat "dari dirinya sendiri", menunjukkan kedekatan yang sangat dalam antara laki-laki dan perempuan.</li>
</ul>
<h3>📍 DI MANA taman Eden?</h3>
<p>${T_G} Menurut NABRE, Eden mungkin nama sebuah wilayah di Mesopotamia selatan (Irak sekarang), dari kata Sumeria yang artinya "dataran subur". Dua dari empat sungainya, Tigris dan Efrat, sama-sama bermuara ke Teluk Persia. Sungai Pison tidak diketahui letaknya.</p>
<h3>💭 MENGAPA ada dua cerita penciptaan?</h3>
<p>${T_G} Menurut NABRE, Kejadian 1 berfungsi sebagai pembuka, seperti cerita-cerita kuno tentang asal-usul dunia. Kejadian 2 berasal dari tradisi yang lebih tua (disebut tradisi "Yahwis", karena memakai nama Allah "YHWH"), lalu disusun dalam bingkai baru. Gereja mengajarkan bahwa kita perlu memperhatikan gaya bahasa yang dipakai penulis suci sesuai zamannya (Dei Verbum 12).</p>
<p>${T_R} Bangsa Babel punya cerita penciptaan sendiri, <i>Enuma Elish</i>. Salinan lempeng tanah liatnya ada di British Museum, dari zaman Neo-Babilonia (sekitar 626–539 SM). Di cerita itu manusia dibuat untuk melayani para dewa. Di Kejadian, manusia justru diciptakan menurut gambar Allah.</p>
<h3>📅 KAPAN?</h3>
<p>Kejadian 1–2 tidak menyebut tahun. Kapan kitab ini ditulis belum dicantumkan karena datanya belum diriset.</p>
<h3>🎵 Mazmur 19</h3>
<p>${T_G} Menurut NABRE, bagian pertama mazmur ini memuji langit yang tersusun indah sebagai tanda kuasa dan hikmat Penciptanya. Bagian kedua memuji hukum Tuhan, tempat manusia menemukan hikmat Sang Pencipta. Dalam sastra kuno lain, matahari dianggap hakim dan pemberi hukum karena "melihat segalanya" setiap hari. Di mazmur ini, matahari hanyalah ciptaan.</p>
<h3>🗣️ Ngobrol yuk</h3>
<ul><li>Dewa-dewa Babel bikin manusia jadi pelayan, Allah bikin manusia menurut gambar-Nya. Apa bedanya buat caramu memandang dirimu sendiri?</li>
<li>Kenapa ya Allah bilang "tidak baik kalau manusia sendirian"?</li></ul>
<div class="srcs">📚 <a href="https://bible.usccb.org/bible/genesis/1">NABRE Kej 1</a> · <a href="https://bible.usccb.org/bible/genesis/2">NABRE Kej 2</a> · <a href="https://www.intratext.com/IXT/ENG0037/_P4.HTM">Dei Verbum 12</a> · <a href="https://cdli.earth/artifacts/479340">Lempeng Enuma Elish (CDLI)</a> · <a href="https://www.worldhistory.org/article/225/enuma-elish%E2%80%94the-babylonian-epic-of-creation%E2%80%94fu/">Teks Enuma Elish</a> · <a href="https://bible.usccb.org/bible/ps/19">NABRE Mzm 19</a></div>`},
2:{ covers:"Kejadian 3–4 dan Mazmur 104", html:`
<h3>💭 MENGAPA kisah kejatuhan terasa seperti gambaran?</h3>
<p>${T_G} Katekismus no. 390: kisah kejatuhan di Kejadian 3 memakai bahasa kiasan, tetapi menegaskan sebuah peristiwa purba, perbuatan yang terjadi di awal sejarah manusia.</p>

3:{ covers:"Kejadian 5–6 dan Mazmur 136", html:`
<h3>💭 MENGAPA umurnya panjang sekali?</h3>
<p>${T_G} Menurut NABRE, silsilah ini menunjukkan pengaruh sastra Mesopotamia kuno, yang punya daftar raja sebelum dan sesudah air bah. Dalam daftar itu, umur raja-raja sebelum air bah antara 18.600 sampai 36.000 tahun. Angka di Alkitab jauh lebih kecil. Angka-angka itu juga sedikit berbeda antara naskah Ibrani dan naskah Yunani.</p>
<h3>👤 SIAPA Henokh?</h3>
<p>${T_G} Biasanya silsilah ditutup dengan "lalu ia mati". Untuk Henokh tertulis "ia hidup bergaul dengan Allah". Menurut NABRE, ini menyiratkan Henokh diangkat hidup-hidup kepada Allah, seperti Elia.</p>
<h3>👤 SIAPA "anak-anak Allah" dan Nefilim? (Kej 6:1–4)</h3>
<p>${T_G} Menurut NABRE, bagian ini memang sulit dipahami. "Anak-anak Allah" artinya makhluk-makhluk surgawi lain, dan bagian ini tampaknya merujuk pada sebuah legenda kuno. Nefilim adalah sebutan orang Israel untuk raksasa-raksasa zaman purba.</p>
<h3>🔧 BAGAIMANA bahteranya?</h3>
<p>${T_G} Menurut NABRE, ukuran bahtera sekitar 134 × 22 × 13 meter (440 × 73 × 44 kaki), dengan satu hasta kira-kira 45 cm. Kayu "gofir" tidak diketahui jenisnya, mungkin kayu sipres.</p>

<p class="empty">Belum ada data yang diriset.</p>
<h3>🎵 Mazmur 136</h3>
<p>${T_G} Menurut NABRE, himne ini memuji Allah Israel ("Allah segala allah") yang menciptakan dunia tempat Israel hidup. Setiap ayatnya diulang dengan kalimat yang sama: "kasih setia-Nya untuk selama-lamanya."</p>
<h3>🗣️ Ngobrol yuk</h3>

<div class="srcs">📚 <a href="https://bible.usccb.org/bible/genesis/5">NABRE Kej 5</a> · <a href="https://bible.usccb.org/bible/genesis/6">NABRE Kej 6</a> · <a href="https://coursebible.com/new-american-bible-revised-edition-nabre/psalm-136">NABRE Mzm 136</a></div>`},
4:{ covers:"Kejadian 7–9 dan Mazmur 1", html:`
<h3>💭 MENGAPA ada detail yang terasa berbeda?</h3>
<p>${T_G} Menurut NABRE, kisah air bah umumnya dipandang sebagai gabungan dua sumber yang dijalin jadi satu. Contohnya: di satu bagian ada sepasang dari setiap binatang, di bagian lain tujuh pasang binatang yang tahir. Di satu bagian air datang dari bawah dan atas bumi, di bagian lain dari hujan 40 hari 40 malam. Meski begitu, NABRE menganjurkan kisah ini dibaca sebagai satu cerita yang utuh.</p>
<h3>👤 SIAPA saja yang termasuk perjanjian?</h3>
<p>${T_G} Menurut NABRE, Allah membuat perjanjian dengan Nuh dan keturunannya, dan, yang luar biasa, juga dengan semua binatang yang keluar dari bahtera: dunia tidak akan lagi dihancurkan oleh air bah. Pelangi adalah tanda janji itu.</p>
<p>${T_G} Soal Nuh mabuk (9:18–27), NABRE menulis bahwa kesalahannya bukan pada Nuh, karena ia tidak mungkin tahu efek anggur. Kesalahannya pada Ham, yang mempermalukan ayahnya.</p>
<h3>🏺 Cerita air bah bangsa lain</h3>
<p>${T_G} NABRE sendiri menyebut bahwa kisah di Alkitab pada akhirnya bersumber dari tradisi Mesopotamia kuno tentang air bah besar, yang dikenal lewat kisah air bah Sumeria, lempeng ke-11 Epos Gilgamesh, dan Epos Atrahasis. Bahtera dalam kisah Babel berbentuk kubus sempurna, 120 hasta di setiap sisinya. Bahtera Nuh berbentuk persegi panjang.</p>
<p>${T_R} "Lempeng Air Bah" dari Epos Gilgamesh kini ada di British Museum. Lempeng ini berasal dari sekitar 700–600 SM dan dikenali sebagai kisah air bah pada tahun 1872 oleh George Smith, asisten di British Museum. Lempeng itu dulu milik perpustakaan Raja Asyur Ashurbanipal (memerintah 668–627 SM).</p>
<h3>📍 DI MANA · 📅 KAPAN</h3>
<p class="empty">Belum ada data yang diriset.</p>
<h3>🎵 Mazmur 1</h3>
<p>${T_G} Menurut catatan New Catholic Bible, Mazmur 1 dan 2 dipandang sebagai kata pengantar untuk seluruh Kitab Mazmur. Orang benar diibaratkan pohon yang tidak layu, karena seperti pohon yang ditanam di tanah subur, mereka sanggup bertahan menghadapi beratnya hidup.</p>

<div class="srcs">📚 <a href="https://bible.usccb.org/bible/genesis/6">NABRE Kej 6 (catatan air bah 6:5–8:22)</a> · <a href="https://bible.usccb.org/bible/genesis/9">NABRE Kej 9</a> · <a href="https://artsandculture.google.com/asset/the-flood-tablet-relating-part-of-the-epic-of-gilgamesh/wQGL1dmyVmXRYA">Lempeng Air Bah, British Museum</a> · <a href="https://archaeology.org/issues/online/collection/cuneiform-religion">Archaeology Magazine</a> · <a href="https://coursebible.com/new-catholic-bible-ncb/psalm-1">New Catholic Bible, Mzm 1</a></div>`},
5:{ covers:"Kejadian 10–11 dan Mazmur 2", html:`
<h3>💭 MENGAPA ada daftar bangsa-bangsa?</h3>
<p>${T_G} Menurut NABRE, Kejadian 10 penting karena menekankan bahwa <b>semua bangsa di bumi adalah satu keluarga</b>. Setiap bangsa juga diberi tanahnya oleh Allah.</p>
<h3>📍 DI MANA menara Babel?</h3>
<ul>
<li>${T_G} Sinear adalah tanah Babilonia kuno, meliputi Sumer dan Akkad, kini Irak selatan (NABRE Kej 10).</li>
<li>${T_G} "Babel" adalah bentuk Ibrani dari nama "Babilon". Orang Babel sendiri mengartikan nama kotanya, <i>Bab-ili</i>, sebagai "gerbang dewa". Kata Ibrani <i>balal</i> ("Ia mengacaukan") bunyinya mirip (NABRE Kej 11).</li>
<li>${T_G} Menara yang puncaknya sampai ke langit <b>mungkin</b> merujuk pada zigurat (menara kuil bertingkat) utama di Babel, <i>E-sag-ila</i>, yang artinya "rumah yang mengangkat tinggi kepalanya".</li>
</ul>
<h3>👤 SIAPA Abram dan dari mana asalnya?</h3>
<ul>
<li>${T_G} Abram adalah variasi dialek dari nama Abraham (NABRE).</li>
<li>${T_G} Ur adalah kota Sumeria yang sangat kuno di Mesopotamia selatan. NABRE mencatat bahwa tempat asal Abraham sebenarnya Haran, bukan Ur.</li>
<li>${T_R} Menurut Britannica, situs Ur terletak sekitar 225 km di tenggara Babel. Ur digali oleh ekspedisi gabungan British Museum dan University of Pennsylvania di bawah pimpinan Leonard Woolley, dari 1922 sampai 1934.</li>
</ul>
<h3>📅 KAPAN</h3>
<p class="empty">Belum ada data yang diriset.</p>
<h3>🎵 Mazmur 2</h3>
<p>${T_G} Menurut NABRE, ini mazmur untuk penobatan raja. Kata "yang diurapi" dalam bahasa Ibrani adalah <i>mashiah</i>, dan dalam bahasa Yunani <i>christos</i>. Dari sinilah kata Mesias dan Kristus berasal. Gereja membaca mazmur ini secara mesianis, dan Perjanjian Baru memahaminya tentang Kristus.</p>
<h3>🗣️ Ngobrol yuk</h3>
<ul><li>Semua bangsa itu satu keluarga. Gimana caranya kita memperlakukan teman yang beda suku atau beda bahasa?</li></ul>
<div class="srcs">📚 <a href="https://bible.usccb.org/bible/genesis/10">NABRE Kej 10</a> · <a href="https://bible.usccb.org/bible/genesis/11">NABRE Kej 11</a> · <a href="https://www.britannica.com/place/Ur">Ur (Britannica)</a> · <a href="https://www.britannica.com/contributor/Leonard-Woolley/3265">Leonard Woolley (Britannica)</a> · <a href="https://bible.usccb.org/bible/psalms/2">NABRE Mzm 2</a></div>`},
6:{ covers:"Kejadian 12, Ayub 1–2, Amsal 1:1–7 (Kejadian 13 belum dibahas)", html:`
<h3>💭 MENGAPA panggilan Abram penting?</h3>
<p>${T_G} Menurut NABRE, panggilan Abraham memulai sejarah berkat yang baru. Kisah ini kebalikan dari kisah menara Babel: kalau orang Babel ingin menetap, Abraham justru pergi. NABRE juga mencatat bahwa susunan kalimat Ibraninya menunjukkan berkat itu bergantung pada kesediaan Abraham untuk pergi ke Kanaan.</p>
<h3>📍 DI MANA?</h3>
<p>${T_G} Menurut NABRE, perjalanan Abraham melewati Sikhem, Betel, dan Negeb adalah semacam "penaklukan simbolis" atas tanah yang dijanjikan. Mezbah-mezbah yang ia dirikan menunjukkan bahwa ia mengakui Allahnya sebagai Tuhan atas negeri itu.</p>
<h3>👤 SIAPA · ⚠️ Catatan jujur</h3>
<p>${T_G} Di Mesir, Abram mengaku Sarai sebagai adiknya. NABRE menulis bahwa <b>teks ini tidak berusaha membenarkan tipu daya Abraham</b>.</p>
<h3>📅 KAPAN</h3>
<p class="empty">Belum ada data yang diriset.</p>
<h3>📜 Ayub 1–2</h3>
<ul>
<li>${T_G} Menurut NABRE, Kitab Ayub adalah karya drama yang membahas penderitaan orang yang tidak bersalah. Penulisnya tidak diketahui, dan kitab ini kemungkinan disusun antara abad ke-7 dan ke-5 SM.</li>
<li>${T_G} NABRE juga menulis bahwa Kitab Ayub tidak memberikan jawaban pasti soal penderitaan orang yang tidak bersalah, tetapi menantang pembacanya untuk sampai pada pemahamannya sendiri.</li>
<li>${T_G} Negeri Us letaknya di suatu tempat di Edom atau Arab (catatan NAB).</li>
</ul>
<h3>📜 Amsal 1:1–7</h3>
<p>${T_G} Menurut pengantar NAB, seluruh ajaran Kitab Amsal berdasar pada prinsip "takut akan Tuhan adalah permulaan pengetahuan" (1:7). Menurut NABRE, "takut akan Tuhan" terutama berarti sikap hati, bukan perasaan takut: rasa hormat yang mendalam kepada Allah, disertai ketaatan pada kehendak-Nya.</p>
<h3>🗣️ Ngobrol yuk</h3>
<ul><li>Abram berani pergi ke tempat yang belum ia kenal karena percaya Tuhan. Pernah nggak kamu harus berani mencoba hal baru?</li>
<li>"Takut akan Tuhan" itu artinya hormat, bukan takut. Apa bedanya?</li></ul>
<div class="srcs">📚 <a href="https://bible.usccb.org/bible/genesis/12">NABRE Kej 12</a> · <a href="https://biblehub.com/nabre/job/intro.htm">Pengantar Ayub, NABRE</a> · <a href="https://www.vatican.va/archive/ENG0839/_PEM.HTM">Catatan Ayub 1, NAB (vatican.va)</a> · <a href="https://press.vatican.va/archive/ENG0839/_PJZ.HTM">Pengantar Amsal, NAB (vatican.va)</a> · <a href="https://mail.biblehub.com/nabre/proverbs/footnotes.htm">Catatan Amsal, NABRE</a></div>`},
7:{ covers:"Kejadian 14–15, Ayub 3–4, Amsal 1:8–19", html:`
<h3>👤 SIAPA raja-raja itu?</h3>
<p>${T_G} Menurut NABRE, kebenaran sejarah peristiwa ini masih diperdebatkan. Selain Sinear (Babel), Tidal (nama raja Het, Tudhaliya), dan Elam, nama-nama dan tempat-tempatnya belum bisa dipastikan. Ceritanya mirip laporan perang dalam catatan kerajaan Babel dan Asyur.</p>
<h3>👤 SIAPA Melkisedek?</h3>
<ul>
<li>${T_G} Menurut NABRE, Salem adalah Yerusalem (bdk. Mzm 76:3).</li>
<li>${T_G} Ibrani 7 memahami Melkisedek sebagai gambaran awal Kristus.</li>
<li>${T_G} Abraham memberi sepersepuluh dari rampasan perang sebagai tanda menerima berkat itu.</li>
</ul>
<h3>🔧 BAGAIMANA perjanjian dibuat? (Kej 15)</h3>
<p>${T_G} Menurut NABRE, memotong binatang menjadi dua adalah cara yang umum untuk membuat perjanjian di zaman kuno. Artinya: siapa yang melanggar janji rela bernasib seperti binatang itu. Ada contohnya dalam perjanjian Siria abad ke-8 SM: "Seperti anak lembu ini dipotong, demikianlah Mati'el akan dipotong." Di Kejadian 15, perapian berasap dan suluh berapi yang lewat di antara potongan itu melambangkan Allah sendiri. Jadi Allah yang ikut "menandatangani" janji itu.</p>
<h3>💭 MENGAPA iman Abram penting?</h3>
<p>${T_G} Menurut NABRE, iman Abraham dipandang sebagai tindakan benar, yang sepenuhnya menyatakan hubungannya dengan Allah. Santo Paulus memakai iman Abraham sebagai teladan bagi orang Kristen (Roma dan Galatia).</p>
<h3>📅 KAPAN</h3>
<p class="empty">Belum ada data yang diriset.</p>
<h3>📜 Ayub 3–4</h3>
<p>${T_G} Di bab 3, Ayub mulai mengeluh. Di bab 4, sahabatnya Elifas menjawab. Menurut NABRE, bagian 4:12–21 menggambarkan secara dramatis betapa kecilnya manusia dibandingkan kebesaran Allah.</p>
<h3>📜 Amsal 1:8–19</h3>
<p>${T_G} NABRE memberi judul bagian ini "Jalan Orang Fasik: Keserakahan dan Kekerasan". Isinya nasihat orang tua kepada anaknya agar tidak ikut ajakan orang jahat.</p>
<h3>🗣️ Ngobrol yuk</h3>
<ul><li>Kalau ada teman yang ngajak berbuat jahat, gimana caranya bilang "tidak"?</li>
<li>Allah sendiri yang menjamin janji-Nya pada Abram. Apa artinya buat kita kalau Allah berjanji?</li></ul>
<div class="srcs">📚 <a href="https://bible.usccb.org/bible/genesis/14">NABRE Kej 14</a> · <a href="https://bible.usccb.org/bible/genesis/15">NABRE Kej 15</a> · <a href="https://mail.biblehub.com/nabre/job/footnotes.htm">Catatan Ayub, NABRE</a> · <a href="https://coursebible.com/new-american-bible-revised-edition-nabre/proverbs-1">NABRE Amsal 1</a></div>`},
313:{ covers:"Lukas 2:1–20 (Lukas 1, Lukas 2:21–52, dan Amsal belum dibahas)", html:`
<h3>👤 SIAPA saja?</h3>
<ul>
<li>Yusuf, Maria, bayi Yesus, para gembala, dan malaikat <i>(dari ayat)</i>.</li>
<li>${T_R} <b>Kaisar Agustus</b>: kaisar Romawi pertama, lahir 23 September 63 SM, wafat 19 Agustus 14 M (Britannica).</li>
<li>${T_G} <b>Kirenius</b>: menurut catatan NABRE, Sulpicius Quirinius menjadi gubernur Siria pada tahun 6–7 M, saat Yudea digabungkan ke provinsi Siria, dan saat itu diadakan sensus di Yudea.</li>
</ul>
<h3>📅 KAPAN?</h3>
<ul>
<li>${T_G} Di zaman Agustus. Menurut catatan NABRE, pemerintahannya biasanya dihitung dari 27 SM sampai wafatnya pada 14 M.</li>
<li>Tahun pastinya tidak diketahui. Gereja tidak mengajarkan bahwa Kristus lahir pada tahun tertentu (Catholic Answers, mengutip Benediktus XVI, <i>Yesus dari Nazaret</i>, jilid 3).</li>
</ul>
<div class="note">⚠️ <b>Catatan jujur:</b> catatan NABRE sendiri mengakui ada persoalan sejarah yang terkenal soal tanggal sensus di masa Kirenius, dan berbagai upaya untuk menyelesaikannya belum berhasil. Yesus lahir di zaman Raja Herodes (Luk 1:5), padahal sensus Kirenius yang tercatat dalam sejarah terjadi tahun 6–7 M.</div>
<h3>📍 DI MANA?</h3>
<p>Di Betlehem, Yudea. Yusuf dan Maria datang dari Nazaret, Galilea <i>(dari ayat)</i>.</p>
<h3>💭 MENGAPA Lukas menyebut Kaisar Agustus?</h3>
<p>${T_G} Menurut catatan NABRE, bukan kebetulan Lukas mengaitkan kelahiran Yesus dengan zaman Agustus: juru selamat dan pembawa damai yang sejati adalah anak yang lahir di Betlehem.</p>
<h3>🔧 BAGAIMANA keadaannya?</h3>
<p>${T_G} Yesus dibaringkan di palungan, yaitu tempat makan hewan (catatan NABRE).</p>
<h3>🗣️ Ngobrol yuk</h3>
<ul><li>Kaisar Agustus punya istana dan tentara, sedangkan Yesus lahir di tempat makan hewan. Kenapa ya Tuhan memilih cara seperti itu?</li></ul>
<div class="srcs">📚 Sumber: <a href="https://bible.usccb.org/bible/lk/2">Catatan NABRE Lukas 2 (USCCB)</a> · <a href="https://www.britannica.com/biography/Augustus-Roman-emperor">Augustus (Britannica)</a> · <a href="https://www.catholic.com/audio/ddp/the-year-jesus-was-born">The Year Jesus Was Born (Catholic Answers)</a> · <a href="https://stpatricksjaffrey.com/hrf_faq/the-birth-of-jesus-christ-in-bethlehem/">Catatan NABRE soal palungan</a></div>`},
359:{ covers:"Pengantar Kitab Wahyu & Wahyu 1 (Wahyu 2–3, 2 Timotius, dan Amsal belum dibahas)", html:`
<h3>👤 SIAPA penulisnya?</h3>
<p>${T_G} Menurut pengantar NABRE yang dimuat di situs Vatikan, penulisnya menyebut diri Yohanes dan dibuang ke Pulau Patmos karena imannya. Beberapa Bapa Gereja (Yustinus, Ireneus, Klemens dari Aleksandria, Tertulianus, Siprianus, Hipolitus) menyebutnya Rasul Yohanes, tetapi Bapa Gereja lain (Dionisius dari Aleksandria, Eusebius, Sirilus dari Yerusalem, Gregorius dari Nazianze, Yohanes Krisostomus) tidak setuju.</p>
<h3>📍 DI MANA?</h3>
<p>${T_R} Patmos adalah pulau kecil berbatu di Yunani. Menurut Britannica, di bawah kekuasaan Romawi pulau ini menjadi tempat pembuangan, dan menurut tradisi Yohanes dikirim ke sana sekitar tahun 95 M. Gua tempat Yohanes dikatakan menulis Kitab Wahyu kini termasuk Situs Warisan Dunia UNESCO (sejak 1999).</p>
<h3>📅 KAPAN?</h3>
<p>${T_G} Menurut pengantar NABRE, kitab ini dalam bentuknya sekarang kemungkinan ditulis menjelang akhir pemerintahan Kaisar Domitianus (81–96 M), seorang penganiaya orang Kristen yang kejam.</p>
<h3>💭 MENGAPA isinya penuh simbol?</h3>
<p>${T_G} Wahyu ditulis dengan gaya apokaliptik, yang populer di kalangan Yahudi dan Kristen sekitar 200 SM–200 M. Gambaran simbolisnya tidak boleh dibaca harfiah. Angka pun punya arti: empat = dunia, enam = ketidaksempurnaan, tujuh = keutuhan/kesempurnaan, dua belas = suku-suku Israel. Pesannya adalah harapan, penghiburan, dan tantangan bagi semua yang berani percaya.</p>
<h3>🔧 BAGAIMANA</h3>
<p class="empty">Belum ada data tambahan yang diriset.</p>
<h3>🗣️ Ngobrol yuk</h3>
<ul><li>Yohanes dibuang ke pulau sepi karena imannya, tapi justru di sana dia bertemu Yesus. Pernah nggak kamu merasa Tuhan dekat waktu lagi susah?</li></ul>
<div class="srcs">📚 Sumber: <a href="https://www.vatican.va/archive/ENG0839/_P12J.HTM">Pengantar Kitab Wahyu, NABRE (vatican.va)</a> · <a href="https://www.britannica.com/place/Patmos">Patmos (Britannica)</a></div>`}
};

/* ===== Pembaca ayat ===== */
const BOLLS="https://bolls.life";
const SABDA_ABBR={"Kejadian":"Kej","Keluaran":"Kel","Imamat":"Im","Bilangan":"Bil","Ulangan":"Ul","Yosua":"Yos","Hakim-hakim":"Hak","Rut":"Rut","1 Samuel":"1Sam","2 Samuel":"2Sam","1 Raja-raja":"1Raj","2 Raja-raja":"2Raj","1 Tawarikh":"1Taw","2 Tawarikh":"2Taw","Ezra":"Ezr","Nehemia":"Neh","Ester":"Est","Ayub":"Ayb","Mazmur":"Mzm","Amsal":"Ams","Pengkhotbah":"Pkh","Kidung Agung":"Kid","Yesaya":"Yes","Yeremia":"Yer","Ratapan":"Rat","Yehezkiel":"Yeh","Daniel":"Dan","Hosea":"Hos","Yoel":"Yl","Amos":"Am","Obaja":"Ob","Yunus":"Yun","Mikha":"Mi","Nahum":"Nah","Habakuk":"Hab","Zefanya":"Zef","Hagai":"Hag","Zakharia":"Za","Maleakhi":"Mal","Matius":"Mat","Markus":"Mrk","Lukas":"Luk","Yohanes":"Yoh","Kisah Para Rasul":"Kis","Roma":"Rm","1 Korintus":"1Kor","2 Korintus":"2Kor","Galatia":"Gal","Efesus":"Ef","Filipi":"Flp","Kolose":"Kol","1 Tesalonika":"1Tes","2 Tesalonika":"2Tes","1 Timotius":"1Tim","2 Timotius":"2Tim","Titus":"Tit","Filemon":"Flm","Ibrani":"Ibr","Yakobus":"Yak","1 Petrus":"1Ptr","2 Petrus":"2Ptr","1 Yohanes":"1Yoh","2 Yohanes":"2Yoh","3 Yohanes":"3Yoh","Yudas":"Yud","Wahyu":"Why"};
const NT_EN=["Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];
const ALIASES={"Psalm":["psalms","psalm"],"Song of Solomon":["songofsolomon","songofsongs","canticles","song"],"Wisdom":["wisdom","wisdomofsolomon"],"Sirach":["sirach","ecclesiasticus","sira","bensira"],"Revelation":["revelation","revelationofjohn","apocalypse"]};
function norm(s){return s.toLowerCase().replace(/^i\s/,"1 ").replace(/^ii\s/,"2 ").replace(/^iii\s/,"3 ").replace(/first\s/,"1 ").replace(/second\s/,"2 ").replace(/third\s/,"3 ").replace(/[^a-z0-9]/g,"");}

/* "Kejadian 1–2" / "Amsal 1:1-7" / "Lukas 22:39–24:50" / "Ester 3, 13" / "Obaja" -> [{ch, from, to}] */
function parseRest(rest){
  rest=(rest||"").replace(/–/g,"-").trim();
  if(!rest) return [{ch:1}];
  const out=[];
  for(let part of rest.split(",")){
    part=part.trim(); if(!part) continue;
    let m;
    if((m=part.match(/^(\d+):(\d+)-(\d+):(\d+)$/))){
      const c1=+m[1],v1=+m[2],c2=+m[3],v2=+m[4];
      for(let c=c1;c<=c2;c++) out.push({ch:c,from:c===c1?v1:null,to:c===c2?v2:null});
    } else if((m=part.match(/^(\d+)-(\d+):(\d+)$/))){
      for(let c=+m[1];c<=+m[2];c++) out.push({ch:c,from:null,to:c===+m[2]?+m[3]:null});
    } else if((m=part.match(/^(\d+):(\d+)-(\d+)$/))){ out.push({ch:+m[1],from:+m[2],to:+m[3]}); }
    else if((m=part.match(/^(\d+)-(\d+)$/))){ for(let c=+m[1];c<=+m[2];c++) out.push({ch:c}); }
    else if((m=part.match(/^(\d+)$/))){ out.push({ch:+m[1]}); }
  }
  return out;
}
function sabdaRef(r){
  const idBook=r.id.slice(0, r.id.length - r.rest.length).trim();
  const ab=SABDA_ABBR[idBook]; if(!ab) return null;
  return (ab+" "+(r.rest||"1")).replace(/–/g,"-").replace(/\s+/g," ").trim();
}

let LANGS=null; const BOOKS_CACHE={};
async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }
async function pickTranslations(){
  if(LANGS) return LANGS;
  const data=await getJSON(BOLLS+"/static/bolls/app/views/languages.json");
  const all=data.flatMap(l=>(l.translations||[]).map(t=>({code:t.short_name, name:t.full_name||t.short_name})));
  const find=(tests)=>{ for(const t of tests){ const hit=all.find(x=>t(x)); if(hit) return hit; } return null; };
  LANGS={
    heb: find([x=>x.code==="WLC", x=>/leningrad/i.test(x.name)]),
    lxx: find([x=>x.code==="LXX", x=>/septuag/i.test(x.name)]),
    gnt: find([x=>/^SBLGNT$/i.test(x.code), x=>/tischendorf/i.test(x.name), x=>/westcott/i.test(x.name), x=>/textus receptus/i.test(x.name), x=>/byzantine/i.test(x.name)]),
    eng: find([x=>/^WEB$/i.test(x.code), x=>/world english/i.test(x.name), x=>x.code==="KJV"])
  };
  return LANGS;
}
async function bookId(tr, enBook){
  if(!BOOKS_CACHE[tr]) BOOKS_CACHE[tr]=await getJSON(`${BOLLS}/get-books/${tr}/`);
  const keys=ALIASES[enBook]||[norm(enBook)];
  const hit=BOOKS_CACHE[tr].find(b=>keys.includes(norm(b.name||"")));
  return hit?hit.bookid:null;
}
function clean(t){ return String(t||"").replace(/<S>\d+<\/S>/gi,"").replace(/<sup>.*?<\/sup>/gi,"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim(); }
async function loadText(kind, r){
  const L=await pickTranslations();
  let tr;
  if(kind==="eng") tr=L.eng;
  else tr = NT_EN.includes(r.en) ? L.gnt : (isDK(r) ? L.lxx : L.heb);
  if(!tr) throw new Error("Terjemahan tidak ditemukan");
  const bid=await bookId(tr.code, r.en);
  if(!bid) return {tr, html:`<p class="empty">Kitab ini tidak tersedia dalam ${esc(tr.name)}.</p>`};
  const parts=parseRest(r.rest); let html="";
  for(const p of parts){
    let vs; try{ vs=await getJSON(`${BOLLS}/get-text/${tr.code}/${bid}/${p.ch}/`); }catch(e){ vs=[]; }
    vs=vs.filter(v=>(p.from==null||v.verse>=p.from)&&(p.to==null||v.verse<=p.to));
    html+=`<div class="rch">Pasal ${p.ch}</div>`;
    html+= vs.length ? vs.map(v=>`<p class="rv"><sup>${v.verse}</sup> ${esc(clean(v.text))}</p>`).join("") : `<p class="empty">Pasal ini tidak tersedia (penomoran bisa berbeda).</p>`;
  }
  return {tr, html};
}
function readerHTML(i){
  return `<div class="reader" id="rd${i}">
    <div class="rtabs"><button data-k="id" class="on">🇮🇩 Indonesia (LAI)</button><button data-k="orig">Bahasa asli</button><button data-k="eng">English</button></div>
    <div class="rbody"></div></div>`;
}
async function showReader(box, r, kind){
  const body=box.querySelector(".rbody");
  box.querySelectorAll(".rtabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===kind));
  if(kind==="id"){
    if(isDK(r)){ body.innerHTML=`<p class="empty">Kitab Deuterokanonika tidak tersedia di Alkitab SABDA. Silakan baca dari Alkitab Deuterokanonika LAI cetak, atau pilih tab "Bahasa asli" / "English".</p>`; return; }
    const ref=sabdaRef(r); const url=`https://alkitab.sabda.org/passage.php?passage=${encodeURIComponent(ref)}`;
    body.innerHTML=`<iframe class="rframe" src="${url}" loading="lazy" title="Alkitab SABDA"></iframe>
      <p class="rnote">Teks: Alkitab Terjemahan Baru © LAI, ditampilkan dari situs Alkitab SABDA. Kalau tidak tampil, <a href="${url}" target="_blank" rel="noopener">buka di sini</a>.</p>`;
    return;
  }
  body.innerHTML=`<p class="empty">Memuat…</p>`;
  try{
    const {tr, html}=await loadText(kind==="eng"?"eng":"orig", r);
    const rtl = kind==="orig" && tr.code===(LANGS.heb&&LANGS.heb.code);
    body.innerHTML=`<div class="rtext ${rtl?'rtl':''}">${html}</div><p class="rnote">Teks: ${esc(tr.name)} (${esc(tr.code)}), dari bolls.life.</p>`;
  }catch(e){
    body.innerHTML=`<p class="empty">Gagal memuat teks. Pastikan HP terhubung internet, lalu coba lagi.</p>`;
  }
}

/* ===== Penyimpanan (per perangkat) ===== */
const KEY="alkitab-keluarga-v1";
let S = {start:null, members:["Ayah","Ibu","Kakak","Adik"], done:{}, view:null};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s) S=Object.assign(S,s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function todayIndex(){
  if(!S.start) return 1;
  const a=new Date(S.start+"T00:00:00"), b=new Date(); b.setHours(0,0,0,0);
  const d=Math.floor((b-a)/86400000)+1;
  return Math.min(Math.max(d,1),365);
}
let current = S.view || todayIndex();

/* ===== Render ===== */
const $=s=>document.querySelector(s);
function esc(t){return t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function renderDay(d){
  const p=PLAN[d-1], per=periodOf(d), c=CONTENT[d];
  const doneSet = S.done[d]||[];
  const reads = p.reads.map((r,i)=>`<li><div class="row" style="width:100%;justify-content:space-between"><span>📖 <b>${esc(r.id)}</b>${isDK(r)?' <span class="dk">Deuterokanonika</span>':''}</span><button class="btn rbtn" data-i="${i}">Baca ayat ▾</button></div><div class="rslot" id="slot${i}"></div></li>`).join("");
  const mems = S.members.map((m,i)=>`<div class="mem ${doneSet.includes(i)?'done':''}" data-m="${i}"><span class="box">${doneSet.includes(i)?'✓':''}</span>${esc(m)}</div>`).join("");
  $("#v-today").innerHTML = `
  <div class="card">
    <span class="period" style="background:${per[2]}">${per[1]}</span>
    <div class="daytitle">Hari ${d} dari 365</div>
    <ul class="reads">${reads}</ul>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="prev" ${d<=1?'disabled':''}>← Sebelumnya</button>
      <button class="btn" id="tday">Hari ini</button>
      <button class="btn" id="next" ${d>=365?'disabled':''}>Berikutnya →</button>
    </div>
    <label class="f">Sudah baca hari ini (ketuk nama):</label>
    <div class="members">${mems}</div>
  </div>
  <div class="card sec">
    <div style="font-family:Fraunces,serif;font-size:19px;font-weight:700">Penjelasan 5W 1H</div>
    ${c ? `<p class="empty">Mencakup: ${esc(c.covers)}</p>${c.html}` :
      `<p class="empty">Penjelasan untuk hari ini belum disiapkan. Setiap penjelasan baru ditambahkan setelah diriset dan punya sumber. Sementara itu, bacalah ayat-ayatnya di Alkitab Deuterokanonika kalian.</p>`}
  </div>`;
  document.querySelectorAll("#v-today .rbtn").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, slot=$("#slot"+i);
    if(slot.innerHTML){ slot.innerHTML=""; b.textContent="Baca ayat ▾"; return; }
    slot.innerHTML=readerHTML(i); b.textContent="Tutup ▴";
    const box=slot.querySelector(".reader"), r=p.reads[i];
    box.querySelectorAll(".rtabs button").forEach(t=>t.onclick=()=>showReader(box,r,t.dataset.k));
    showReader(box,r,"id");
  });
  $("#prev").onclick=()=>go(d-1); $("#next").onclick=()=>go(d+1); $("#tday").onclick=()=>go(todayIndex());
  document.querySelectorAll("#v-today .mem").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.m; const arr=S.done[d]||[];
    S.done[d] = arr.includes(i) ? arr.filter(x=>x!==i) : [...arr,i];
    save(); renderDay(d);
  });
}
function go(d){ current=Math.min(Math.max(d,1),365); S.view=current; save(); renderDay(current); window.scrollTo(0,0); }

function renderAll(){
  const q=($("#q")&&$("#q").value||"").toLowerCase();
  const rows = PLAN.filter(p=> !q || ("hari "+p.day+" "+p.reads.map(r=>r.id).join(" ")).toLowerCase().includes(q))
    .map(p=>{ const per=periodOf(p.day); const n=(S.done[p.day]||[]).length;
      return `<div class="dayrow" data-d="${p.day}"><span class="dot" style="background:${per[2]}"></span><span class="dnum">${p.day}</span><span class="dtext">${p.reads.map(r=>esc(r.id)).join(" · ")}${CONTENT[p.day]?'<span class="has">● ada penjelasan</span>':''}</span><span class="ticks">${n?("✓ "+n+"/"+S.members.length):""}</span></div>`; }).join("");
  const box=$("#v-all");
  if(!$("#q")){ box.innerHTML=`<input id="q" placeholder="Cari kitab atau nomor hari… (mis. Lukas, Hari 100)"><div id="rows"></div>`; $("#q").oninput=renderAll; }
  $("#rows").innerHTML=rows || '<p class="empty">Tidak ditemukan.</p>';
  document.querySelectorAll(".dayrow").forEach(el=>el.onclick=()=>{ show("today"); go(+el.dataset.d); });
}

function renderFamily(){
  const prog = S.members.map((m,i)=>{ let n=0; for(const k in S.done) if(S.done[k].includes(i)) n++;
    const pct=Math.round(n/365*100);
    return `<div style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><b>${esc(m)}</b><span class="empty">${n} / 365 hari (${pct}%)</span></div><div class="prog"><div style="width:${pct}%"></div></div></div>`; }).join("");
  $("#v-family").innerHTML=`
  <div class="card"><div style="font-family:Fraunces,serif;font-size:19px;font-weight:700;margin-bottom:8px">Progres keluarga</div>${prog}</div>
  <div class="card">
    <label class="f">Tanggal mulai Hari 1</label>
    <input type="date" id="start" value="${S.start||''}">
    <label class="f">Anggota keluarga (pisahkan dengan koma)</label>
    <input class="t" id="mems" style="width:100%" value="${esc(S.members.join(', '))}">
    <div class="row" style="margin-top:12px"><button class="btn primary" id="saveF">Simpan</button><span id="saved" class="empty"></span></div>
    <p class="empty" style="margin-top:12px">Catatan: progres tersimpan di perangkat ini saja. Kalau dibuka di HP lain, centangnya tidak ikut. Paling mudah, pakai satu HP bersama.</p>
  </div>`;
  $("#saveF").onclick=()=>{ S.start=$("#start").value||null; const m=$("#mems").value.split(",").map(x=>x.trim()).filter(Boolean); if(m.length) S.members=m; save(); $("#saved").textContent="Tersimpan ✓"; current=todayIndex(); S.view=current; renderFamily(); };
}

function renderAbout(){
  $("#v-about").innerHTML=`
  <div class="card sec">
    <div style="font-family:Fraunces,serif;font-size:19px;font-weight:700">Aturan konten</div>
    <ul>
      <li><b>Ayat tidak diubah dan tidak ditambah.</b> Teks ayat ditampilkan langsung dari sumbernya lewat tombol "Baca ayat": Alkitab Terjemahan Baru LAI (dari situs Alkitab SABDA), teks bahasa asli Ibrani/Yunani, dan terjemahan Inggris (dari bolls.life).</li>
      <li><b>Setiap penjelasan harus punya sumber</b> yang bisa diklik.</li>
      <li>${T_G} = ajaran atau catatan resmi Gereja: Katekismus, Dei Verbum, catatan Alkitab NABRE yang disetujui para uskup.</li>
      <li>${T_R} = hasil penelitian dari museum, universitas, jurnal, atau ensiklopedia terpercaya. Bukan blog dan bukan opini pribadi.</li>
      <li><b>Tidak ada data, tidak ditulis.</b> Bagian yang belum diriset dikosongkan. Kalau sumber-sumber berbeda pendapat, perbedaannya ditampilkan apa adanya.</li>
      <li>Bagian "sementara itu di dunia" hanya muncul kalau berkaitan langsung dengan bacaan.</li>
    </ul>
  </div>
  <div class="card sec">
    <div style="font-family:Fraunces,serif;font-size:19px;font-weight:700">Tentang rencana baca</div>
    <p>Urutan 365 hari mengikuti <b>The Bible in a Year</b> dari Ascension Press (Fr. Mike Schmitz bersama Jeff Cavins), yang terinspirasi dari <i>The Great Adventure Bible Timeline</i>. Nama periode diterjemahkan ke bahasa Indonesia, dan warnanya hanya penanda di aplikasi ini, bukan warna resmi.</p>
    <div class="note">Daftar hari ini disalin dari PDF rencana baca resmi. Sebelum dipakai, sebaiknya cocokkan dengan PDF aslinya. Podcast-nya berbahasa Inggris.</div>
    <p><b>Penomoran pasal yang berbeda:</b></p>
    <ul>
      <li><b>Ester 11–16</b> adalah tambahan-tambahan Kitab Ester (Deuterokanonika). Di Alkitab Deuterokanonika LAI, bagian ini bisa saja diberi penomoran lain.</li>
      <li><b>Daniel 13–14</b> (kisah Susana, Bel, dan naga) juga termasuk Deuterokanonika. Daniel 3 dalam Alkitab Katolik juga memuat tambahan Deuterokanonika (Doa Azarya dan Kidung Tiga Pemuda).</li>
    </ul>
    <p class="srcs">📚 <a href="https://ascensionpress.com/biy">Ascension: The Bible in a Year</a> · <a href="https://assumptionparish.ca/wp-content/uploads/2025/06/Official-365-day-reading-plan-for-The-Bible-in-a-Year.pdf">PDF rencana baca 365 hari</a></p>
  </div>
  <div class="card sec">
    <div style="font-family:Fraunces,serif;font-size:19px;font-weight:700">Yang belum ada</div>
    <ul>
      <li>Penjelasan 5W 1H baru tersedia untuk Hari 1–7, 313, dan 359. Hari-hari lain menyusul satu per satu, setelah diriset.</li>
      <li>Bacaan liturgi harian Gereja dan kiriman Telegram belum dibuat.</li>
    </ul>
  </div>`;
}

function show(v){
  ["today","all","family","about"].forEach(x=>$("#v-"+x).classList.toggle("hide",x!==v));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="all") renderAll(); if(v==="family") renderFamily(); if(v==="about") renderAbout(); if(v==="today") renderDay(current);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
renderDay(current);
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
