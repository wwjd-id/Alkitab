45:{anak:{r:["Dua belas pengintai dikirim ke tanah Kanaan. Mereka pulang membawa setandan anggur yang besar sampai dipikul dua orang (13:23)! Negeri itu benar-benar subur. Tapi sepuluh pengintai berkata: penduduknya kuat dan tinggi, kami seperti belalang (13:33).","Hanya dua pengintai, Kaleb dan Yosua, yang berkata: jangan takut, TUHAN menyertai kita (14:9). Tapi bangsa itu lebih percaya sepuluh pengintai yang takut, bahkan ingin melempari Yosua dan Kaleb dengan batu.","Akibatnya, mereka harus mengembara empat puluh tahun di padang gurun (14:33–34). Rasa takut membuat mereka kehilangan hadiah dari Allah. Yang menarik: Kaleb dan Yosua, walaupun cuma berdua, tetap berani berbeda dari mayoritas."],
 tanya:["Pernah merasa seperti “belalang”, kecil dan tidak mampu?","Kenapa ya bangsa Israel lebih percaya pengintai yang takut?","Apa yang bikin Kaleb dan Yosua berani?"],
 aksi:"Hadapi satu hal yang kamu takuti minggu ini (presentasi, lomba, bicara dengan guru) dengan doa: “Tuhan menyertai aku.”"},
 ortu:{r:["Sepuluh pengintai melihat fakta yang sama dengan Kaleb dan Yosua: negeri yang subur dan penduduk yang kuat (13:27–28). Perbedaannya bukan pada data, tetapi pada cara pandang: “kami seperti belalang” (13:33) versus “TUHAN menyertai kita” (14:9). Cara orang tua membicarakan masalah keluarga akan membentuk cara anak memandang tantangan hidup mereka.","Laporan yang menakutkan menyebar dengan cepat dan membuat seluruh bangsa menangis semalaman (14:1). Kecemasan itu menular. Di rumah, kekhawatiran orang tua tentang keuangan, kesehatan, atau masa depan bisa terserap oleh anak-anak walaupun tidak diucapkan secara langsung.","Kaleb disebut “mempunyai roh lain dan mengikut TUHAN dengan sepenuhnya” (14:24). Ia dan Yosua minoritas, bahkan diancam dilempari batu (14:10). Membesarkan anak dengan nilai iman sering berarti siap menjadi “berbeda” dari standar lingkungan."],
 tanya:["Apakah kita lebih sering berbicara tentang masalah sebagai “raksasa” atau dengan iman?","Kecemasan apa yang mungkin tanpa sadar kita tularkan kepada anak-anak?","Dalam hal apa keluarga kita dipanggil untuk berani berbeda?"],
 aksi:"Minggu ini, setiap kali membicarakan masalah di depan anak, tambahkan juga bagaimana kita percaya Tuhan menolong. Pilih satu nilai keluarga yang akan kalian pegang walau berbeda dari lingkungan."}},
46:{anak:{r:["Korah dan teman-temannya memberontak melawan Musa dan Harun. Mereka berkata: kenapa kalian meninggikan diri di atas umat Tuhan (16:3)? Padahal Korah sendiri ingin kedudukan yang lebih tinggi. Kadang orang menuduh orang lain sombong, padahal ia sendiri yang iri.","Allah lalu menunjukkan pilihan-Nya dengan cara yang unik. Dua belas tongkat, satu untuk setiap suku, diletakkan di Kemah Suci. Besoknya, tongkat Harun bertunas, berbunga, dan berbuah badam (17:8)! Tongkat kayu kering bisa hidup lagi.","Di pasal 16 ada juga kisah ketika tulah melanda bangsa itu, Harun berlari membawa pedupaan dan berdiri di antara orang mati dan orang hidup, sampai tulah berhenti (16:48). Harun yang tadi diserang, sekarang malah menyelamatkan orang-orang yang menyerangnya."],
 tanya:["Pernah iri dengan peran atau posisi orang lain, misalnya ketua kelas atau kapten tim?","Apa artinya tongkat kering yang bisa bertunas?","Bagaimana sikap Harun kepada orang yang menyerangnya?"],
 aksi:"Kalau minggu ini kamu merasa iri pada seseorang, ucapkan selamat kepadanya dengan tulus dan doakan dia."},
 ortu:{r:["Korah dan kawan-kawannya membungkus ambisi pribadi dengan bahasa kesetaraan rohani: “segenap umat itu adalah orang-orang kudus” (16:3). Musa menunjukkan inti masalahnya: mereka sudah diberi tugas mulia, tetapi masih menginginkan jabatan imam (16:9–10). Ketidakpuasan bisa menyamar sebagai idealisme.","Dalam rumah tangga, persaingan peran bisa muncul diam-diam: siapa yang lebih berkorban, siapa yang lebih berhak dihargai, siapa yang keputusannya lebih benar. Bila tidak disadari, persaingan ini menggerogoti kesatuan.","Tongkat Harun yang bertunas (pasal 17) menyatakan bahwa kehidupan berasal dari Allah. Dan Harun berdiri di antara yang mati dan yang hidup (16:48) untuk orang-orang yang baru saja memberontak. Kepemimpinan dalam keluarga bukan soal posisi, melainkan kesediaan berdiri di celah demi orang lain, termasuk mereka yang mengecewakan kita."],
 tanya:["Adakah persaingan peran yang diam-diam terjadi di antara kita?","Ketidakpuasan apa yang mungkin menyamar sebagai “idealisme” dalam diri kita?","Untuk siapa kita perlu “berdiri di celah” saat ini?"],
 aksi:"Bicarakan dengan pasangan peran masing-masing tanpa saling menyalahkan, lalu saling ucapkan terima kasih. Doakan secara khusus satu anggota keluarga yang mengecewakan kalian."}},
47:{anak:{r:["Di pasal 20, bangsa itu kehausan lagi. Allah menyuruh Musa berbicara kepada bukit batu, tapi Musa yang kesal memukul batu itu dua kali (20:8–11). Air tetap keluar, tapi Musa tidak menghormati Allah di depan bangsa itu, dan karena itu ia tidak boleh masuk Kanaan (20:12). Bahkan orang hebat seperti Musa bisa salah karena marah.","Di pasal 21, bangsa itu mengeluh lagi, dan banyak yang dipagut ular. Allah menyuruh Musa membuat ular tembaga dan meninggikannya di atas tiang; setiap orang yang dipagut lalu memandang ular itu tetap hidup (21:8–9).","Yesus sendiri memakai kisah ini: seperti Musa meninggikan ular di padang gurun, demikian juga Anak Manusia harus ditinggikan, supaya setiap orang yang percaya memperoleh hidup kekal (Yohanes 3:14–15). Saat kita memandang salib Yesus, kita memandang Dia yang menyelamatkan."],
 tanya:["Pernah melakukan sesuatu yang kamu sesali karena sedang marah?","Apa yang bisa kamu lakukan saat mulai merasa kesal?","Apa hubungan ular tembaga dengan salib Yesus?"],
 aksi:"Kalau marah minggu ini, tarik napas dalam-dalam dan hitung sampai sepuluh sebelum berbicara atau bertindak. Pandang salib di rumahmu dan ucapkan terima kasih kepada Yesus."},
 ortu:{r:["Bilangan 20 dimulai dengan kematian Miryam (20:1), dan tidak lama kemudian Musa memukul batu dalam kemarahan (20:10–11). Duka dan kelelahan bisa membuat orang paling saleh sekalipun bertindak tanpa kendali. Saat kita sedang berduka atau kelelahan, kita lebih rentan menyakiti orang terdekat.","Musa tetap menanggung akibat dari tindakannya (20:12), walaupun Allah tetap memberi air bagi bangsa itu. Allah setia, tetapi tindakan kita tetap punya konsekuensi. Mengajarkan anak tentang konsekuensi dengan kasih adalah bagian dari mendidik, bukan bentuk kekejaman.","Ular tembaga (21:8–9) ditafsirkan Yesus sendiri sebagai gambaran salib (Yohanes 3:14). Di saat keluarga “dipagut” oleh masalah, kecanduan gawai, konflik, sakit, kita diajak mengarahkan pandangan kepada Kristus yang tersalib, sumber kesembuhan."],
 tanya:["Dalam keadaan apa kita paling mudah lepas kendali kepada keluarga?","Bagaimana kita menyeimbangkan kasih dan konsekuensi dalam mendidik anak?","Masalah apa yang sedang “memagut” keluarga kita?"],
 aksi:"Kenali satu tanda bahwa kamu mulai lelah atau tertekan, lalu sepakati dengan pasangan cara saling mengingatkan dengan lembut. Ajak keluarga berdoa di depan salib untuk satu masalah yang sedang dihadapi."}},
48:{anak:{r:["Raja Moab, Balak, ketakutan melihat Israel. Ia membayar Bileam, seorang pelihat terkenal, untuk mengutuk Israel. Di perjalanan, keledai Bileam melihat malaikat Tuhan menghadang, lalu menyimpang. Bileam memukulnya tiga kali, dan keledai itu berbicara (22:28)! Ternyata keledai melihat lebih jelas daripada tuannya.","Setiap kali Bileam membuka mulut untuk mengutuk, yang keluar justru berkat. Ia berkata: Allah bukan manusia, sehingga Ia berdusta (23:19). Apa yang Allah janjikan, pasti Ia tepati.","Bileam juga bernubuat: sebuah bintang terbit dari Yakub (24:17). Banyak orang Kristen memahami nubuat ini tentang Mesias. Rencana Allah untuk memberkati umat-Nya tidak bisa digagalkan oleh siapa pun."],
 tanya:["Pernah keras kepala seperti Bileam, padahal ada yang mengingatkanmu?","Apa artinya “Allah tidak berdusta” bagimu?","Siapa yang bisa mengubah kutuk menjadi berkat?"],
 aksi:"Dengarkan nasihat orang tua atau saudara minggu ini tanpa membantah dulu. Ucapkan berkat (kata-kata baik) untuk orang yang pernah berkata buruk tentangmu."},
 ortu:{r:["Kisah Bileam (pasal 22–24) penuh ironi: seorang pelihat terkenal tidak melihat malaikat yang dilihat keledainya (22:31). Kadang Allah memakai cara atau orang yang tidak kita duga untuk menghentikan langkah kita: anak yang polos, pasangan yang khawatir, atau keadaan yang menghambat.","Balak ingin mengutuk, tetapi Allah mengubahnya menjadi berkat. Bileam bersaksi: Allah bukan manusia, sehingga Ia berdusta (23:19). Di tengah kata-kata negatif yang mungkin diucapkan orang lain tentang keluarga kita, janji Allah tetap berdiri.","Menariknya, para arkeolog menemukan di Deir 'Alla, Yordania, sebuah teks kuno yang menyebut “Bileam bin Beor”. Ini mengingatkan bahwa kisah-kisah Alkitab berakar dalam dunia nyata. Namun yang terpenting dari kisah ini adalah pesannya: rencana Allah untuk memberkati umat-Nya tidak bisa digagalkan."],
 tanya:["Siapa “keledai” dalam hidup kita, yang melihat bahaya lebih dulu tetapi sering tidak kita dengar?","Kata-kata negatif apa tentang keluarga kita yang perlu kita lawan dengan janji Allah?","Bagaimana kita mengucapkan berkat, bukan kutuk, kepada anak-anak?"],
 aksi:"Minggu ini, ganti setiap kata negatif kepada anak (misalnya “kamu memang malas”) dengan kata berkat (“aku percaya kamu bisa bertanggung jawab”)."}},
49:{anak:{r:["Sensus kedua dilakukan setelah empat puluh tahun. Dari semua orang yang dihitung di Sinai, hanya Kaleb dan Yosua yang masih hidup (26:64–65). Generasi baru siap masuk tanah perjanjian.","Lalu ada kisah lima bersaudari, putri-putri Zelafehad: Mahla, Noa, Hogla, Milka, dan Tirza. Ayah mereka meninggal tanpa anak laki-laki, dan menurut kebiasaan mereka tidak mendapat warisan. Mereka berani datang kepada Musa dan meminta hak waris (27:1–4).","Musa membawa perkara itu kepada Tuhan, dan Tuhan berkata: perkataan mereka benar (27:7). Aturan pun diubah! Lima bersaudari yang berani dan kompak ini membuka jalan bagi banyak orang lain. Di akhir pasal 27, Yosua ditetapkan sebagai pemimpin baru menggantikan Musa."],
 tanya:["Pernah merasa diperlakukan tidak adil? Apa yang kamu lakukan?","Apa yang bisa kita pelajari dari kekompakan lima bersaudari itu?","Bagaimana cara menyampaikan pendapat dengan sopan tapi berani?"],
 aksi:"Kalau ada hal yang menurutmu tidak adil di rumah atau sekolah, sampaikan dengan sopan kepada orang yang tepat. Ajak saudaramu bekerja sama mengerjakan sesuatu."},
 ortu:{r:["Putri-putri Zelafehad (27:1–11) adalah teladan keberanian yang santun. Mereka tidak memberontak seperti Korah, tetapi datang dengan alasan yang jelas di hadapan pemimpin. Allah membenarkan mereka (27:7), dan hukum disesuaikan. Suara yang selama ini tidak terdengar ternyata penting bagi Allah.","Dalam keluarga, apakah anak-anak, terutama anak perempuan atau anak yang pendiam, punya ruang untuk menyampaikan pendapat? Keluarga yang sehat bukan keluarga tanpa perbedaan pendapat, tetapi keluarga yang tahu cara mendengar.","Di akhir pasal 27, Musa meminta Tuhan mengangkat pemimpin supaya umat tidak “seperti domba yang tidak mempunyai gembala” (27:17). Orang tua pun perlu memikirkan regenerasi: menyiapkan anak-anak untuk memikul tanggung jawab dan iman mereka sendiri suatu hari nanti."],
 tanya:["Apakah setiap anak punya ruang untuk menyampaikan pendapat di rumah?","Siapa di keluarga kita yang suaranya paling jarang terdengar?","Tanggung jawab apa yang mulai bisa kita percayakan kepada anak-anak?"],
 aksi:"Adakan “rapat keluarga” singkat minggu ini, beri setiap anak kesempatan menyampaikan satu usul atau keluhan, dan tanggapi dengan serius."}},
50:{anak:{r:["Bilangan 28–29 berisi jadwal korban: setiap pagi dan petang, setiap Sabat, setiap awal bulan, dan setiap hari raya. Ibadah Israel punya ritme yang tetap, dari harian sampai tahunan.","Bilangan 30 membahas nazar atau janji kepada Tuhan. Kalau seseorang bernazar, ia tidak boleh melanggar perkataannya; ia harus melakukan sesuai dengan yang diucapkannya (30:2). Janji itu serius!","Kita sering bilang “janji, deh!” dengan gampang. Padahal menepati janji menunjukkan bahwa kita bisa dipercaya. Yesus juga berkata: jika ya, hendaklah kamu katakan ya; jika tidak, katakan tidak (Matius 5:37)."],
 tanya:["Pernah berjanji lalu lupa atau tidak menepatinya?","Kenapa menepati janji itu penting?","Apa ritme doamu setiap hari?"],
 aksi:"Jangan mudah berjanji minggu ini. Kalau berjanji, tepati. Tulis satu janji yang belum kamu tepati, lalu selesaikan."},
 ortu:{r:["Jadwal korban di Bilangan 28–29 menata waktu Israel: harian, mingguan, bulanan, tahunan. Hidup rohani yang sehat jarang dibangun dari momen-momen besar saja, tetapi dari ritme kecil yang dijaga setia.","Bilangan 30:2 menegaskan bahwa nazar harus ditepati. Anak-anak memperhatikan apakah orang tuanya menepati janji: janji mengajak jalan-jalan, janji tidak marah, janji datang ke pentas sekolah. Janji yang sering dilanggar mengajarkan bahwa kata-kata tidak berarti.","Pasal ini juga memberi ruang bagi seorang ayah atau suami untuk meninjau nazar yang diucapkan tergesa-gesa (30:3–8). Kita bisa belajar berhati-hati sebelum berjanji, dan jujur mengakui bila janji tidak dapat ditepati, daripada diam-diam melupakannya."],
 tanya:["Ritme rohani apa yang sedang kita bangun di rumah?","Janji apa kepada anak yang belum kita tepati?","Apakah kita terlalu mudah berjanji?"],
 aksi:"Tepati satu janji kepada anak yang sempat tertunda. Bila ada janji yang tidak bisa ditepati, jelaskan dan minta maaf secara jujur."}},
51:{anak:{r:["Bilangan 31 menceritakan perang melawan Midian. Kisah perang di Perjanjian Lama memang sulit dipahami. Gereja mengajak kita membacanya dalam terang seluruh Kitab Suci, terutama ajaran Yesus untuk mengasihi musuh (Matius 5:44).","Di pasal 32, suku Ruben dan Gad melihat tanah di timur Yordan cocok untuk ternak mereka, dan meminta tinggal di sana. Musa awalnya marah, karena mengira mereka tidak mau membantu saudara-saudaranya berperang. Lalu mereka berjanji akan ikut berperang dulu sampai semua saudara mendapat tanahnya (32:16–18).","Musa mengingatkan: kalau kalian tidak menepati janji, kalian berdosa, dan ketahuilah dosamu akan menimpa kamu (32:23). Pasal 33 lalu mencatat semua tempat persinggahan Israel dari Mesir sampai ke Moab, seperti buku harian perjalanan bersama Tuhan."],
 tanya:["Pernah sudah selesai duluan, lalu tidak mau membantu teman atau saudara yang belum selesai?","Apa artinya “dosamu akan menimpa kamu”?","Kalau kamu menulis “buku harian perjalanan” bersama Tuhan, apa saja yang akan kamu tulis?"],
 aksi:"Kalau tugasmu sudah selesai, bantu saudara atau teman yang belum. Mulai tulis jurnal singkat tentang pengalamanmu bersama Tuhan."},
 ortu:{r:["Bilangan 31 termasuk teks yang berat untuk dibaca. Gereja mengajarkan bahwa Perjanjian Lama memuat hal-hal yang tidak sempurna dan bersifat sementara, sambil tetap menjadi pendidikan ilahi (Dei Verbum 15). Kita membacanya dalam terang Kristus.","Permintaan suku Ruben dan Gad (pasal 32) awalnya tampak egois: sudah mendapat yang enak, lalu tidak mau berjuang bersama. Musa menantang mereka, dan mereka bersedia ikut memikul beban saudara-saudaranya (32:16–18). Dalam keluarga besar maupun komunitas, mudah merasa “urusanku sudah beres” lalu tidak peduli pada yang lain.","Pasal 33 mendaftar setiap tempat persinggahan, termasuk tempat-tempat yang mengingatkan kegagalan. Menuliskan sejarah keluarga, yang manis dan yang pahit, dapat menjadi cara mengenang kesetiaan Allah sepanjang perjalanan."],
 tanya:["Bagaimana kita menjelaskan teks-teks sulit dalam Alkitab kepada anak?","Adakah saudara atau tetangga yang masih “berjuang” sementara kita sudah nyaman?","“Tempat persinggahan” apa saja yang pernah dilalui keluarga kita?"],
 aksi:"Bersama anak-anak, buat garis waktu sederhana perjalanan keluarga kalian (menikah, pindah rumah, kelahiran, masa sulit), lalu syukuri penyertaan Tuhan di setiap tahap."}},
52:{anak:{r:["Bilangan 34 mencatat batas-batas tanah yang akan diwarisi Israel. Allah menepati janji-Nya kepada Abraham dulu sekali. Janji Allah tidak pernah terlupakan, walau memakan waktu ratusan tahun.","Bilangan 35 berbicara tentang kota perlindungan. Orang yang tidak sengaja membunuh bisa lari ke sana supaya tidak dibalas dendam sebelum diadili (35:11–12). Allah ingin keadilan, bukan main hakim sendiri.","Kitab Bilangan ditutup dengan kisah putri-putri Zelafehad lagi. Mereka menaati aturan untuk menikah dalam suku mereka supaya tanah warisan tetap di suku itu (36:10–12). Kitab ini dimulai dengan sensus di padang gurun, dan berakhir di tepi tanah perjanjian. Perjalanan panjang hampir sampai!"],
 tanya:["Janji Allah apa yang sedang kamu tunggu?","Kenapa main hakim sendiri itu tidak baik?","Dari Kitab Bilangan, kisah mana yang paling kamu ingat?"],
 aksi:"Kalau ada yang berbuat salah kepadamu minggu ini, jangan membalas sendiri. Ceritakan kepada orang tua atau guru. Ceritakan kisah favoritmu dari Kitab Bilangan kepada keluarga."},
 ortu:{r:["Kota-kota perlindungan (pasal 35) menunjukkan bahwa hukum Allah membedakan kesengajaan dan ketidaksengajaan, dan membatasi balas dendam. Rumah kita juga bisa menjadi “kota perlindungan”: tempat anak berani datang ketika ia berbuat salah, karena tahu ia akan diperlakukan adil, bukan langsung dihukum oleh emosi.","Kitab Bilangan adalah kisah empat puluh tahun pengembaraan, penuh keluhan, pemberontakan, dan kesetiaan Allah yang tetap. Generasi pertama gagal masuk, tetapi generasi kedua berdiri di tepi tanah perjanjian. Ada harapan bagi keluarga yang pernah gagal: anak-anak kita bisa melangkah lebih jauh daripada kita.","Di sepanjang kitab ini, Allah tidak pernah meninggalkan umat-Nya: awan tetap menuntun, manna tetap turun. Kegagalan kita tidak membatalkan kesetiaan Allah."],
 tanya:["Apakah rumah kita menjadi “kota perlindungan” bagi anak yang berbuat salah?","Kegagalan apa dari generasi kita yang kita harap tidak terulang pada anak-anak?","Di mana kita melihat kesetiaan Allah di tengah kegagalan kita?"],
 aksi:"Katakan kepada anak-anak: “Kalau kamu berbuat salah, datanglah kepada kami. Kami akan mendengar dulu.” Lalu buktikan saat kesempatan itu datang."}},
53:{anak:{r:["Kitab Ulangan berisi pidato-pidato terakhir Musa sebelum Israel masuk tanah perjanjian. Musa sudah tua, dan ia mengingatkan generasi baru tentang semua yang terjadi selama empat puluh tahun. Seperti kakek yang bercerita kepada cucu-cucunya.","Musa mengingatkan pesannya kepada para hakim: jangan memandang bulu, dengarkan perkara orang kecil sama seperti orang besar (Ulangan 1:17). Adil kepada semua orang, bukan hanya kepada teman dekat atau yang populer.","Musa juga bercerita betapa ia sangat ingin masuk ke negeri itu. Ia memohon, tapi Tuhan berkata: cukup, jangan lagi berbicara kepada-Ku tentang perkara itu (3:26). Musa tidak memaksa, tapi ia malah menguatkan Yosua, penggantinya (3:28). Kadang kita tidak mendapat yang kita minta, tapi kita bisa membantu orang lain mendapatkannya."],
 tanya:["Pernah tidak mendapat sesuatu yang sangat kamu inginkan? Bagaimana perasaanmu?","Apa contoh “memandang bulu” di sekolah?","Bagaimana kamu bisa menyemangati orang lain walau kamu sendiri sedang kecewa?"],
 aksi:"Perlakukan semua teman dengan adil minggu ini, bukan hanya teman dekatmu. Semangati seseorang yang sedang berusaha meraih sesuatu."},
 ortu:{r:["Ulangan dibuka dengan Musa yang menceritakan ulang perjalanan bangsa itu kepada generasi baru (1:1–5). Generasi yang mendengar ini sebagian besar tidak mengalami sendiri peristiwa di Mesir dan Sinai. Setiap generasi perlu mendengar ulang kisah iman, karena iman tidak otomatis diwariskan.","Musa jujur tentang kekecewaannya: ia memohon masuk tetapi ditolak (3:23–26). Ia tidak menyembunyikan luka itu, tetapi juga tidak membiarkannya menjadi kepahitan. Ia mengalihkan energinya untuk menguatkan Yosua (3:28). Orang tua sering harus menerima bahwa beberapa impian kita tidak terwujud, lalu memilih menginvestasikan diri pada generasi berikutnya.","Hati-hati: menginvestasikan diri pada anak berbeda dengan memaksakan impian kita yang gagal kepada mereka. Musa menguatkan Yosua untuk tugas yang diberikan Allah kepada Yosua, bukan untuk menghidupkan ambisi Musa sendiri."],
 tanya:["Kisah iman keluarga apa yang belum pernah kita ceritakan kepada anak-anak?","Impian apa yang tidak terwujud, dan bagaimana kita menyikapinya?","Apakah kita mendukung anak untuk panggilannya sendiri, atau untuk impian kita?"],
 aksi:"Ceritakan kepada anak-anak bagaimana kalian berdua bertemu dan bagaimana Tuhan menuntun keluarga ini. Tanyakan kepada setiap anak apa impiannya, dan dengarkan tanpa mengarahkan."}},
54:{anak:{r:["Musa berpesan: jangan menambahi atau mengurangi firman Tuhan (Ulangan 4:2). Lalu: hati-hatilah supaya kamu tidak lupa apa yang sudah kamu lihat, dan beritahukanlah kepada anak-anakmu dan cucu-cucumu (4:9). Iman itu diceritakan dari generasi ke generasi.","Musa juga berkata: bangsa besar manakah yang mempunyai allah yang demikian dekat kepadanya seperti TUHAN, Allah kita, setiap kali kita memanggil kepada-Nya (4:7)? Allah kita tidak jauh. Ia dekat setiap kali kita berdoa.","Di pasal 5, Musa mengulang Sepuluh Firman. Di pasal 6:4–5 ada doa yang sangat terkenal bagi orang Yahudi, disebut Shema: Dengarlah, hai Israel: TUHAN itu Allah kita, TUHAN itu esa! Kasihilah TUHAN, Allahmu, dengan segenap hatimu, dengan segenap jiwamu, dan dengan segenap kekuatanmu. Yesus menyebut ini hukum yang terutama."],
 tanya:["Apa artinya mengasihi Tuhan “dengan segenap hati”?","Kapan kamu merasa Allah dekat?","Cerita iman apa dari orang tua atau kakek-nenek yang kamu ingat?"],
 aksi:"Hafalkan Ulangan 6:4–5. Tanyakan kepada kakek-nenek atau orang tua satu pengalaman mereka bersama Tuhan."},
 ortu:{r:["Ulangan 6:6–7 adalah peta jalan pendidikan iman keluarga: firman itu harus ada di hati orang tua dulu, lalu diajarkan berulang-ulang kepada anak, saat duduk di rumah, dalam perjalanan, saat berbaring, dan saat bangun. Iman tidak hanya diajarkan di gereja atau di kelas agama, tetapi dalam percakapan sehari-hari.","Perhatikan urutannya: “apa yang kuperintahkan kepadamu pada hari ini haruslah engkau perhatikan” (6:6), baru kemudian “haruslah engkau mengajarkannya berulang-ulang kepada anak-anakmu” (6:7). Kita tidak bisa memberikan apa yang tidak kita miliki.","Ulangan 6:20–21 mengantisipasi anak bertanya: apa arti semua peraturan ini? Jawabannya bukan “karena aturannya begitu”, tetapi sebuah cerita: “Kita dahulu budak Firaun di Mesir, tetapi TUHAN membawa kita keluar.” Aturan iman paling bermakna ketika dijelaskan melalui kisah kasih Allah."],
 tanya:["Kapan dan di mana percakapan iman paling alami terjadi di keluarga kita?","Apakah firman Tuhan sungguh ada di hati kita sendiri saat ini?","Bagaimana kita biasanya menjawab saat anak bertanya “kenapa harus ke gereja”?"],
 aksi:"Manfaatkan satu perjalanan di mobil atau motor minggu ini untuk mengobrol tentang Tuhan secara santai. Tempel Ulangan 6:4–5 di tempat yang terlihat di rumah."}},
55:{anak:{r:["Musa berkata: Allah memilih Israel bukan karena mereka bangsa yang paling besar, malah mereka yang paling kecil, tetapi karena Tuhan mengasihi mereka (Ulangan 7:7–8). Allah tidak memilih kita karena kita hebat, tapi karena Ia mengasihi kita.","Di pasal 8, Musa mengingatkan: selama empat puluh tahun di padang gurun, pakaian mereka tidak menjadi buruk dan kaki mereka tidak bengkak (8:4). Allah memelihara mereka. Ia juga mengajari bahwa manusia hidup bukan dari roti saja, tetapi dari setiap firman yang diucapkan Tuhan (8:3). Yesus mengutip ayat ini waktu dicobai iblis.","Di pasal 9, Musa berkata dengan jujur: kamu masuk negeri itu bukan karena kamu benar; kamu bangsa yang tegar tengkuk (9:6). Semua yang kita terima adalah anugerah, bukan karena kita pantas."],
 tanya:["Gimana rasanya tahu Allah mengasihimu bukan karena kamu hebat?","Apa “roti” lain yang kita butuhkan selain makanan?","Apa artinya “tegar tengkuk”? Pernah begitu?"],
 aksi:"Baca satu perikop Injil sebelum tidur setiap malam minggu ini sebagai “makanan” rohani."},
 ortu:{r:["Ulangan 7:7–8 menyentuh inti iman kita: Allah memilih bukan karena kebesaran, tetapi karena kasih. Anak-anak kita hidup di dunia yang terus mengukur: nilai, ranking, pengikut, penampilan. Menyampaikan kepada mereka bahwa kasih Allah tidak didasarkan pada prestasi adalah hadiah yang membebaskan.","Ulangan 8:11–18 memberi peringatan bagi keluarga yang mulai mapan: jangan sampai ketika rumahmu bagus dan hartamu bertambah, hatimu tinggi dan engkau berkata “kekuatanku sendiri yang membuat aku kaya”. Ingatlah, Tuhanlah yang memberi kekuatan (8:17–18). Kemakmuran sering lebih berbahaya bagi iman daripada kesusahan.","Ulangan 9:4–6 menghancurkan rasa “kami lebih baik”. Israel menerima negeri itu bukan karena kesalehan mereka. Ini mengajarkan kerendahan hati: keluarga yang diberkati bukan berarti lebih saleh daripada keluarga yang sedang susah."],
 tanya:["Apakah anak-anak merasa dikasihi tanpa syarat, atau karena prestasi?","Dalam hal apa kita mulai merasa “ini hasil kerja kerasku sendiri”?","Apakah kita pernah diam-diam merasa lebih baik daripada keluarga lain?"],
 aksi:"Tulis bersama anak-anak daftar berkat yang keluarga terima tahun ini, lalu doakan syukur. Katakan kepada setiap anak: “Kami mengasihimu bukan karena nilaimu, tapi karena kamu anak kami.”"}},
56:{anak:{r:["Musa bertanya: apakah yang dituntut TUHAN, Allahmu, dari padamu? Jawabannya: takut akan Tuhan, hidup menurut jalan-Nya, mengasihi Dia, dan beribadah kepada-Nya dengan segenap hati (Ulangan 10:12). Tidak rumit, tapi butuh seluruh hati.","Allah juga membela anak yatim, janda, dan orang asing (10:18). Karena itu, kamu juga harus mengasihi orang asing, sebab dulu kamu pun orang asing di Mesir (10:19). Teman baru, anak pindahan, atau orang yang berbeda suku juga harus kita sambut.","Di pasal 11, Musa berkata: taruhlah perkataanku ini dalam hatimu, ajarkan kepada anak-anakmu, dan bicarakan saat di rumah dan di jalan (11:18–19). Ada berkat kalau taat dan kutuk kalau tidak (11:26–28). Hidup penuh pilihan, dan setiap pilihan ada akibatnya."],
 tanya:["Dari Ulangan 10:12, mana yang paling mudah dan paling sulit buatmu?","Siapa “orang asing” di sekolahmu yang perlu disambut?","Pilihan apa yang akan kamu buat minggu ini?"],
 aksi:"Sambut teman baru atau anak yang jarang diajak, dengan menyapanya atau mengajaknya bergabung."},
 ortu:{r:["Ulangan 10:12–13 merangkum tuntutan Allah dengan sederhana: takut akan Tuhan, hidup menurut jalan-Nya, mengasihi-Nya, beribadah dengan segenap hati, dan berpegang pada perintah-Nya “supaya baik keadaanmu”. Perintah Allah diberikan untuk kebaikan kita, bukan untuk membebani.","Allah digambarkan sebagai yang “membela hak anak yatim dan janda dan menunjukkan kasih-Nya kepada orang asing” (10:18). Lalu umat diminta meniru Allah (10:19). Iman yang sejati selalu punya wajah sosial. Anak-anak perlu melihat orang tuanya peduli kepada yang lemah, bukan hanya rajin beribadah.","Ulangan 11:18–21 mengulang tema mendidik anak: firman di hati, di tangan, di dahi, di tiang pintu. Pengulangan ini menunjukkan betapa pentingnya hal ini bagi Allah. Dalam budaya Yahudi, ayat-ayat ini benar-benar ditulis dan dipasang di tiang pintu (mezuzah)."],
 tanya:["Apakah kita melihat perintah Allah sebagai beban atau sebagai jalan menuju kebaikan?","Bagaimana anak-anak melihat kita memperlakukan orang yang lemah?","Simbol iman apa yang bisa kita pasang di rumah sebagai pengingat?"],
 aksi:"Pasang salib atau ayat Kitab Suci di pintu masuk rumah sebagai pengingat. Lakukan satu tindakan nyata bersama anak bagi orang asing atau pendatang di lingkunganmu."}},
57:{anak:{r:["Ulangan 13 memperingatkan: kalau ada nabi atau bahkan saudaramu sendiri yang mengajak menyembah allah lain, jangan ikuti (13:1–8). Tidak semua yang terdengar hebat itu benar. Kita perlu berhati-hati dengan ajakan yang menjauhkan kita dari Tuhan, termasuk dari internet.","Ulangan 14 membahas persepuluhan. Setiap tiga tahun, persepuluhan dikumpulkan untuk orang Lewi, orang asing, anak yatim, dan janda, supaya mereka bisa makan sampai kenyang (14:28–29). Memberi untuk Tuhan berarti juga memberi untuk orang yang membutuhkan.","Ulangan 15 berbicara tentang tahun penghapusan utang setiap tujuh tahun. Allah berkata: jangan menegarkan hati dan menggenggam tangan terhadap saudaramu yang miskin, tetapi bukalah tanganmu lebar-lebar (15:7–8). Tangan yang terbuka itu tanda hati yang murah hati."],
 tanya:["Pernah melihat ajakan atau konten di internet yang bisa menjauhkan dari Tuhan?","Apa yang bisa kamu berikan untuk orang yang membutuhkan?","Apa bedanya tangan yang “digenggam” dan tangan yang “terbuka”?"],
 aksi:"Sisihkan sebagian uang sakumu minggu ini untuk dibagikan kepada orang yang membutuhkan atau untuk kolekte."},
 ortu:{r:["Ulangan 13 menekankan kewaspadaan terhadap pengaruh yang menyesatkan, bahkan dari orang terdekat (13:6). Hari ini, pengaruh semacam itu datang lewat gawai, media sosial, dan tontonan, langsung ke kamar anak. Mendampingi anak di dunia digital adalah bagian dari tanggung jawab iman orang tua.","Persepuluhan dalam Ulangan 14:22–29 bukan hanya untuk ibadah, tetapi juga untuk dimakan bersama dengan sukacita dan dibagikan kepada orang Lewi, orang asing, yatim, dan janda. Keuangan keluarga adalah wilayah iman: cara kita membelanjakan, menabung, dan memberi mencerminkan apa yang kita anggap penting.","Ulangan 15:7–11 meminta tangan terbuka bagi orang miskin, dan memberi “dengan rela hati” (15:10). Ayat 15:11 mengakui bahwa orang miskin akan selalu ada; justru karena itu, kemurahan hati harus menjadi kebiasaan, bukan reaksi sesekali."],
 tanya:["Apakah kita tahu apa yang ditonton dan diikuti anak-anak di gawai mereka?","Apa yang terungkap tentang prioritas kita dari cara kita mengatur keuangan keluarga?","Apakah memberi sudah menjadi kebiasaan keluarga, atau hanya sesekali?"],
 aksi:"Duduk bersama anak dan lihat aplikasi atau akun yang mereka ikuti, dengan sikap ingin tahu, bukan menghakimi. Tetapkan bersama pasangan satu pos “memberi” dalam anggaran keluarga."}},
58:{anak:{r:["Ulangan 16 berbicara tentang hari raya. Yang menarik: semua orang harus ikut bersukaria, termasuk budak, orang Lewi, orang asing, anak yatim, dan janda (16:14). Pesta Tuhan bukan hanya untuk orang kaya atau keluarga sendiri; semua diajak!","Ada juga ayat tegas untuk para hakim: semata-mata keadilan, itulah yang harus kaukejar (16:20). Jangan menerima suap, karena suap membutakan mata orang bijaksana (16:19).","Di pasal 18, Allah berjanji akan membangkitkan seorang nabi seperti Musa (18:15). Para rasul memahami nubuat ini terpenuhi dalam diri Yesus (Kisah Para Rasul 3:22). Di pasal yang sama, Allah melarang tenung, sihir, dan meminta petunjuk kepada arwah (18:10–11), karena kita cukup bertanya kepada Allah."],
 tanya:["Kalau keluargamu mengadakan pesta, siapa yang bisa diundang selain keluarga dan teman dekat?","Apa contoh “suap” kecil dalam kehidupan anak-anak?","Kenapa kita tidak perlu ramalan atau jimat?"],
 aksi:"Ajak keluarga berbagi makanan dengan orang yang jarang diundang, misalnya satpam, tetangga yang tinggal sendiri, atau petugas kebersihan."},
 ortu:{r:["Ulangan 16:11, 14 mengulang daftar yang sama: anakmu, budakmu, orang Lewi, orang asing, anak yatim, dan janda harus ikut bersukaria. Perayaan iman yang sejati selalu memperluas lingkaran, bukan mempersempitnya. Cara keluarga kita merayakan Natal dan Paskah bisa menjadi kesempatan untuk mengajak mereka yang biasanya tidak diundang.","“Semata-mata keadilan, itulah yang harus kaukejar” (16:20). Orang tua pun berperan sebagai “hakim” di rumah: menengahi pertengkaran anak, membuat keputusan, memberi konsekuensi. Anak-anak sangat peka terhadap ketidakadilan dan pilih kasih.","Ulangan 17:18–19 meminta raja menyalin kitab hukum dan membacanya setiap hari, supaya hatinya tidak sombong terhadap saudara-saudaranya (17:20). Pemimpin keluarga pun butuh firman setiap hari agar kekuasaan tidak membuat kita lupa diri."],
 tanya:["Siapa yang bisa kita ajak dalam perayaan keluarga berikutnya?","Apakah anak-anak merasa kita adil, atau ada yang merasa dianaktirikan?","Seberapa sering kita membaca firman Tuhan secara pribadi?"],
 aksi:"Tanyakan kepada setiap anak secara pribadi: “Pernahkah kamu merasa Ayah/Ibu tidak adil?” Dengarkan, lalu perbaiki bila perlu. Mulai kebiasaan membaca satu perikop Kitab Suci setiap hari."}},
59:{anak:{r:["Ulangan 19 berbicara lagi tentang kota perlindungan, dan juga tentang saksi: suatu perkara baru sah kalau ada dua atau tiga saksi (19:15). Jadi kita tidak boleh langsung percaya gosip atau kabar dari satu orang saja.","Ada juga larangan menggeser batas tanah milik sesamamu (19:14). Zaman sekarang, mungkin artinya tidak mengambil hak orang lain diam-diam, misalnya mengaku hasil kerja kelompok sebagai kerja sendiri.","Di pasal 20, sebelum berperang, ada pengumuman: yang baru membangun rumah, baru menanam kebun anggur, baru bertunangan, atau yang takut boleh pulang (20:5–8). Allah peduli pada kehidupan dan perasaan orang-orang, bahkan di saat genting."],
 tanya:["Pernah percaya gosip yang ternyata tidak benar?","Apa contoh “menggeser batas tanah” di sekolah?","Apa yang kamu pelajari dari Allah yang peduli pada orang yang takut?"],
 aksi:"Kalau mendengar gosip tentang seseorang minggu ini, jangan teruskan ke orang lain."},
 ortu:{r:["Prinsip dua atau tiga saksi (19:15) melindungi orang dari tuduhan yang sembarangan. Dalam keluarga, kita kadang langsung menghukum anak berdasarkan laporan sepihak dari saudaranya atau dari guru. Mendengarkan semua pihak adalah bentuk keadilan dan penghormatan.","Ulangan 20:5–7 membebaskan dari wajib perang orang yang baru membangun rumah, menanam kebun, atau bertunangan. Di pasal 24:5, pengantin baru dibebaskan setahun untuk membahagiakan istrinya. Hukum Allah menghargai momen-momen penting dalam kehidupan keluarga.","Ulangan 21 memuat hukum-hukum yang keras, termasuk tentang anak yang durhaka (21:18–21). Kita membacanya sebagai bagian dari konteks zaman kuno. Namun di baliknya ada pesan: anak yang berulang kali memberontak tidak dihadapi oleh satu orang tua saja, tetapi oleh ayah dan ibu bersama (21:19). Kesatuan orang tua dalam mendidik sangat penting."],
 tanya:["Apakah kita mendengar semua pihak sebelum menghukum anak?","Momen penting keluarga apa yang perlu kita lindungi dari kesibukan?","Apakah kita kompak sebagai orang tua dalam menghadapi anak, atau saling bertentangan di depan mereka?"],
 aksi:"Saat ada konflik antar-anak berikutnya, dengarkan setiap pihak sebelum memutuskan. Sepakati dengan pasangan: perbedaan pendapat tentang mendidik anak dibicarakan berdua, bukan di depan anak."}},
60:{anak:{r:["Ulangan 22:1–4 berkata: kalau melihat domba atau lembu milik saudaramu tersesat, jangan pura-pura tidak tahu; kembalikan. Hari ini, mungkin itu berarti mengembalikan barang teman yang tertinggal, atau dompet yang kamu temukan.","Ayat 22:8 juga unik: kalau membangun rumah, buatlah pagar di atapnya, supaya tidak ada yang jatuh. Kita harus memikirkan keselamatan orang lain, bukan hanya diri sendiri.","Di pasal 24, ada perintah: bayarlah upah pekerja pada hari itu juga, sebelum matahari terbenam, karena ia miskin dan mengharapkannya (24:15). Ada juga perintah meninggalkan sisa panen untuk orang asing, yatim, dan janda (24:19). Allah peduli pada orang-orang kecil."],
 tanya:["Pernah menemukan barang orang lain? Apa yang kamu lakukan?","Bagaimana caramu memikirkan keselamatan orang lain?","Siapa saja “pekerja” yang membantu keluargamu, dan bagaimana kamu bisa menghargai mereka?"],
 aksi:"Ucapkan terima kasih dengan tulus kepada orang yang membantu keluargamu: asisten rumah tangga, sopir, satpam, atau tukang sampah."},
 ortu:{r:["Ulangan 22:1–4 melarang sikap “pura-pura tidak tahu” terhadap kesulitan sesama. Pagar di atap (22:8) mengajarkan tanggung jawab atas keselamatan orang lain di wilayah kita. Kepedulian seperti ini adalah bentuk kasih yang sangat praktis.","Ulangan 24:14–15 tegas: jangan menindas pekerja upahan yang miskin, bayarlah upahnya pada hari itu juga. Banyak keluarga memiliki asisten rumah tangga, sopir, atau tukang. Cara kita memperlakukan mereka, membayar tepat waktu, berbicara dengan hormat, memberi waktu istirahat, adalah pelajaran iman yang paling nyata bagi anak-anak.","Pengantin baru dibebaskan dari tugas perang selama setahun untuk membahagiakan istrinya (24:5). Hukum kuno ini mengakui bahwa pernikahan butuh waktu dan perhatian untuk bertumbuh. Pernikahan yang sudah berjalan lama pun tetap butuh dirawat."],
 tanya:["Bagaimana kita memperlakukan orang yang bekerja untuk keluarga kita?","Dalam hal apa kita pernah “pura-pura tidak tahu” terhadap kesulitan orang lain?","Apa yang bisa kita lakukan untuk “membahagiakan” pasangan minggu ini?"],
 aksi:"Pastikan semua orang yang bekerja untuk keluarga kalian dibayar tepat waktu dan diperlakukan dengan hormat di depan anak-anak. Rencanakan satu kejutan kecil untuk pasangan."}},
61:{anak:{r:["Ulangan 25 berisi perintah tentang timbangan: jangan punya dua macam batu timbangan, besar dan kecil (25:13–15). Artinya, jangan curang! Pedagang yang curang memakai timbangan berbeda untuk membeli dan menjual.","Ada juga perintah unik: jangan memberangus mulut lembu yang sedang mengirik (25:4). Hewan yang bekerja boleh makan dari hasil kerjanya. Paulus mengutip ayat ini untuk mengajarkan bahwa orang yang bekerja layak menerima upahnya (1 Korintus 9:9).","Di pasal 26, orang Israel yang membawa buah sulung harus mengucapkan pengakuan: bapaku dahulu seorang Aram, seorang pengembara (26:5), lalu menceritakan bagaimana Tuhan membebaskan mereka. Setiap kali bersyukur, mereka mengingat dari mana mereka berasal."],
 tanya:["Pernah tergoda curang, misalnya dalam ujian atau permainan?","Kenapa penting mengingat dari mana kita berasal?","Apa “buah sulung”, hal pertama dan terbaik, yang bisa kamu persembahkan?"],
 aksi:"Bermain atau mengerjakan tugas dengan jujur minggu ini walau tidak ada yang melihat. Persembahkan waktu pertama di pagi hari untuk doa singkat."},
 ortu:{r:["Larangan dua macam batu timbangan (25:13–16) menyangkut kejujuran dalam urusan ekonomi. Dalam keluarga, “timbangan ganda” juga bisa muncul: aturan yang ketat untuk anak tetapi longgar untuk diri sendiri, misalnya soal gawai, kata-kata kasar, atau ketepatan waktu. Anak-anak cepat sekali menangkap standar ganda.","Pengakuan dalam Ulangan 26:5–10 adalah salah satu “syahadat” tertua dalam Kitab Suci: kisah singkat tentang leluhur yang mengembara, perbudakan di Mesir, dan pembebasan oleh Tuhan. Persembahan buah sulung disertai cerita tentang siapa kita dan apa yang Allah lakukan.","Keluarga kita juga punya “syahadat”: kisah dari mana kita berasal, kesulitan yang pernah dialami, dan bagaimana Tuhan menolong. Menceritakan kisah ini memberi akar bagi anak-anak, terutama di dunia yang cepat berubah."],
 tanya:["Di mana kita menerapkan “timbangan ganda” antara aturan untuk anak dan untuk diri sendiri?","Apa “syahadat” keluarga kita, kisah dari mana kita berasal?","Apa yang kita persembahkan sebagai “buah sulung” kepada Tuhan?"],
 aksi:"Pilih satu aturan rumah yang juga akan kalian taati sebagai orang tua, misalnya tidak memakai gawai saat makan. Ceritakan kepada anak-anak kisah perjalanan kakek-nenek mereka."}},
62:{anak:{r:["Ulangan 28 adalah pasal panjang tentang berkat jika taat dan kutuk jika tidak taat. Dalam bagian berkat ada janji: TUHAN akan mengangkat engkau menjadi kepala dan bukan menjadi ekor (28:13). Hidup bersama Tuhan membawa kebaikan.","Di pasal 29, perjanjian diperbarui dengan semua orang, termasuk anak-anak (29:11). Kamu juga bagian dari perjanjian Allah! Musa juga berkata: hal-hal yang tersembunyi ialah bagi Tuhan, tetapi hal-hal yang dinyatakan ialah bagi kita dan anak-anak kita (29:29). Tidak semua hal harus kita mengerti; yang penting, kita lakukan apa yang sudah jelas.","Di pasal 30, Musa berkata: firman ini sangat dekat kepadamu, di dalam mulutmu dan di dalam hatimu (30:14). Lalu: aku menghadapkan kepadamu kehidupan dan kematian, berkat dan kutuk. Pilihlah kehidupan (30:19)!"],
 tanya:["Apa artinya “memilih kehidupan” untuk anak seusiamu?","Gimana rasanya tahu kamu juga bagian dari perjanjian Allah?","Ada hal tentang Tuhan yang belum kamu mengerti? Tidak apa-apa, kan?"],
 aksi:"Setiap pagi minggu ini, ucapkan dalam hati: “Hari ini aku memilih kehidupan,” lalu pilih satu tindakan baik yang akan kamu lakukan."},
 ortu:{r:["Ulangan 29:10–15 menyebut siapa saja yang berdiri dalam perjanjian: para pemimpin, laki-laki, istri, anak-anak, orang asing, bahkan mereka yang “tidak ada di sini pada hari ini”, yaitu generasi yang akan datang. Iman keluarga melampaui generasi kita sendiri.","Ulangan 29:29 adalah ayat yang menenangkan: hal-hal yang tersembunyi milik Tuhan, tetapi yang dinyatakan milik kita dan anak-anak kita untuk dilakukan. Kita tidak harus punya jawaban atas semua pertanyaan anak, atau atas penderitaan yang tidak kita mengerti. Kita cukup setia pada apa yang sudah jelas.","“Pilihlah kehidupan” (30:19) diikuti dengan alasan: “supaya engkau hidup, baik engkau maupun keturunanmu”. Pilihan orang tua berdampak pada anak-anak: kebiasaan, prioritas, cara menghadapi konflik. Setiap hari kita memilih, dan anak-anak ikut menanggung hasilnya."],
 tanya:["Iman seperti apa yang ingin kita wariskan kepada cucu-cucu kita kelak?","Pertanyaan apa tentang iman atau penderitaan yang perlu kita serahkan kepada Tuhan?","Pilihan apa saat ini yang akan berdampak pada anak-anak?"],
 aksi:"Tulis surat singkat untuk anak-anak tentang iman yang ingin kalian wariskan. Simpan untuk diberikan pada momen penting mereka kelak, misalnya saat Krisma."}},
63:{anak:{r:["Musa sudah berumur seratus dua puluh tahun. Ia memanggil Yosua dan berkata di depan seluruh bangsa: kuatkan dan teguhkanlah hatimu… TUHAN sendiri akan berjalan di depanmu, Ia akan menyertai engkau, tidak akan membiarkan dan meninggalkan engkau (Ulangan 31:7–8). Wah, kalimat yang menguatkan!","Musa juga memerintahkan supaya hukum Tuhan dibacakan setiap tujuh tahun di depan semua orang, laki-laki, perempuan, anak-anak, dan orang asing, supaya anak-anak yang belum tahu juga mendengar (31:12–13).","Di pasal 32, Musa bernyanyi. Ia menggambarkan Allah seperti rajawali yang mengajari anaknya terbang: menggoyangkan sarangnya, melayang di atas anak-anaknya, lalu menangkap mereka dengan sayapnya (32:11). Kadang Tuhan membiarkan kita mencoba hal sulit, tapi Ia siap menangkap kita."],
 tanya:["Hal sulit apa yang sedang kamu hadapi dan butuh keberanian?","Bagaimana rasanya tahu Tuhan “tidak akan meninggalkan” kamu?","Pernah merasa seperti anak rajawali yang didorong keluar dari sarang?"],
 aksi:"Tulis Ulangan 31:8 di kertas kecil dan bawa dalam tas sekolahmu. Baca setiap kali kamu merasa takut."},
 ortu:{r:["Musa menyiapkan pergantian kepemimpinan dengan baik: ia menguatkan Yosua di depan seluruh bangsa (31:7). Kata-kata peneguhan di depan umum memberi legitimasi dan keberanian. Anak-anak juga membutuhkan peneguhan dari orang tua, bukan hanya saat berdua, tetapi juga di depan orang lain.","Ulangan 31:12–13 menyebut anak-anak secara khusus: supaya mereka yang belum mengetahuinya mendengar dan belajar takut akan Tuhan. Anak-anak bukan penonton dalam ibadah, tetapi peserta. Membawa anak ke Misa, walau kadang melelahkan, adalah bagian dari menanam iman.","Gambaran rajawali di Ulangan 32:11 sangat menyentuh bagi orang tua. Induk rajawali menggoyangkan sarang supaya anaknya belajar terbang, tetapi tetap melayang di bawah untuk menangkapnya. Mendidik anak berarti perlahan memberi kebebasan, sambil tetap siap menolong saat mereka jatuh."],
 tanya:["Kapan terakhir kali kita meneguhkan anak di depan orang lain?","Bagaimana kita melibatkan anak-anak dalam ibadah, bukan sekadar membawa mereka?","Di bidang apa kita perlu mulai “menggoyang sarang” dan memberi anak lebih banyak kebebasan?"],
 aksi:"Puji satu anak di depan keluarga besar atau teman minggu ini. Pilih satu hal yang selama ini kalian kerjakan untuk anak, lalu ajari ia mengerjakannya sendiri."}},
64:{anak:{r:["Musa naik ke gunung Nebo dan Tuhan memperlihatkan seluruh tanah perjanjian kepadanya (Ulangan 34:1–4). Ia melihatnya, tetapi tidak masuk. Lalu Musa meninggal di sana, pada umur seratus dua puluh tahun. Matanya belum kabur dan kekuatannya belum hilang (34:7).","Tidak ada yang tahu di mana kuburnya sampai hari ini (34:6). Bangsa Israel menangisi Musa tiga puluh hari. Alkitab menyebut tidak pernah lagi bangkit nabi seperti Musa yang dikenal Tuhan berhadapan muka (34:10).","Tapi kisahnya tidak berhenti. Yosua penuh dengan roh kebijaksanaan karena Musa telah meletakkan tangan atasnya (34:9). Musa sudah mempersiapkan penerusnya. Di Injil, Musa muncul lagi bersama Elia, berbicara dengan Yesus di gunung waktu Yesus dimuliakan (Matius 17:3)!"],
 tanya:["Bagaimana perasaanmu tentang Musa yang hanya bisa melihat tanah perjanjian?","Apa yang paling kamu kagumi dari Musa?","Siapa yang sudah menyiapkan dan mengajari kamu dalam hidup?"],
 aksi:"Ucapkan terima kasih kepada seseorang yang sudah banyak mengajarimu, misalnya guru, katekis, atau orang tua. Ceritakan kepada keluarga apa yang paling kamu ingat dari kisah Musa."},
 ortu:{r:["Ulangan ditutup dengan kematian Musa di gunung Nebo (34:5). Ia melihat tanah perjanjian, tetapi tidak memasukinya. Banyak orang tua menanam hal-hal yang buahnya baru dinikmati anak dan cucu: iman, pendidikan, nilai-nilai. Kita mungkin tidak melihat hasil akhirnya, dan itu tidak membuat jerih payah kita sia-sia.","“Matanya belum kabur dan kekuatannya belum hilang” (34:7). Musa melayani sampai akhir. Namun ia juga sudah meletakkan tangan atas Yosua (34:9), mempersiapkan penerus. Kepemimpinan yang baik, termasuk dalam keluarga, selalu memikirkan generasi berikutnya.","Kitab Taurat ditutup dengan pernyataan bahwa tidak ada nabi seperti Musa (34:10). Bagi orang Kristen, penantian itu menemukan jawabannya dalam Yesus, yang di gunung Tabor tampak bersama Musa (Matius 17:3). Seluruh perjalanan dari Kejadian sampai Ulangan menunjuk kepada Dia."],
 tanya:["Apa yang sedang kita tanam yang mungkin baru dinikmati anak-anak kelak?","Bagaimana kita menyiapkan anak-anak untuk memikul iman mereka sendiri?","Apa pelajaran terbesar dari lima kitab Musa bagi keluarga kita?"],
 aksi:"Rayakan selesainya lima kitab Taurat bersama keluarga. Setiap orang berbagi satu kisah favorit dan satu pelajaran dari Kejadian sampai Ulangan."}},
65:{anak:{r:["Musa sudah meninggal, dan sekarang Yosua yang memimpin. Pasti Yosua merasa gugup! Tiga kali Tuhan berkata kepadanya: kuatkan dan teguhkanlah hatimu (Yosua 1:6, 7, 9). Tuhan juga berjanji: seperti Aku menyertai Musa, demikianlah Aku akan menyertai engkau (1:5).","Lalu ada Rahab, perempuan di Yerikho, kota musuh. Ia menyembunyikan dua pengintai Israel di atap rumahnya. Rahab berkata: TUHAN, Allahmu, ialah Allah di langit di atas dan di bumi di bawah (2:11). Orang yang dianggap “orang luar” ternyata punya iman yang besar. Rahab kemudian tercatat dalam silsilah Yesus (Matius 1:5)!","Di pasal 3, Israel harus menyeberangi sungai Yordan yang sedang meluap. Air baru berhenti mengalir ketika kaki para imam yang mengangkat tabut menyentuh air (3:15–16). Mereka harus melangkah dulu, baru melihat mukjizat."],
 tanya:["Kapan kamu butuh mendengar “kuatkan dan teguhkanlah hatimu”?","Apa yang bisa kita pelajari dari iman Rahab?","Pernah harus “melangkah dulu” sebelum melihat jalan keluar?"],
 aksi:"Hafalkan Yosua 1:9. Ambil satu langkah berani minggu ini yang selama ini kamu tunda."},
 ortu:{r:["Yosua menerima tongkat estafet dari Musa yang besar. Tuhan tidak meminta Yosua menjadi Musa kedua, tetapi menjanjikan penyertaan yang sama (1:5). Banyak orang tua merasa tidak mampu menyamai orang tua mereka sendiri, atau merasa harus menjadi orang tua yang sempurna. Yang dijanjikan bukan kesempurnaan, melainkan penyertaan.","Yosua 1:8 memberi kunci: renungkan kitab Taurat siang dan malam. Keberanian Yosua bukan sekadar sifat bawaan, tetapi buah dari hidup yang berakar dalam firman.","Rahab (pasal 2) adalah orang luar, perempuan Kanaan dengan reputasi buruk, tetapi imannya menyelamatkan seluruh keluarganya (2:12–13, 18). Ia kemudian masuk silsilah Yesus (Matius 1:5). Allah tidak menilai dari masa lalu. Ini juga mengingatkan kita untuk tidak cepat menghakimi orang lain, atau anak kita sendiri, berdasarkan masa lalunya."],
 tanya:["Dalam hal apa kita merasa tidak cukup baik sebagai orang tua?","Bagaimana firman Tuhan menjadi sumber kekuatan kita sehari-hari?","Siapa yang mungkin kita hakimi karena masa lalunya?"],
 aksi:"Bacakan Yosua 1:9 untuk setiap anggota keluarga sambil menyebut nama mereka. Pasangan: saling meneguhkan untuk tantangan yang sedang dihadapi masing-masing."}},
66:{anak:{r:["Setelah menyeberangi Yordan, Yosua menyuruh dua belas orang mengambil dua belas batu dari tengah sungai dan menumpuknya di Gilgal. Kenapa? Supaya kalau kelak anak-anak bertanya, “Apa artinya batu-batu ini?”, orang tua bisa menceritakan apa yang Tuhan lakukan (Yosua 4:6–7).","Di pasal 5, manna berhenti turun sehari setelah mereka makan hasil tanah Kanaan (5:12). Empat puluh tahun Allah memberi makan dengan cara ajaib, sekarang Ia memberi makan lewat hasil tanah. Allah tetap memelihara, hanya caranya berubah.","Lalu Yosua bertemu seorang laki-laki dengan pedang terhunus. Yosua bertanya: kawan atau lawan? Ia menjawab: aku Panglima bala tentara TUHAN. Yosua sujud, dan disuruh menanggalkan kasutnya karena tempat itu kudus (5:13–15), persis seperti Musa di semak yang menyala."],
 tanya:["Apa “batu peringatan” di keluargamu, benda atau foto yang mengingatkan kebaikan Tuhan?","Bagaimana Tuhan memeliharamu dengan cara yang biasa-biasa saja setiap hari?","Kenapa Yosua harus menanggalkan kasutnya?"],
 aksi:"Pilih satu benda di rumah yang mengingatkanmu pada kebaikan Tuhan, lalu ceritakan kisahnya kepada keluarga."},
 ortu:{r:["Dua belas batu di Gilgal (pasal 4) adalah alat pendidikan iman: benda yang mengundang pertanyaan anak, dan pertanyaan yang membuka cerita. Keluarga kita juga bisa punya “batu peringatan”: foto pembaptisan, salib dari ziarah, lilin Komuni Pertama, atau benda lain yang mengingatkan karya Tuhan.","Pengulangan tema ini di Kitab Suci (Kel 12:26; Ul 6:20; Yos 4:6) menunjukkan bahwa Allah sungguh mengandalkan orang tua sebagai pencerita iman. Anak-anak tidak hanya butuh aturan, tetapi juga cerita yang memberi makna.","Berhentinya manna (5:12) menandai peralihan dari masa yang ajaib ke masa yang biasa. Ada masa dalam hidup keluarga ketika Tuhan terasa hadir secara luar biasa, dan masa ketika Ia memelihara lewat hal-hal biasa: gaji bulanan, kesehatan, rutinitas. Keduanya sama-sama karya-Nya."],
 tanya:["Apa “batu peringatan” yang kita punya di rumah?","Kisah iman apa yang ingin kita pastikan diingat oleh anak-anak?","Di mana kita melihat pemeliharaan Tuhan dalam hal-hal biasa?"],
 aksi:"Buat “kotak kenangan iman” keluarga berisi foto dan benda dari momen-momen rohani penting. Buka dan ceritakan kisahnya kepada anak-anak."}},
67:{anak:{r:["Israel baru saja menang besar di Yerikho, tapi mereka kalah di kota kecil Ai. Ternyata ada yang tidak taat: Akhan diam-diam mengambil jubah, perak, dan emas dari Yerikho, lalu menyembunyikannya di dalam kemahnya (Yosua 7:21). Dosa satu orang berdampak pada seluruh bangsa.","Akhan mengaku: aku melihat, aku mengingini, aku mengambil, lalu aku menyembunyikan (7:21). Itulah urutan dosa: melihat, ingin, mengambil, menyembunyikan. Kalau kita sadar sejak “ingin”, kita bisa berhenti sebelum terlambat.","Di pasal 9, orang Gibeon menipu Israel dengan memakai pakaian usang dan roti kering, pura-pura datang dari jauh. Israel percaya dan membuat perjanjian, karena mereka tidak bertanya kepada TUHAN (9:14). Sebelum memutuskan sesuatu, tanyakan dulu kepada Tuhan dalam doa."],
 tanya:["Pernah melihat sesuatu, lalu sangat menginginkannya sampai tergoda mengambil?","Kenapa dosa yang disembunyikan itu berbahaya?","Keputusan apa yang perlu kamu doakan dulu sebelum dilakukan?"],
 aksi:"Kalau minggu ini kamu sangat menginginkan sesuatu yang bukan milikmu, berhenti, tarik napas, dan doakan. Sebelum memutuskan hal penting, berdoa dulu."},
 ortu:{r:["Akhan menggambarkan proses dosa dengan jelas: melihat, mengingini, mengambil, menyembunyikan (7:21). Pola ini terjadi dalam banyak hal: belanja impulsif, konten yang tidak pantas, godaan dalam pernikahan. Mengenali tahap “mengingini” memberi kita kesempatan untuk berhenti.","Dosa Akhan yang tersembunyi di kemahnya berdampak pada seluruh Israel (7:1, 11). Dalam keluarga, rahasia dan dosa tersembunyi seorang anggota sering berdampak pada semua, walaupun yang lain tidak tahu. Keterbukaan dalam pernikahan adalah perlindungan bagi seluruh keluarga.","Kisah orang Gibeon (pasal 9) mengingatkan pentingnya berdoa sebelum mengambil keputusan: “mereka tidak meminta keputusan TUHAN” (9:14). Namun ketika Israel tahu sudah ditipu, mereka tetap menepati janji (9:19). Integritas berarti menepati janji walau ternyata merugikan diri sendiri."],
 tanya:["Di bidang apa kita paling rentan pada pola “melihat, mengingini, mengambil”?","Adakah hal yang kita sembunyikan dari pasangan?","Keputusan keluarga apa yang kemarin kita ambil tanpa berdoa?"],
 aksi:"Pasangan: sepakati satu cara untuk saling terbuka, misalnya waktu ngobrol jujur setiap minggu. Mulai kebiasaan berdoa bersama sebelum keputusan keluarga yang penting."}},
68:{anak:{r:["Lima raja bersatu menyerang kota Gibeon. Orang Gibeon minta tolong kepada Yosua, dan walaupun dulu mereka menipu Israel, Yosua tetap datang menolong karena sudah berjanji (Yosua 10:6–7).","Saat pertempuran, Yosua berdoa supaya matahari berhenti, dan matahari berhenti sampai bangsa itu menang (10:12–13). Kisah ini juga tertulis dalam Kitab Orang Jujur, sebuah kitab kuno yang sekarang sudah hilang. Tidak pernah ada hari seperti itu, ketika TUHAN mendengarkan suara seorang manusia (10:14).","Pasal 11 dan 12 menceritakan kemenangan-kemenangan lain dan daftar raja-raja yang dikalahkan. Di akhir pasal 11 tertulis: negeri itu aman dari perang (11:23). Setelah perjuangan panjang, datanglah masa damai."],
 tanya:["Pernah menolong orang yang dulu pernah berbuat tidak baik kepadamu?","Apa yang kamu doakan dengan sungguh-sungguh akhir-akhir ini?","Bagaimana rasanya setelah masalah besar akhirnya selesai?"],
 aksi:"Doakan satu hal besar yang kamu butuhkan dengan berani, seperti Yosua. Tolong seseorang yang pernah membuatmu kesal."},
 ortu:{r:["Yosua menolong Gibeon (10:6–7), bangsa yang pernah menipunya, karena perjanjian sudah dibuat. Kesetiaan pada janji tidak bergantung pada apakah pihak lain layak menerimanya. Pernikahan juga bertumpu pada janji, bukan hanya pada perasaan atau kelayakan pasangan dari hari ke hari.","Doa Yosua agar matahari berhenti (10:12) adalah doa yang sangat berani. Kitab Suci mencatat bahwa Tuhan mendengarkan suara seorang manusia (10:14). Kita diajak membawa kebutuhan keluarga kepada Allah dengan berani, sambil tetap menyerahkan hasilnya kepada kehendak-Nya.","Para ahli Gereja mencatat bahwa kitab Yosua menyajikan penaklukan secara diidealkan, sebagai pelajaran iman, sementara kenyataan sejarahnya berlangsung lebih perlahan. Bacaan seperti ini mengajak kita menangkap pesan imannya: Allah setia pada janji-Nya, dan umat dipanggil untuk setia pula."],
 tanya:["Apakah kesetiaan kita kepada pasangan bergantung pada sikapnya hari itu?","Doa berani apa yang ingin kita bawa sebagai keluarga?","Bagaimana kita menjelaskan kisah-kisah perang di Alkitab kepada anak?"],
 aksi:"Tulis bersama satu “doa berani” untuk keluarga, lalu doakan setiap malam minggu ini. Ucapkan ulang janji pernikahan kalian berdua dalam doa."}},
69:{anak:{r:["Yosua sudah tua, dan Tuhan berkata masih banyak tanah yang belum diduduki (Yosua 13:1). Pembagian tanah pun dimulai.","Lalu Kaleb datang. Umurnya sudah delapan puluh lima tahun! Ia berkata: kekuatanku sekarang sama seperti dahulu, waktu Musa mengutus aku. Berikanlah kepadaku pegunungan ini (14:10–12). Pegunungan Hebron itu justru tempat orang-orang Enak yang besar dan kuat tinggal. Kaleb tidak memilih yang gampang!","Di pasal 15, putri Kaleb, Akhsa, juga berani. Ia meminta ayahnya: berikanlah aku sumber-sumber air, dan Kaleb memberinya mata air atas dan mata air bawah (15:18–19). Keluarga Kaleb adalah keluarga yang berani meminta dan berani berjuang."],
 tanya:["Apa yang bisa kamu pelajari dari Kaleb yang tetap semangat di umur 85?","Kenapa Kaleb memilih tempat yang sulit?","Pernah meminta sesuatu yang penting kepada orang tuamu dengan berani?"],
 aksi:"Pilih tantangan yang agak sulit minggu ini, jangan hanya yang gampang. Tanyakan kepada kakek-nenek atau orang tua apa impian mereka yang masih ingin dicapai."},
 ortu:{r:["Kaleb pada umur delapan puluh lima tahun meminta pegunungan yang paling sulit (14:10–12). Ia menyebut alasannya: “ia mengikut TUHAN, Allah Israel, dengan sepenuh hati” (14:14). Iman Kaleb tidak pensiun. Usia bukan alasan untuk berhenti bertumbuh atau melayani.","Kaleb sudah menunggu empat puluh lima tahun sejak janji itu diberikan (14:10). Selama itu, ia tetap setia di tengah generasi yang tidak percaya. Ada janji Tuhan yang lama sekali tergenapi; kesetiaan dalam penantian adalah bagian dari iman.","Akhsa, putri Kaleb, berani meminta sumber air (15:18–19), dan ayahnya memberi lebih dari yang diminta: mata air atas dan bawah. Kaleb tampaknya membesarkan anak yang berani berbicara. Apakah anak-anak kita merasa aman untuk meminta, dan tahu bahwa orang tuanya akan mendengar?"],
 tanya:["Bagaimana kita membayangkan diri kita di usia tua: berhenti, atau tetap bertumbuh?","Janji Tuhan apa yang sudah lama kita nantikan?","Apakah anak-anak merasa aman untuk meminta sesuatu kepada kita?"],
 aksi:"Tuliskan satu tujuan rohani atau pelayanan yang ingin kalian capai sebagai pasangan, berapa pun usia kalian. Saat anak meminta sesuatu minggu ini, dengarkan alasannya dengan sungguh-sungguh sebelum menjawab."}},
70:{anak:{r:["Yosua 16–17 mencatat tanah untuk suku Efraim dan Manasye, keturunan Yusuf. Ingat Yusuf di Kitab Kejadian? Janji Allah kepada keluarganya sekarang tergenapi. Dari perjalanan panjang sejak Kejadian, akhirnya tiba di negeri yang dijanjikan.","Putri-putri Zelafehad muncul lagi! Mereka mengingatkan Yosua janji yang diberikan lewat Musa, dan mereka benar-benar mendapat warisan (17:3–4). Janji yang diperjuangkan dengan berani akhirnya ditepati.","Bani Yusuf mengeluh tanahnya terlalu sempit. Yosua menjawab: kalau begitu, naiklah ke hutan dan bukalah tanah di sana (17:15). Kadang berkat Tuhan sudah ada di depan kita, tapi kita perlu bekerja keras untuk mengolahnya. Di pasal 18, Kemah Pertemuan didirikan di Silo (18:1), dan Tuhan tetap ada di tengah-tengah umat-Nya."],
 tanya:["Pernah mengeluh “kurang” padahal sebenarnya bisa diusahakan?","Apa yang bisa kamu pelajari dari putri-putri Zelafehad?","Dari Kejadian sampai Yosua, kisah mana yang paling kamu suka?"],
 aksi:"Daripada mengeluh minggu ini, coba usahakan sendiri jalan keluarnya. Ceritakan kepada keluargamu kisah favoritmu dari 70 hari membaca Alkitab ini."},
 ortu:{r:["Keluhan bani Yusuf (17:14) terdengar akrab: “kami terlalu banyak, tanah kami terlalu sempit.” Jawaban Yosua tegas namun membangun: bukalah hutan itu, kamu cukup kuat (17:15–18). Kadang yang kita butuhkan bukan tambahan berkat, tetapi kesediaan mengolah berkat yang sudah ada.","Putri-putri Zelafehad (17:3–4) menunjukkan bahwa janji yang sudah diberikan perlu terus diingatkan dan diperjuangkan. Mereka tidak menunggu pasif, tetapi datang menghadap. Iman dan inisiatif berjalan bersama.","Kemah Pertemuan didirikan di Silo (18:1) setelah negeri itu ditaklukkan. Setelah semua perjalanan dan perjuangan, Allah tetap ditempatkan di pusat. Tujuh puluh hari membaca Alkitab bersama ini mungkin sudah membentuk kebiasaan baru di keluarga. Semoga “Kemah Pertemuan” keluarga, waktu bersama dengan firman Tuhan, terus berdiri di tengah rumah kita."],
 tanya:["Berkat apa yang sudah kita miliki tetapi belum kita “olah”?","Janji atau komitmen keluarga apa yang perlu kita perjuangkan lagi?","Setelah 70 hari, apa yang berubah dalam keluarga kita?"],
 aksi:"Adakan perayaan kecil 70 hari membaca Alkitab bersama. Setiap orang membagikan satu hal yang paling berkesan, lalu sepakati bersama untuk melanjutkan perjalanan ini."}}
};

/* ===== Pertanyaan yang sering muncul, per hari (bersumber) ===== */
const U = (b,c)=>`https://bible.usccb.org/bible/${b}/${c}`;
const TANYA = {
1:`<h3>❓ Siapa sebenarnya ular itu?</h3>
<p>${T_G} Kejadian sendiri menyebut ular sebagai binatang liar paling cerdik yang dijadikan Allah (3:1). Tradisi Kristen kemudian mengenali ular itu sebagai iblis (Kebijaksanaan 2:24; Yohanes 8:44; Wahyu 12:9; 20:2). Karena itu 3:15 dipahami sebagai janji pertama tentang Penebus, yang disebut <i>protoevangelium</i> ("Injil pertama"). Dalam seni Kristen, Maria kadang digambarkan menginjak kepala ular.</p>
${SRC([["Catatan Kej 3",U("genesis",3)],["Catatan Kej 3 (Bible.com)","https://chop.bible.com/bible/463/GEN.3.ampc?parallel=8"]])}`,
2:`<h3>❓ Mengapa persembahan Kain ditolak?</h3><p class="empty">Jawabannya ada di bagian 5W 1H Kejadian 4 di bawah.</p>`,
3:`<h3>❓ Berapa pasang binatang masuk bahtera: sepasang atau tujuh pasang?</h3>
<p>${T_G} Keduanya ada di teks: 6:19 menyebut sepasang dari setiap jenis, 7:2 menyebut tujuh pasang binatang tahir. Catatan Gereja menjelaskan bahwa kisah air bah umumnya dipandang sebagai gabungan dua sumber tradisi yang dijalin menjadi satu. Satu sumber menyebut sepasang setiap jenis; sumber lain menyebut tujuh pasang binatang tahir dan sepasang yang najis. Walaupun ada perbedaan, kisah ini dibaca sebagai satu cerita yang utuh.</p>
<p>${T_G} Catatan yang sama menyebut bahwa kisah ini berakar pada tradisi Mesopotamia kuno tentang banjir besar, seperti kisah air bah Sumeria, lempeng ke-11 Epos Gilgamesh, dan Epos Atrahasis.</p>
${SRC([["Catatan Kej 6",U("genesis",6)],["Catatan Kej 6 (Bible.com)","https://www.bible.com/bible/463/gen.6.nabre"]])}`,
4:`<h3>❓ Mengapa Tuhan mengacaukan bahasa di Babel?</h3>
<p>${T_G} Menurut catatan Gereja, kisah ini menggambarkan dosa manusia yang makin besar: kesombongan atas pencapaian sendiri tanpa Allah. "Menara yang puncaknya sampai ke langit" mungkin merujuk ziggurat utama kota Babel, E-sag-ila, artinya "rumah yang mengangkat tinggi kepalanya".</p>
<p>${T_G} "Babel" adalah bentuk Ibrani dari "Babilon". Orang Babel mengartikan nama kotanya "gerbang dewa", sedangkan dalam bahasa Ibrani bunyinya mirip <i>balal</i>, "mengacaukan".</p>
<p>${T_G} Di hari Pentakosta, Roh Kudus membuat orang dari berbagai bangsa mendengar para rasul berbicara dalam bahasa mereka sendiri (Kisah Para Rasul 2:4–11).</p>
${SRC([["Catatan Kej 11",U("genesis",11)],["Catatan Kej 11 (lanjutan)","https://coursebible.com/new-american-bible-revised-edition-nabre/genesis-11"],["Kis 2",U("acts",2)]])}`,
5:`<h3>❓ Siapa Melkisedek?</h3>
<p>${T_G} Melkisedek adalah raja Salem, yaitu Yerusalem (bdk. Mazmur 76:3). Ia muncul tiba-tiba, menyiapkan jamuan roti dan anggur, lalu memberkati Abram atas nama <i>El Elyon</i>, "Allah Yang Mahatinggi". Abram memberinya sepersepuluh dari rampasan. Surat Ibrani pasal 7 menafsirkan Melkisedek sebagai gambaran Kristus, dan Mazmur 110:4 menyebut "imam untuk selama-lamanya menurut Melkisedek".</p>
${SRC([["Catatan Kej 14:18 (NAB)","https://catholicbibles.blogspot.com/2013/06/sunday-knox-for-corpus-christi-genesis.html"],["Ibr 7",U("hebrews",7)]])}`,
6:`<h3>❓ Siapa tiga tamu Abraham?</h3>
<p>${T_G} Mula-mula Abraham menyapa pemimpin rombongan tanpa menyadari bahwa ia Tuhan; dua lainnya kemudian disebut malaikat (19:1). Catatan Gereja menjelaskan bahwa jumlah dan identitas tamu yang berganti-ganti adalah cara bercerita untuk mengungkapkan kehadiran Allah yang penuh misteri.</p>
${SRC([["Catatan Kej 18",U("Genesis","18?16")]])}`,
7:`<h3>❓ Mengapa istri Lot menjadi tiang garam?</h3>
<p>${T_G} Para malaikat berpesan agar mereka tidak menoleh ke belakang (19:17), tetapi istri Lot menoleh (19:26). Yesus sendiri memakai kisah ini saat mengajar murid-murid agar siap: "Ingatlah akan istri Lot!" (Lukas 17:32).</p>
<p>${T_R} Di ujung selatan Laut Mati ada tiang garam setinggi sekitar 20 meter yang dari kejauhan tampak seperti sosok manusia. Para ahli mencatat kisah ini juga memberi penjelasan atas formasi-formasi garam di sekitar Laut Mati, yang dalam bahasa Ibrani disebut "Laut Garam".</p>
${SRC([["Luk 17",U("luke",17)],["Biblical Archaeology Society","https://library.biblicalarchaeology.org/?p=71318"],["Jewish Women's Archive","https://jwa.org/encyclopedia/article/wife-of-lot-bible"]])}`,
8:`<h3>❓ Mengapa Allah menyuruh Abraham mengorbankan Ishak?</h3>
<p>${T_G} Teks menegaskan bahwa Allah sedang menguji Abraham (22:1); inilah ujian terbesar dalam hidupnya. Catatan Gereja menjelaskan: Kitab Suci mengakui anak sulung milik Allah dan menyediakan korban pengganti untuk menebus anak sulung. Praktik korban anak yang tersebar luas pada zaman itu, betapapun mengerikannya bagi kita, menunjukkan betapa nyata ujian ini.</p>
<p>${T_G} Allah sendiri menghentikan Abraham dan menyediakan domba jantan (22:12–13): "TUHAN menyediakan". Surat Ibrani menulis bahwa Abraham percaya Allah sanggup membangkitkan orang mati (Ibrani 11:17–19).</p>
${SRC([["Catatan Kej 22",U("Genesis",22)],["Catatan Kej 22:1–19",U("gn",22)],["Ibr 11",U("hebrews",11)]])}`,
9:`<h3>❓ Yakub menipu, kenapa berkatnya tidak dibatalkan?</h3>
<p>${T_G} Sebelum si kembar lahir, Tuhan sudah berfirman bahwa yang tua akan melayani yang muda (25:23).</p>
<p>${T_R} Para penafsir menjelaskan bahwa dalam pandangan Ibrani, kata berkat yang sudah diucapkan tidak dapat ditarik kembali (bdk. 27:33; Yesaya 55:11).</p>
<p>${T_G} Namun teks tidak memuji tipu daya itu: Yakub harus lari dari Esau (27:41–45), dan kemudian ia sendiri ditipu Laban (29:25).</p>
${SRC([["Catatan Kej 27 (Free Bible Commentary)","https://freebiblecommentary.org/old_testament_studies/VOL01BOT/VOL01BOT_27.html"],["Kej 27",U("genesis",27)],["Kej 29",U("genesis",29)]])}`,
10:`<h3>❓ Tangga Yakub itu tangga apa?</h3>
<p>${T_G} Kata Ibraninya <i>sullam</i>, yang biasa tetapi kurang tepat diterjemahkan "tangga". Kata kerjanya, <i>salal</i>, berarti "menimbun", misalnya tanah untuk jalan atau tanjakan. Karena itu terjemahan Gereja (NABRE) memakai kata <i>stairway</i>, yaitu undakan.</p>
<p>${T_G} Yesus berkata kepada Natanael bahwa ia akan melihat langit terbuka dan malaikat-malaikat Allah turun naik kepada Anak Manusia (Yohanes 1:51). Catatan Gereja menyebut ayat itu menyinggung tangga Yakub.</p>
${SRC([["Catatan Kej 28",U("gn",28)],["Catatan Yoh 1:51","https://biblehub.com/nabre/john/footnotes.htm"]])}`,
11:`<h3>❓ Siapa yang bergulat dengan Yakub?</h3>
<p>${T_G} Teks hanya menyebut "seorang laki-laki". Catatan Gereja menjelaskan bahwa sosok ini "berubah-ubah", seperti tiga tamu Abraham. Nabi Hosea secara jelas menyebutnya malaikat (Hosea 12:4–5).</p>
<p>${T_G} Nama "Israel" diberi penjelasan populer dari kata "engkau bergumul" ditambah suku kata pertama <i>elohim</i>, "ilahi". "Peniel" dijelaskan sebagai "wajah Allah".</p>
${SRC([["Catatan Kej 32",U("genesis",32)]])}`,
12:`<h3>❓ Siapa orang Edom, dan apa hubungannya dengan Injil?</h3>
<p>${T_G} Kejadian 36 mencatat bahwa Esau disebut juga Edom (36:1, 8); keturunannya menjadi bangsa Edom, tetangga Israel.</p>
<p>${T_R} Menurut Britannica, ayah Herodes Agung, raja Yudea ketika Yesus lahir, adalah seorang Edom, walaupun Herodes menjalankan agama Yahudi.</p>
${SRC([["Kej 36",U("genesis",36)],["Herodes (Britannica)","https://www.britannica.com/EBchecked/topic/263437/Herod"]])}`,
13:`<h3>❓ Benarkah jubah Yusuf berwarna-warni?</h3>
<p>${T_G} Arti frasa Ibraninya tidak jelas. Di 2 Samuel 13:18–19, pakaian yang sama adalah pakaian khas putri raja yang belum menikah. Terjemahan "jubah berwarna-warni" berasal dari Septuaginta dan menjadi terjemahan tradisional.</p>
<p>${T_G} Catatan Gereja juga menyoroti bahwa sikap pilih kasih Yakub menjadi penyebab saudara-saudara Yusuf ingin membunuhnya, dan Yakub tidak menyadari dampaknya.</p>
${SRC([["Catatan Kej 37",U("Genesis",37)]])}`,
14:`<h3>❓ Mengapa mimpi begitu penting di Mesir?</h3>
<p>${T_G} Salah satu tugas para ahli di istana Firaun adalah menafsirkan mimpi; tradisi ini sudah lama ada di Mesir. Catatan Gereja menyebut sebuah buku panduan tafsir mimpi dari awal milenium kedua SM, berisi mimpi-mimpi yang umum beserta penilaian "baik" atau "buruk".</p>
<p>${T_G} Dengan menerima cincin meterai Firaun, Yusuf menjadi wazir, yang bergelar "pemegang meterai raja Mesir Hilir". Nama Mesirnya, Zafnat-Paaneah, berarti "dewa berbicara dan ia hidup".</p>
${SRC([["Catatan Kej 41",U("genesis",41)],["Catatan Kej 41 (lanjutan)",U("gn",41)]])}`,
15:`<h3>❓ Mengapa Yehuda yang maju menggantikan Benyamin?</h3>
<p>${T_G} Dulu Yehuda-lah yang mengusulkan menjual Yusuf (37:26–27). Kemudian ia menjamin keselamatan Benyamin kepada ayahnya (43:8–9), dan akhirnya menawarkan diri menjadi budak (44:33).</p>
<p>${T_G} Dari suku Yehuda kelak lahir raja-raja (49:10), dan Perjanjian Baru menegaskan bahwa Tuhan kita berasal dari suku Yehuda (Ibrani 7:14; Matius 1:2–3).</p>
${SRC([["Kej 44",U("genesis",44)],["Ibr 7",U("hebrews",7)],["Mat 1",U("matthew",1)]])}`,
16:`<h3>❓ Berapa orang yang pindah ke Mesir: 70 atau 75?</h3>
<p>${T_G} Teks Ibrani Kejadian 46:27 dan Keluaran 1:5 menyebut tujuh puluh orang. Dalam pidatonya, Stefanus menyebut tujuh puluh lima (Kisah Para Rasul 7:14).</p>
<p>${T_R} Septuaginta (terjemahan Yunani) di Kejadian 46:27 dan Keluaran 1:5 menulis tujuh puluh lima, karena menambahkan lima keturunan Yusuf. Stefanus mengikuti terjemahan Yunani itu.</p>
${SRC([["Kej 46",U("genesis",46)],["Kis 7",U("acts",7)],["Catatan studi Kel 1:5","https://search.biblegateway.com/resources/reformation-study-bible/Exod.1.5"]])}`,
17:`<h3>❓ Apa maksud "tongkat kerajaan tidak akan beranjak dari Yehuda"?</h3>
<p>${T_G} Catatan Gereja menjelaskan bahwa ayat 49:10 sulit: terjemahannya didasarkan pada sedikit perubahan teks Ibrani, karena teks apa adanya bisa berarti "sampai ia datang ke Silo". Yang jelas, dari suku Yehuda kelak lahir raja-raja Israel.</p>
<p>${T_G} Perjanjian Baru menyebut Yesus "singa dari suku Yehuda" (Wahyu 5:5), menggemakan 49:9, "Yehuda adalah anak singa".</p>
${SRC([["Catatan Kej 49",U("gn",49)],["Why 5",U("revelation",5)]])}`,
18:`<h3>❓ Apa arti nama Musa?</h3>
<p>${T_G} Teks memberi permainan kata: <i>mosheh</i> mirip <i>meshitihu</i>, "aku telah menariknya keluar". Namun catatan Gereja menjelaskan bahwa nama Musa sebenarnya kemungkinan berasal dari bahasa Mesir yang berarti "dicintai" atau "telah lahir", seperti dalam nama Firaun Thutmose.</p>
<p>${T_G} Kata untuk "keranjang" (2:3) adalah kata Ibrani yang sama dengan "bahtera" Nuh, dan tidak dipakai di tempat lain dalam Alkitab.</p>
${SRC([["Catatan Kel 2","https://biblehub.com/nabre/exodus/footnotes.htm"],["Kel 2",U("exodus",2)]])}`,
19:`<h3>❓ Kalau Allah yang mengeraskan hati Firaun, apakah Firaun bersalah?</h3>
<p>${T_G} Teks memakai beberapa ungkapan: kadang Tuhan yang mengeraskan hati Firaun (4:21; 9:12; 10:20), kadang Firaun mengeraskan hatinya sendiri (8:15; 8:32; 9:34). Sejak awal Firaun sudah menolak: "Siapakah TUHAN itu?" (5:2).</p>
<p>${T_R} Banyak penafsir melihat pengerasan oleh Allah sebagai hukuman atas penolakan dan penindasan yang sudah dipilih Firaun sendiri.</p>
${SRC([["Kel 5",U("exodus",5)],["Tafsiran Kel 4:21","https://biblehub.com/commentaries/exodus/4-21.htm"]])}`,
20:`<h3>❓ Apakah tulah-tulah bisa dijelaskan secara alamiah?</h3>
<p>${T_G} Catatan Gereja menjelaskan bahwa kebanyakan dari "sepuluh tulah" bisa ditafsirkan sebagai fenomena alam, tetapi para penulis Alkitab jelas menggambarkannya sebagai peristiwa luar biasa yang menunjukkan campur tangan Allah. Tujuannya disebut sendiri: "supaya engkau tahu bahwa Akulah TUHAN" (7:17).</p>
${SRC([["Catatan Kel 7","https://www.bible.com/bible/463/EXO.7.NABRE"]])}`,
21:`<h3>❓ Mengapa rotinya tidak beragi?</h3>
<p>${T_G} Teks sendiri menjelaskannya: mereka diusir dari Mesir dan tidak sempat menunggu adonan mengembang (12:39). Paskah juga harus dimakan dengan tergesa-gesa (12:11).</p>
<p>${T_G} Paulus memakai gambaran ini: Kristus, Anak Domba Paskah kita, telah disembelih; karena itu kita merayakan dengan "roti tidak beragi", yaitu kemurnian dan kebenaran (1 Korintus 5:7–8).</p>
${SRC([["Kel 12",U("exodus",12)],["1 Kor 5",U("1corinthians",5)]])}`,
22:`<h3>❓ Bagaimana laut bisa terbelah?</h3>
<p>${T_G} Keluaran 14:21 menyebut Tuhan menolak air laut dengan angin timur yang keras semalam-malaman. Catatan Gereja menjelaskan bahwa puisi di pasal 15 tampaknya menyimpan versi yang sedikit berbeda dari pasal 14; misalnya, puisi itu tidak menyebut angin timur.</p>
${SRC([["Catatan Kel 15",U("exodus",15)],["Kel 14",U("exodus",14)]])}`,
23:`<h3>❓ Siapa Yitro?</h3>
<p>${T_G} Yitro adalah imam Midian, mertua Musa; ia juga disebut Rehuel (2:18; 3:1; 18:1). Menurut Kejadian 25:1–2, Midian adalah anak Abraham dari Ketura. Catatan Gereja menyoroti bahwa hubungan baik Musa dengan seorang imam Midian ini mencolok, mengingat permusuhan Israel dan Midian di kemudian hari.</p>
${SRC([["Catatan Kel 2",U("ex",2)]])}`,
24:`<h3>❓ Sabat itu hari Sabtu, kenapa kita ke gereja hari Minggu?</h3>
<p>${T_G} Katekismus (no. 2175) menjelaskan bahwa hari Minggu dibedakan dengan tegas dari Sabat; bagi orang Kristen, perayaan hari Minggu menggantikan Sabat. Dalam Paskah Kristus, hari Minggu menggenapi makna rohani Sabat Yahudi dan mewartakan istirahat kekal manusia dalam Allah.</p>
<p>${T_G} Yesus bangkit pada hari pertama minggu itu (Markus 16:2), dan jemaat perdana berkumpul untuk memecahkan roti pada hari pertama minggu (Kisah Para Rasul 20:7).</p>
${SRC([["Katekismus 2175","https://www.vatican.va/archive/ENG0015/__P7O.HTM"],["Kis 20",U("acts",20)]])}`,
25:`<h3>❓ Mengapa perjanjian dimeteraikan dengan darah?</h3>
<p>${T_G} Musa memercikkan darah kepada bangsa itu dan berkata, "Inilah darah perjanjian" (24:8). Pada Perjamuan Terakhir, Yesus memakai kata-kata yang sama: "Inilah darah-Ku, darah perjanjian" (Markus 14:24). Surat Ibrani juga mengutip peristiwa Keluaran 24 ini (Ibrani 9:18–20).</p>
${SRC([["Kel 24",U("exodus",24)],["Mrk 14",U("mark",14)],["Ibr 9",U("hebrews",9)]])}`,
26:`<h3>❓ Di mana tabut perjanjian sekarang?</h3>
<p>${T_G} Kitab 2 Makabe (deuterokanonika) mencatat bahwa nabi Yeremia menyembunyikan kemah, tabut, dan mezbah ukupan di sebuah gua di gunung, dan tempat itu tidak akan diketahui sampai Allah mengumpulkan kembali umat-Nya (2 Makabe 2:4–8). Yeremia juga bernubuat bahwa orang tidak akan menyebut-nyebut tabut itu lagi (Yeremia 3:16). Dalam penglihatan Wahyu, tabut perjanjian tampak di Bait Allah surgawi (Wahyu 11:19).</p>
${SRC([["2 Mak 2",U("2maccabees",2)],["Yer 3",U("jeremiah",3)],["Why 11",U("revelation",11)]])}`,
27:`<h3>❓ Apa itu Urim dan Tumim?</h3>
<p>${T_G} Catatan Gereja menyatakan bahwa arti kedua kata Ibrani ini maupun bentuk bendanya tidak pasti. Tutup dada imam adalah kantong berukuran sekitar 23 cm persegi untuk menyimpannya.</p>
<p>${T_G} Bagian lain Kitab Suci menunjukkan Urim dipakai untuk menanyakan keputusan Tuhan (Bilangan 27:21; 1 Samuel 28:6; Ezra 2:63).</p>
${SRC([["Catatan Kel 28","https://coursebible.com/new-american-bible-revised-edition-nabre/exodus-28"],["Bil 27",U("numbers",27)]])}`,
28:`<h3>❓ Musa berbicara "berhadapan muka", tapi tidak boleh melihat wajah Allah?</h3>
<p>${T_G} Kedua ayat ada di pasal yang sama (33:11 dan 33:20). Di Bilangan 12:8, ungkapan serupa dijelaskan sebagai berbicara secara langsung, "berhadap-hadapan, terus terang, bukan dengan teka-teki". Yohanes 1:18 menegaskan: tidak seorang pun pernah melihat Allah, tetapi Anak Tunggal-Nya yang menyatakan Dia.</p>
${SRC([["Kel 33",U("exodus",33)],["Bil 12",U("numbers",12)],["Yoh 1",U("john",1)]])}`,
29:`<h3>❓ Kalimat "penyayang dan pengasih" (34:6) muncul di mana lagi?</h3>
<p>${T_G} Pernyataan diri Allah ini diulang di banyak tempat: Bilangan 14:18, Nehemia 9:17, Mazmur 86:15; 103:8; 145:8, Yoel 2:13, dan Yunus 4:2.</p>
<p>${T_G} Catatan Gereja untuk Yohanes 1:14 menjelaskan bahwa "penuh kasih karunia dan kebenaran" mungkin mewakili dua istilah Perjanjian Lama yang menggambarkan Allah dalam perjanjian (bdk. Keluaran 34:6), yaitu kasih dan kesetiaan.</p>
${SRC([["Yl 2",U("joel",2)],["Yun 4",U("jonah",4)],["Catatan Yoh 1:14","https://www.bible.com/es/bible/463/JHN.1.NABRE"]])}`,
30:`<h3>❓ Mengapa semuanya harus dibuat persis sesuai contoh?</h3>
<p>${T_G} Tuhan berpesan agar semuanya dibuat menurut contoh yang ditunjukkan di gunung (25:40), dan Musa memeriksa semuanya (39:42–43). Surat Ibrani menjelaskan bahwa ibadah di Kemah Suci adalah "gambaran dan bayangan dari apa yang ada di surga", sebab itulah Musa diperintahkan membuat segala sesuatu menurut contoh itu (Ibrani 8:5; bdk. Kisah Para Rasul 7:44).</p>
${SRC([["Ibr 8",U("hebrews",8)],["Kis 7",U("acts",7)]])}`,
31:`<h3>❓ Apa hubungan Kemah Suci dengan Yesus?</h3>
<p>${T_G} Yohanes 1:14 menulis bahwa Firman itu "diam di antara kita". Catatan Gereja menjelaskan bahwa secara harfiah artinya "mendirikan kemah-Nya". Kemah Pertemuan adalah tempat kehadiran Allah di tengah umat-Nya; Sabda yang menjadi manusia adalah cara baru kehadiran Allah. Kemuliaan yang dulu memenuhi Kemah Suci (Keluaran 40:34) kini terpusat dalam diri Yesus.</p>
${SRC([["Catatan Yoh 1:14","https://www.bible.com/es/bible/463/JHN.1.NABRE"],["Catatan NAB (vatican.va)","https://www.vatican.va/archive/ENG0839/_PX9.HTM"]])}`,
32:`<h3>❓ Mengapa korban harus diberi garam?</h3>
<p>${T_G} Imamat 2:13 menyebutnya "garam perjanjian Allahmu". Bilangan 18:19 juga berbicara tentang "perjanjian garam untuk selama-lamanya". Yesus berkata kepada murid-murid-Nya: "Kamu adalah garam dunia" (Matius 5:13; bdk. Markus 9:50).</p>
${SRC([["Im 2",U("leviticus",2)],["Bil 18",U("numbers",18)],["Mat 5",U("matthew",5)]])}`,
33:`<h3>❓ Bagaimana dengan orang miskin yang tidak punya domba?</h3>
<p>${T_G} Hukum itu memberi keringanan: yang tidak mampu boleh membawa dua ekor burung tekukur atau merpati, bahkan sedikit tepung (5:7, 11). Keringanan yang sama berlaku bagi ibu yang baru melahirkan (12:8). Maria dan Yusuf membawa persembahan orang sederhana ini ketika mempersembahkan Yesus di Bait Allah (Lukas 2:24).</p>
${SRC([["Im 5",U("leviticus",5)],["Luk 2",U("luke",2)]])}`,
34:`<h3>❓ Apakah masih ada imam seperti Harun?</h3>
<p>${T_G} Surat Ibrani menjelaskan bahwa Yesus adalah Imam Besar yang mempersembahkan diri-Nya sendiri satu kali untuk selama-lamanya, berbeda dengan imam-imam yang harus berganti-ganti (Ibrani 7:23–27). Petrus menyebut umat Allah sebagai "imamat yang rajani" (1 Petrus 2:9), menggemakan Keluaran 19:6.</p>
${SRC([["Ibr 7",U("hebrews",7)],["1 Ptr 2",U("1peter",2)]])}`,
35:`<h3>❓ Apa salah Nadab dan Abihu?</h3>
<p>${T_G} Teks hanya menyebut bahwa mereka mempersembahkan "api yang asing", yang tidak diperintahkan Tuhan (10:1), lalu Tuhan berfirman: kepada orang yang dekat kepada-Ku akan Kunyatakan kekudusan-Ku (10:3). Teks tidak merinci lebih jauh.</p>
<h3>❓ Apakah kita masih dilarang makan babi?</h3>
<p>${T_G} Injil Markus mencatat bahwa Yesus menyatakan semua makanan halal (Markus 7:19), dan Petrus mendapat penglihatan tentang hal ini (Kisah Para Rasul 10:9–16).</p>
${SRC([["Im 10",U("leviticus",10)],["Mrk 7",U("mark",7)],["Kis 10",U("acts",10)]])}`,
36:`<h3>❓ Apakah "kusta" di Imamat sama dengan kusta sekarang?</h3>
<p>${T_G} Kata Ibraninya <i>ṣāra'at</i>. Catatan Gereja menjelaskan bahwa terjemahan lama "kusta" menyesatkan, karena kata itu menunjuk beberapa penyakit kulit kronis, bukan satu penyakit. Penyakit yang kini disebut kusta (penyakit Hansen) kemungkinan tidak termasuk. Kata yang sama juga dipakai untuk jamur pada kain dan dinding rumah.</p>
<p>${T_G} Yesus menyentuh seorang penderita, menyembuhkannya, lalu menyuruhnya menghadap imam sesuai hukum Musa (Markus 1:40–44).</p>
