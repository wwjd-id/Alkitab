 ortu:{r:["Kejadian 29:20 mencatat bahwa tujuh tahun bekerja terasa seperti beberapa hari saja bagi Yakub, karena cintanya kepada Rahel. Cinta yang sungguh membuat pengorbanan terasa ringan. Banyak pasangan pernah merasakannya di awal pernikahan, lalu pelan-pelan tertimbun kesibukan.","Pasal 29–30 juga memperlihatkan luka yang dalam. Lea berharap suaminya akhirnya mencintainya lewat setiap anak yang lahir (29:32–34). Rahel dan Lea saling bersaing. Merasa tidak dicintai di dalam keluarga sendiri adalah luka yang nyata, dan anak-anak pun bisa merasakannya.","Persaingan Lea dan Rahel juga mengingatkan kita untuk tidak membandingkan anak satu dengan yang lain, atau membandingkan pasangan dengan orang lain. Perbandingan melahirkan persaingan, dan persaingan di rumah selalu meninggalkan korban."],
 tanya:["Kapan kamu paling merasa dicintai oleh pasanganmu? Kapan paling tidak?","Apakah kita pernah (tanpa sadar) membandingkan anak-anak satu sama lain?","Apa yang dulu membuat pengorbanan terasa ringan, dan masih adakah sekarang?"],
 aksi:"Lakukan satu hal yang menurut pasanganmu (bukan menurutmu) terasa sebagai bentuk cinta. Minggu ini, hindari kalimat yang membandingkan anak, seperti \"lihat kakakmu…\"."}},
11:{anak:{r:["Setelah bertahun-tahun, Yakub pulang dan harus bertemu Esau, kakak yang dulu ia tipu. Yakub ketakutan sekali. Ia berdoa dengan jujur kepada Tuhan tentang rasa takutnya (Kejadian 32:9–12).","Malam itu Yakub bergulat semalaman sampai fajar, lalu namanya diganti menjadi Israel (32:28). Kadang kita juga \"bergulat\" dengan hal yang berat sebelum akhirnya berubah.","Lalu terjadilah sesuatu yang tidak disangka: Esau berlari menyambutnya, memeluk, mencium, lalu mereka menangis bersama (33:4). Berdamai memang menakutkan, tapi hasilnya bisa jauh lebih indah daripada yang kita bayangkan."],
 tanya:["Ada nggak orang yang perlu kamu ajak berdamai?","Apa yang bikin minta maaf terasa susah?","Menurutmu, kenapa Esau mau memaafkan Yakub?"],
 aksi:"Kirim pesan atau ucapkan \"maaf\" kepada orang yang pernah kamu sakiti minggu ini. Doakan dulu sebelumnya, seperti Yakub."},
 ortu:{r:["Sebelum bertemu Esau, Yakub berdoa dengan jujur tentang rasa takutnya (Kejadian 32:9–12). Saat bertemu, ia sujud tujuh kali (33:3), datang dengan rendah hati, bukan dengan pembelaan diri. Rekonsiliasi dalam keluarga juga dimulai dari kerendahan hati, bukan dari siapa yang paling benar.","Banyak keluarga menyimpan luka lama dengan orang tua, saudara, atau ipar yang tidak pernah selesai. Anak-anak ikut merasakan ketegangan itu, bahkan saat tidak pernah dibicarakan.","Kisah Yakub dan Esau memperlihatkan bahwa perdamaian mungkin terjadi, meski setelah bertahun-tahun. Anak-anak yang menyaksikan orang tuanya berdamai dengan keluarganya sendiri mendapat pelajaran yang tidak akan mereka lupakan."],
 tanya:["Saat berbaikan, apakah kita lebih sering datang dengan rendah hati atau dengan pembelaan diri?","Hubungan keluarga besar mana yang masih menyimpan luka?","Apa yang dilihat anak-anak dari cara kita berdamai?"],
 aksi:"Kalau ada yang belum selesai dengan pasangan, mulai percakapan dengan: \"Aku minta maaf untuk bagianku.\" Doakan satu hubungan keluarga yang perlu dipulihkan."}},
12:{anak:{r:["Kejadian 34 adalah kisah yang berat. Dina, anak perempuan Yakub, diperlakukan dengan jahat oleh seorang pemuda bernama Sikhem. Saudara-saudaranya, Simeon dan Lewi, sangat marah lalu membalas dengan kekerasan yang jauh lebih besar dan menyakiti banyak orang (34:25).","Marah ketika ada yang disakiti itu wajar. Tapi balas dendam tidak menyelesaikan masalah; malah membuat lebih banyak orang terluka. Kalau ada yang menyakitimu atau temanmu, jangan dipendam dan jangan membalas sendiri. Ceritakan kepada orang dewasa yang kamu percaya.","Di pasal 35, Yakub mengajak seluruh keluarganya membuang dewa-dewa asing, membersihkan diri, dan kembali menyembah Tuhan di Betel (35:2–3). Kadang kita juga perlu \"bersih-bersih hati\": membuang hal-hal yang menjauhkan kita dari Tuhan."],
 tanya:["Kalau ada yang menyakitimu, kepada siapa sebaiknya kamu cerita?","Kenapa balas dendam justru bikin masalah makin besar?","Apa yang perlu kamu \"buang\" supaya lebih dekat dengan Tuhan?"],
 aksi:"Sebutkan satu atau dua orang dewasa yang bisa kamu ajak cerita kalau ada yang menyakitimu. Bereskan satu kebiasaan yang menjauhkanmu dari Tuhan."},
 ortu:{r:["Kejadian 34 tidak mudah dibaca bersama anak, tetapi justru penting. Dina disakiti, dan reaksi keluarganya terpecah: Yakub diam (34:5), sementara anak-anaknya membalas dengan kekerasan (34:25). Tidak satu pun reaksi itu yang menolong Dina.","Anak-anak perlu tahu bahwa rumah adalah tempat paling aman untuk bercerita bila mereka disakiti, dan bahwa orang tua akan bertindak dengan bijak, bukan diam dan bukan meledak.","Di pasal 35, Yakub memimpin keluarganya membuang dewa-dewa asing dan kembali kepada Tuhan (35:2–3). Hari ini \"dewa asing\" di rumah mungkin berupa gawai, pekerjaan, atau ambisi yang pelan-pelan menggeser Tuhan dari pusat keluarga. Pembaruan keluarga dimulai saat orang tua berani memimpin."],
 tanya:["Apakah anak-anak merasa aman bercerita kepada kita saat mereka disakiti?","Bagaimana kita biasanya bereaksi saat anak disakiti orang lain: diam, meledak, atau bijak?","Apa \"dewa asing\" di rumah kita yang perlu disingkirkan?"],
 aksi:"Katakan kepada anak-anak dengan jelas: \"Kalau ada yang menyakitimu, kamu selalu boleh cerita ke kami.\" Sepakati satu waktu per minggu tanpa gawai untuk keluarga."}},
13:{anak:{r:["Yusuf adalah anak kesayangan Yakub, dan saudara-saudaranya jadi iri dan membencinya (Kejadian 37:4). Setelah Yusuf menceritakan mimpinya, mereka makin marah lalu menjualnya sebagai budak ke Mesir.","Hidup Yusuf berubah drastis. Tapi Kejadian 39:2 mencatat kalimat penting: Tuhan menyertai Yusuf. Bahkan di tempat asing, sebagai budak, Yusuf tetap bekerja dengan baik dan dipercaya.","Lalu istri Potifar berusaha menggodanya untuk berbuat salah. Yusuf menolak dengan tegas: bagaimana mungkin ia berbuat dosa terhadap Allah (39:9)? Ia bahkan menghindari berada di dekat perempuan itu (39:10). Walaupun akhirnya Yusuf difitnah dan dipenjara, Tuhan tetap menyertainya."],
 tanya:["Pernah diajak teman melakukan hal yang kamu tahu salah? Apa yang kamu lakukan?","Kenapa Yusuf bisa tetap bekerja dengan baik walaupun nasibnya buruk?","Apa yang bisa kamu lakukan supaya tidak mudah tergoda melakukan hal yang salah?"],
 aksi:"Siapkan satu kalimat untuk menolak ajakan yang salah, misalnya: \"Nggak ah, aku nggak mau.\" Kerjakan tugasmu hari ini sebaik mungkin walaupun tidak ada yang melihat."},
 ortu:{r:["Kejadian 37:3–4 memperlihatkan dampak pilih kasih Yakub: Yusuf diberi jubah istimewa, dan saudara-saudaranya membencinya. Yakub mengulang kesalahan orang tuanya sendiri (ingat Ishak dan Ribka di pasal 25). Pola keluarga memang cenderung diwariskan, kecuali kita sengaja memutusnya.","Di pasal 39, Yusuf menjaga kesetiaan: menolak, bahkan menghindari berada di dekat istri Potifar (39:10). Kesetiaan dalam pernikahan dijaga bukan hanya dengan menolak godaan, tetapi juga dengan menjaga jarak dari situasi yang berbahaya.","Kisah Yusuf juga memberi harapan bagi orang tua yang anaknya sedang mengalami masa sulit. Tuhan menyertai Yusuf di sumur, di rumah Potifar, dan di penjara (39:21). Doa orang tua menyertai anak-anak bahkan ke tempat yang tidak bisa kita jangkau."],
 tanya:["Pola apa dari keluarga asal kita yang ingin kita putus?","Batas apa yang kita sepakati untuk menjaga kesetiaan, misalnya soal chat, pertemanan, atau media sosial?","Anak mana yang sedang melewati masa sulit dan perlu kita doakan secara khusus?"],
 aksi:"Bicarakan dan sepakati satu batas yang membuat kalian berdua merasa aman dalam pernikahan. Doakan anak yang sedang mengalami masa sulit secara khusus minggu ini."}},
14:{anak:{r:["Di penjara, Yusuf mengartikan mimpi juru minuman dan juru roti raja. Juru minuman berjanji akan mengingat Yusuf saat bebas nanti, tapi ternyata ia lupa (Kejadian 40:23). Yusuf harus menunggu dua tahun lagi (41:1). Pernah dilupakan atau tidak dihargai? Yusuf juga pernah.","Akhirnya Firaun bermimpi dan tidak ada yang bisa mengartikannya. Yusuf dipanggil, dan ia menjawab bahwa bukan dirinya yang bisa, melainkan Allah (41:16). Yusuf tetap rendah hati, walaupun ini kesempatan emas untuk menyombongkan diri.","Yusuf pun diangkat menjadi penguasa Mesir. Lalu saudara-saudaranya datang membeli gandum tanpa mengenalinya. Mereka mulai menyesal dan berkata satu sama lain bahwa mereka sedang menanggung akibat perbuatan mereka terhadap Yusuf (42:21)."],
 tanya:["Kalau kamu berhasil dalam sesuatu, siapa saja yang ikut berperan?","Bagaimana rasanya dilupakan atau tidak dihargai? Apa yang membantumu tetap semangat?","Kenapa rasa bersalah bisa bertahan lama?"],
 aksi:"Ucapkan terima kasih kepada Tuhan dan kepada satu orang yang membantumu berhasil. Kalau ada kesalahan yang masih mengganjal, ceritakan kepada orang tuamu."},
 ortu:{r:["Yusuf harus menunggu dua tahun lagi di penjara karena dilupakan orang yang pernah ia tolong (Kejadian 40:23; 41:1). Banyak orang tua juga merasa \"dilupakan\": pengorbanan yang tidak dihargai, kerja keras yang tidak terlihat. Yusuf tetap setia di tempatnya, dan Tuhan bekerja pada waktu-Nya.","Saat akhirnya berdiri di depan Firaun, Yusuf memberi kemuliaan kepada Allah (41:16). Anak-anak belajar kerendahan hati dari melihat bagaimana orang tuanya menanggapi keberhasilan.","Bertahun-tahun setelah menjual Yusuf, saudara-saudaranya masih dihantui rasa bersalah (42:21). Kesalahan yang tidak pernah diakui tidak hilang begitu saja; ia muncul lagi di saat tak terduga. Keluarga yang sehat memberi ruang untuk mengaku salah dan diampuni, baik antara suami-istri maupun antara orang tua dan anak."],
 tanya:["Pengorbanan apa yang kita rasa tidak dihargai? Sudahkah kita membicarakannya dengan baik?","Bagaimana kita menanggapi keberhasilan di depan anak-anak?","Apakah ada sesuatu yang belum pernah kita bicarakan tapi masih mengganjal?"],
 aksi:"Ucapkan terima kasih kepada pasangan untuk satu pengorbanan yang selama ini jarang kamu sebut. Ciptakan suasana aman minggu ini: berjanji mendengar tanpa langsung menghakimi."}},
15:{anak:{r:["Saudara-saudara Yusuf kembali ke Mesir bersama Benyamin, adik bungsu mereka. Yusuf menguji mereka dengan menaruh piala perak di karung Benyamin. Saat Benyamin akan dijadikan budak, Yehuda maju dan menawarkan diri menggantikannya (Kejadian 44:33).","Tahu nggak, dulu Yehuda-lah yang mengusulkan untuk menjual Yusuf (37:26–27). Sekarang ia rela berkorban untuk adiknya. Orang bisa berubah!","Melihat itu, Yusuf tidak tahan lagi. Ia membuka jati dirinya, lalu menangis dan memeluk saudara-saudaranya (45:14–15). Yusuf yang paling disakiti justru yang paling dulu mengampuni."],
 tanya:["Pernah melihat seseorang berubah jadi lebih baik? Ceritakan!","Menurutmu, kenapa Yusuf bisa memaafkan saudara-saudaranya?","Apa yang membuat memaafkan terasa sulit?"],
 aksi:"Berikan kesempatan kedua kepada seseorang yang pernah mengecewakanmu. Lakukan satu pengorbanan kecil untuk saudaramu minggu ini."},
 ortu:{r:["Perubahan Yehuda adalah salah satu kisah pertobatan paling indah di Kejadian. Dari orang yang menjual adiknya (37:26–27), ia menjadi orang yang rela menggantikan adiknya (44:33). Kisah ini memberi harapan bagi orang tua yang anaknya sedang \"tersesat\": orang bisa berubah.","Di Kejadian 45:5, Yusuf melihat masa lalunya yang menyakitkan dari sudut pandang baru: Allah menyuruhnya mendahului mereka untuk memelihara kehidupan. Pengampunan tidak menghapus luka, tetapi memberi makna baru.","Setiap keluarga punya masa lalu yang menyakitkan: kegagalan, krisis, atau kata-kata yang melukai. Kisah Yusuf mengajak kita melihat bagaimana Tuhan bisa memakai semua itu untuk kebaikan, dan menceritakannya kepada anak-anak sebagai kesaksian iman keluarga."],
 tanya:["Anak mana yang perlu kita yakini bisa berubah, walaupun sekarang sulit?","Luka apa dalam perjalanan keluarga kita yang ternyata membentuk kita jadi lebih kuat?","Kisah iman keluarga apa yang perlu kita ceritakan kepada anak-anak?"],
 aksi:"Ceritakan kepada anak-anak satu masa sulit yang pernah dilalui keluarga, dan bagaimana Tuhan menolong. Doakan anak yang sedang sulit dengan keyakinan bahwa ia bisa berubah."}},
16:{anak:{r:["Yakub sudah tua sekali saat harus pindah ke Mesir, negeri yang asing baginya. Di perjalanan, Allah berbicara: jangan takut pergi ke Mesir, Aku sendiri akan menyertaimu (Kejadian 46:3–4).","Pindah rumah, pindah sekolah, masuk kelas baru, atau punya guru baru memang bikin deg-degan. Tapi kamu tidak pergi sendirian; Tuhan ikut bersamamu.","Saat bertemu lagi, Yusuf memeluk ayahnya dan menangis lama sekali (46:29). Bayangkan, mereka berpisah lebih dari dua puluh tahun! Di pasal 48, Yakub memberkati cucu-cucunya, Efraim dan Manasye, dengan menumpangkan tangan di kepala mereka."],
 tanya:["Perubahan apa yang sedang atau akan kamu hadapi?","Apa yang membuatmu tenang saat menghadapi hal baru?","Bagaimana rasanya didoakan atau diberkati oleh orang tua atau kakek-nenek?"],
 aksi:"Doakan perubahan yang sedang kamu hadapi malam ini, dan ceritakan perasaanmu kepada orang tua. Kalau bisa, telepon atau kunjungi kakek-nenekmu minggu ini."},
 ortu:{r:["Di Kejadian 48:15–16, Yakub yang sudah tua memberkati cucu-cucunya. Ia meletakkan tangan di kepala mereka dan mengingat bagaimana Allah menuntunnya sepanjang hidup. Memberkati anak bukan hanya tugas imam; orang tua pun bisa mendoakan anak-anaknya secara langsung.","Ada kekuatan khusus ketika anak mendengar orang tuanya mendoakan mereka dengan menyebut nama, harapan, dan karunia yang mereka miliki. Kata-kata berkat seperti itu bisa diingat anak seumur hidup.","Pertemuan Yakub dan Yusuf (46:29) juga mengingatkan kita pada generasi di atas: orang tua dan mertua kita yang semakin tua. Anak-anak belajar menghormati dan merawat orang tua dengan melihat bagaimana kita memperlakukan kakek-nenek mereka."],
 tanya:["Berkat atau doa apa yang ingin kita ucapkan untuk setiap anak?","Kapan terakhir kali anak-anak mendengar kita mendoakan mereka secara langsung?","Bagaimana kita memperlakukan kakek-nenek di depan anak-anak?"],
 aksi:"Malam ini, doakan setiap anak dengan meletakkan tangan di kepala mereka sebelum tidur. Ajak anak-anak menelepon atau mengunjungi kakek-nenek minggu ini."}},
17:{anak:{r:["Di akhir hidupnya, Yakub memberkati kedua belas anaknya (Kejadian 49). Setelah Yakub meninggal, saudara-saudara Yusuf ketakutan. Mereka pikir sekarang Yusuf akan membalas dendam (50:15).","Tapi Yusuf malah menangis dan berkata: kalian merencanakan yang jahat, tetapi Allah mengubahnya menjadi kebaikan (50:20). Lalu ia menghibur mereka dan berbicara lembut kepada mereka (50:21).","Inilah akhir Kitab Kejadian. Dimulai dengan manusia yang berdosa dan saling menyalahkan, diakhiri dengan saudara yang saling mengampuni. Hal buruk yang kamu alami tidak pernah lebih besar daripada Allah. Ia bisa mengubahnya menjadi sesuatu yang baik."],
 tanya:["Pernah mengalami hal buruk yang ternyata berujung baik?","Kenapa memaafkan bisa membuat hati lebih lega?","Dari seluruh Kitab Kejadian, kisah mana yang paling kamu ingat? Kenapa?"],
 aksi:"Tulis satu hal sulit yang sedang kamu alami, lalu serahkan kepada Tuhan dalam doa. Ceritakan kepada keluargamu kisah favoritmu dari Kitab Kejadian."},
 ortu:{r:["Setelah Yakub wafat, saudara-saudara Yusuf takut ia akan membalas (Kejadian 50:15). Yusuf justru menenangkan dan berbicara lembut kepada mereka (50:21). Pengampunan sejati tidak diungkit lagi saat ada kesempatan membalas.","Banyak pertengkaran dalam rumah tangga menjadi berat karena kesalahan lama terus diungkit. Pengampunan bukan sekadar mengucapkan \"aku maafkan\", tetapi juga memutuskan untuk tidak lagi menjadikan kesalahan itu senjata.","Kejadian 50:20 merangkum seluruh kisah Yusuf, bahkan seluruh Kitab Kejadian: manusia merencanakan yang jahat, tetapi Allah mengubahnya menjadi kebaikan. Sebagai orang tua, kita tidak bisa menjaga anak dari semua hal buruk. Tetapi kita bisa mengajari mereka bahwa Allah sanggup bekerja melalui hal-hal yang paling sulit sekalipun."],
 tanya:["Apakah ada kesalahan lama yang masih sering kita ungkit saat bertengkar?","Bagaimana kita mengajari anak menghadapi hal buruk yang menimpa mereka?","Apa pelajaran terbesar dari Kitab Kejadian bagi keluarga kita?"],
 aksi:"Sepakati: kesalahan yang sudah dimaafkan tidak dibawa lagi ke pertengkaran berikutnya. Ajak keluarga merayakan selesainya Kitab Kejadian dengan makan bersama dan saling berbagi kisah favorit."}},
18:{anak:{r:["Bayangkan disuruh raja yang paling berkuasa untuk melakukan hal yang jahat. Itulah yang dialami dua bidan, Sifra dan Pua. Firaun menyuruh mereka membunuh bayi laki-laki Israel, tapi mereka takut akan Allah dan membiarkan bayi-bayi itu hidup (Keluaran 1:17). Mereka cuma bidan, bukan pahlawan perang, tapi keberanian mereka menyelamatkan banyak nyawa.","Salah satu bayi yang selamat adalah Musa. Ibunya menyembunyikannya, lalu menaruhnya dalam keranjang di sungai Nil, dan kakaknya menjaga dari jauh (2:3–4). Satu keluarga kecil yang berani dan saling menjaga dipakai Allah untuk rencana yang sangat besar.","Waktu Musa sudah dewasa, Allah memanggilnya dari semak yang menyala. Reaksi Musa? “Siapakah aku ini?” (3:11). Allah tidak menjawab “kamu hebat kok”. Allah menjawab, “Aku akan menyertai engkau” (3:12). Waktu kamu merasa tidak mampu, yang paling penting bukan seberapa hebat kamu, tapi siapa yang menyertaimu."],
 tanya:["Pernah disuruh atau diajak teman melakukan hal yang kamu tahu salah? Apa yang kamu lakukan?","Kakak Musa menjaga adiknya dari jauh. Bagaimana caramu menjaga saudaramu?","Hal apa yang bikin kamu berpikir “siapakah aku ini, aku nggak bisa”?"],
 aksi:"Pilih satu hal yang kamu rasa sulit minggu ini (tugas, lomba, minta maaf). Sebelum mulai, doa singkat: “Tuhan, sertai aku.” Lalu lakukan."},
 ortu:{r:["Keluaran dibuka dengan dua perempuan biasa, Sifra dan Pua, yang menolak perintah raja karena takut akan Allah (1:17). Ketaatan kepada Allah kadang berarti berkata “tidak” kepada tekanan dari atas: atasan, lingkungan, bahkan budaya keluarga besar. Anak-anak belajar keberanian moral dari melihat orang tuanya memilih yang benar walau ada harganya.","Keluarga Musa juga patut direnungkan. Ibu yang menyembunyikan bayinya selama tiga bulan (2:2), kakak yang berjaga, dan akhirnya sang ibu justru dibayar untuk menyusui anaknya sendiri (2:9). Allah sering bekerja melalui kesetiaan sederhana orang tua dalam hal-hal kecil yang tidak dilihat siapa pun.","Saat dipanggil, Musa penuh alasan. Jawaban Allah bukan memuji kemampuan Musa, melainkan menjanjikan penyertaan: “Aku akan menyertai engkau” (3:12). Banyak orang tua merasa tidak cukup rohani untuk mengajar iman kepada anak. Panggilan itu tetap ada, dan janji penyertaan-Nya juga tetap ada."],
 tanya:["Dalam hal apa kita sedang ditekan untuk berkompromi dengan yang tidak benar?","Kesetiaan kecil apa yang kita lakukan untuk anak-anak tanpa dilihat orang lain?","Dalam hal iman keluarga, di mana kita paling sering berkata “siapakah aku ini”?"],
 aksi:"Ceritakan kepada anak-anak satu saat ketika kamu memilih yang benar walau sulit. Pasangan: saling sebut satu kesetiaan kecil yang selama ini kalian lihat dari satu sama lain."}},
19:{anak:{r:["Musa masih ragu. Ia bilang ia tidak pandai bicara (Keluaran 4:10). Allah menjawab: siapa yang membuat mulut manusia? Aku akan menyertai lidahmu (4:11–12). Allah juga memberinya teman, Harun, kakaknya, untuk berbicara bersama (4:14–16). Allah tahu kelemahan kita, dan Ia sering menolong lewat orang lain.","Waktu Musa dan Harun menghadap Firaun, hasilnya malah buruk. Firaun menambah beban kerja orang Israel, dan orang Israel marah kepada Musa (5:21). Kadang melakukan hal yang benar tidak langsung membuat keadaan lebih baik. Musa bahkan mengeluh kepada Tuhan (5:22–23).","Allah tidak memarahi Musa karena mengeluh. Ia menegaskan lagi janji-Nya: Aku akan membebaskan kamu (6:6). Tapi orang Israel tidak mau mendengar karena mereka patah semangat dan kerja berat (6:9). Waktu kita capek dan sedih, kita juga susah percaya. Itu wajar. Allah tetap setia pada janji-Nya."],
 tanya:["Apa kelemahanmu yang bikin kamu minder?","Siapa “Harun” dalam hidupmu, orang yang membantumu waktu kamu tidak bisa sendirian?","Pernah melakukan hal baik tapi hasilnya malah buruk? Apa yang kamu rasakan?"],
 aksi:"Ceritakan satu keluhanmu kepada Tuhan dalam doa dengan jujur, seperti Musa. Lalu ucapkan terima kasih kepada satu orang yang sering membantumu."},
 ortu:{r:["Musa menyebut kelemahannya, dan Allah menjawab dengan memberinya Harun (4:14–16). Dalam keluarga, pasangan sering menjadi “Harun” bagi satu sama lain: yang satu kuat bicara, yang lain kuat mendengar; yang satu tegas, yang lain lembut. Perbedaan itu bukan masalah, tetapi rancangan untuk saling melengkapi.","Keluaran 5 jujur sekali: ketaatan Musa justru membuat keadaan lebih berat, dan orang-orang menyalahkannya (5:21). Mendidik anak dalam iman pun bisa terasa begitu. Kita menegakkan aturan atau nilai yang benar, lalu anak memberontak dan suasana rumah memanas. Itu bukan selalu tanda kita salah jalan.","Keluaran 6:9 mencatat bangsa itu tidak mendengarkan karena patah semangat dan beratnya perbudakan. Saat pasangan atau anak sedang kelelahan, nasihat rohani yang benar pun sering tidak masuk. Kadang yang pertama mereka butuhkan adalah istirahat dan pengertian, baru kemudian kata-kata."],
 tanya:["Dalam hal apa pasangan menjadi “Harun” bagi kita?","Keputusan benar apa yang membuat suasana rumah sempat lebih berat?","Siapa di rumah yang sedang “patah semangat” dan butuh pengertian lebih dulu daripada nasihat?"],
 aksi:"Katakan kepada pasangan satu kekuatannya yang melengkapi kelemahanmu. Untuk anggota keluarga yang sedang lelah, tawarkan bantuan nyata hari ini, bukan nasihat."}},
20:{anak:{r:["Mulai pasal 7 datanglah tulah-tulah di Mesir: air jadi darah, katak di mana-mana, nyamuk, lalat, ternak mati, barah, sampai hujan es. Setiap kali, Firaun bilang akan melepas Israel, tapi begitu tulah berhenti, ia berubah pikiran lagi (8:15).","Firaun pernah berkata, “Aku telah berbuat dosa” (9:27). Tapi besoknya hatinya keras lagi. Minta maaf hanya supaya hukuman berhenti, lalu mengulangi lagi, itu bukan menyesal sungguhan. Kita juga bisa begitu: bilang “maaf” ke orang tua supaya tidak dimarahi, padahal tidak mau berubah.","Di tengah semua itu, Allah membedakan tempat tinggal Israel di Gosyen; di sana tidak ada lalat (8:22) dan tidak ada hujan es (9:26). Allah melindungi umat-Nya. Tujuan tulah-tulah itu juga disebut: supaya semua orang tahu bahwa Tuhanlah Allah (9:14)."],
 tanya:["Pernah minta maaf cuma supaya tidak dimarahi? Apa bedanya dengan minta maaf sungguhan?","Kenapa ya Firaun terus berubah pikiran?","Kapan kamu merasa dilindungi Tuhan?"],
 aksi:"Kalau kamu minta maaf minggu ini, tambahkan: “Lain kali aku akan …” lalu sungguh lakukan."},
 ortu:{r:["Kisah tulah-tulah memperlihatkan pola Firaun yang terus berulang: tekanan datang, ia berjanji; tekanan hilang, ia ingkar (8:15; 9:34). Pola ini bisa kita kenali juga dalam diri sendiri: tekun berdoa saat ada krisis, lalu lupa saat semuanya lancar.","Di rumah, kita mungkin melihat pola serupa pada anak: menyesal saat ketahuan, lalu mengulang. Tetapi kita juga perlu jujur apakah cara kita menegur hanya menghasilkan “maaf supaya selesai”, bukan perubahan hati. Anak lebih mudah bertobat sungguh-sungguh bila merasa aman untuk jujur.","Allah membedakan Gosyen dari bagian Mesir lainnya (8:22). Keluarga kita juga bisa menjadi “Gosyen”: tempat yang berbeda di tengah lingkungan yang keras, tempat anak merasa aman, dikasihi, dan diarahkan kepada Allah."],
 tanya:["Kebiasaan rohani apa yang kuat saat krisis, tetapi kendur saat semuanya lancar?","Apakah cara kita menegur anak menghasilkan perubahan, atau hanya kata “maaf”?","Apa yang membuat rumah kita terasa aman bagi anak?"],
 aksi:"Saat anak berbuat salah minggu ini, setelah ia minta maaf, ajak ia memikirkan satu langkah perbaikan yang konkret bersama-sama, tanpa ceramah panjang."}},
21:{anak:{r:["Sebelum tulah terakhir, Allah memberi perintah aneh: setiap keluarga menyembelih seekor anak domba dan mengoleskan darahnya di tiang pintu rumah (Keluaran 12:7). Malam itu, rumah yang ada tanda darah dilewati. Inilah asal nama “Paskah”: dilewati.","Allah juga berpesan: kalau nanti anak-anakmu bertanya, “Apa artinya ibadah ini?”, ceritakanlah apa yang Tuhan lakukan (12:26–27). Jadi pertanyaan anak-anak itu penting! Kamu boleh bertanya tentang iman, dan orang tuamu dipanggil untuk menjelaskannya.","Di Perjanjian Baru, Yesus disebut sebagai Anak Domba Paskah kita. Bahkan aturan bahwa tulang anak domba tidak boleh dipatahkan (12:46) dikutip saat Yesus disalib (Yohanes 19:36). Setiap kali kita merayakan Paskah dan Ekaristi, kita mengingat bahwa Yesus menyelamatkan kita."],
 tanya:["Pertanyaan apa tentang iman atau Gereja yang ingin kamu tanyakan ke orang tua?","Kenapa ya Allah ingin peristiwa ini diceritakan terus dari generasi ke generasi?","Apa hubungan anak domba Paskah dengan Yesus?"],
 aksi:"Malam ini, tanyakan satu pertanyaan tentang iman kepada orang tuamu, apa saja. Kalau mereka belum tahu jawabannya, cari bersama."},
 ortu:{r:["Paskah pertama dirayakan di rumah, oleh keluarga, di sekitar meja makan (12:3–4). Iman Israel tidak hanya diwariskan lewat imam dan tempat ibadah, tetapi lewat makan malam keluarga yang penuh makna.","Keluaran 12:26–27 mengandaikan anak-anak akan bertanya, dan orang tua siap bercerita. Pertanyaan anak bukan gangguan atau tanda kurang iman; itu pintu. Banyak orang tua takut tidak bisa menjawab. Kita tidak perlu tahu semua jawaban, tetapi kita perlu menyambut pertanyaannya.","Bagi kita, Paskah Yahudi menemukan kepenuhannya dalam Kristus, Anak Domba Allah (Yohanes 19:36; 1:29). Setiap Ekaristi adalah “Paskah” yang kita rayakan bersama. Cara kita menyiapkan anak-anak untuk Misa, dan membicarakannya sesudahnya, ikut menentukan apakah Misa bermakna bagi mereka."],
 tanya:["Kapan terakhir kali anak bertanya tentang iman, dan bagaimana reaksi kita?","Apakah ada momen makan bersama keluarga yang bisa menjadi waktu berbagi iman?","Bagaimana kita bisa membuat Misa hari Minggu lebih bermakna bagi anak-anak?"],
 aksi:"Pada makan malam berikutnya, ceritakan bagaimana Tuhan pernah menolong keluarga kalian. Hari Minggu ini, sesudah Misa, tanyakan kepada anak bagian mana yang paling mereka ingat."}},
22:{anak:{r:["Waktu keluar dari Mesir, Allah tidak memimpin Israel lewat jalan terpendek ke negeri Filistin, supaya mereka tidak takut melihat perang lalu kembali ke Mesir (Keluaran 13:17). Kadang jalan yang Tuhan pilih lebih panjang, tapi itu karena Ia tahu kita belum siap.","Lalu mereka terjebak: di depan laut, di belakang tentara Firaun. Mereka panik. Musa berkata: jangan takut, berdirilah tetap, TUHAN akan berperang untuk kamu, dan kamu akan diam saja (14:13–14). Laut pun terbelah dan mereka berjalan di tanah kering.","Sesudah selamat, mereka bernyanyi dan menari. Miryam, kakak Musa, memimpin para perempuan dengan rebana (15:20–21). Tapi tiga hari kemudian, mereka sudah mengeluh lagi karena air pahit di Mara (15:24). Gampang sekali kita lupa kebaikan Tuhan, ya?"],
 tanya:["Pernah merasa terjebak, seperti di antara laut dan tentara? Apa yang terjadi?","Kenapa ya orang Israel cepat sekali lupa dan mengeluh lagi?","Bagaimana caramu supaya tidak lupa kebaikan Tuhan?"],
 aksi:"Buat “jurnal syukur”: tulis tiga kebaikan Tuhan yang kamu alami minggu ini. Bacakan satu di antaranya waktu makan malam."},
 ortu:{r:["Keluaran 13:17 menunjukkan bahwa Allah memilih jalan memutar karena mengenal kerapuhan umat-Nya. Sebagai orang tua, kita kadang bertanya mengapa jalan keluarga kita lebih panjang: keuangan yang tidak juga lega, anak yang lambat berkembang, doa yang belum terjawab. Bisa jadi Allah sedang melindungi kita dari sesuatu yang belum sanggup kita hadapi.","Di tepi laut, Musa berkata: berdirilah tetap, TUHAN akan berperang untukmu (14:13–14). Ada saat-saat ketika yang terbaik adalah berhenti panik dan berhenti mengatur segalanya. Anak-anak merasakan kecemasan orang tua lebih dari yang kita kira; ketenangan kita adalah khotbah bagi mereka.","Hanya tiga hari setelah mukjizat besar, bangsa itu bersungut-sungut di Mara (15:22–24). Rasa syukur ternyata tidak bertahan dengan sendirinya; ia perlu dilatih. Keluarga yang terbiasa menyebut berkat setiap hari akan lebih kuat ketika masa sulit datang."],
 tanya:["“Jalan memutar” apa yang sedang dilalui keluarga kita?","Dalam situasi apa kita perlu berhenti panik dan belajar “diam”?","Kebiasaan apa yang bisa melatih rasa syukur di rumah?"],
 aksi:"Mulai kebiasaan sederhana: setiap makan malam minggu ini, setiap orang menyebut satu hal yang disyukuri hari itu."}},
23:{anak:{r:["Di padang gurun tidak ada warung atau supermarket. Allah memberi manna setiap pagi. Aturannya: ambil secukupnya untuk hari itu. Ada yang menyimpan untuk besok, dan besoknya manna itu berulat dan berbau busuk (Keluaran 16:20). Allah sedang mengajari mereka percaya bahwa besok pun Ia akan memberi lagi.","Yang menarik: yang mengumpulkan banyak tidak kelebihan, yang mengumpulkan sedikit tidak kekurangan (16:18). Paulus mengutip ayat ini untuk mengajarkan berbagi supaya semua cukup (2 Korintus 8:15). Kalau kita punya lebih, itu kesempatan untuk berbagi.","Di pasal 17, Israel berperang melawan Amalek. Selama tangan Musa terangkat, Israel menang. Waktu Musa capek, Harun dan Hur menopang tangannya sampai matahari terbenam (17:12). Bahkan Musa yang hebat butuh teman. Di pasal 18, mertuanya, Yitro, menasihati Musa supaya tidak mengerjakan semuanya sendirian."],
 tanya:["Kenapa ya Allah memberi manna setiap hari, bukan sekaligus untuk sebulan?","Kamu punya sesuatu yang lebih yang bisa dibagi dengan orang lain?","Siapa yang perlu kamu “topang tangannya” minggu ini?"],
 aksi:"Bagikan sesuatu milikmu (jajan, mainan, waktu) kepada seseorang minggu ini. Bantu satu anggota keluarga yang sedang kelelahan."},
 ortu:{r:["Manna diberikan untuk satu hari (16:4), dan menimbun justru membuatnya busuk (16:20). Doa Bapa Kami menggemakan hal yang sama: “berilah kami rezeki pada hari ini”. Kekhawatiran tentang masa depan, biaya sekolah, pensiun, dan kesehatan, bisa menggerogoti sukacita hari ini. Merencanakan dengan bijak itu baik; hidup dikuasai kecemasan itu lain soal.","Harun dan Hur menopang tangan Musa (17:12). Dalam rumah tangga, ada saat-saat salah satu pasangan “tangannya turun”: kelelahan, sakit, atau sedang terpuruk. Pernikahan yang kuat bukan yang tidak pernah lemah, tetapi yang saling menopang saat salah satu tidak sanggup lagi.","Nasihat Yitro sangat praktis: “tidak baik seperti yang kaulakukan itu… engkau akan menjadi sangat lelah” (18:17–18). Banyak orang tua, terutama yang merasa harus mengurus segalanya, perlu mendengar ini. Membagi tugas kepada pasangan dan melibatkan anak-anak sesuai usianya bukan kelemahan, melainkan hikmat."],
 tanya:["Kekhawatiran masa depan apa yang paling menyita damai kita?","Kapan terakhir kali kita sungguh “menopang tangan” pasangan?","Tugas rumah apa yang bisa dibagi lebih adil, termasuk kepada anak-anak?"],
 aksi:"Duduk berdua dan tulis daftar pekerjaan rumah. Bagi ulang dengan adil, dan berikan anak-anak satu tanggung jawab yang sesuai usia mereka."}},
24:{anak:{r:["Di gunung Sinai, Allah berkata kepada Israel: Aku telah mendukung kamu di atas sayap rajawali dan membawa kamu kepada-Ku (Keluaran 19:4). Allah membebaskan mereka dulu, baru memberi aturan. Aturan Allah bukan syarat supaya dikasihi; aturan itu diberikan kepada orang yang sudah dikasihi.","Lalu Allah memberi Sepuluh Firman. Ada perintah tentang Allah (jangan ada allah lain, jangan menyebut nama Tuhan dengan sembarangan, kuduskan hari Sabat), dan ada perintah tentang sesama. Salah satunya: hormatilah ayahmu dan ibumu (20:12). Paulus menyebutnya perintah pertama yang disertai janji (Efesus 6:2).","Di pasal 21 mulai ada aturan-aturan yang lebih rinci, termasuk “mata ganti mata” (21:24). Kedengarannya kejam, tapi tujuannya justru membatasi balas dendam supaya tidak berlebihan. Yesus kemudian mengajak kita melangkah lebih jauh lagi: tidak membalas kejahatan dengan kejahatan (Matius 5:38–39)."],
 tanya:["Menurutmu, kenapa Allah memberi aturan kepada orang yang Ia kasihi?","Apa contoh nyata menghormati ayah dan ibu di rumah, sekolah, dan media sosial?","Kalau ada yang menyakitimu, apa yang biasanya ingin kamu lakukan?"],
 aksi:"Lakukan satu bentuk hormat kepada orang tua hari ini tanpa diminta, misalnya langsung menjawab saat dipanggil atau membantu pekerjaan rumah."},
 ortu:{r:["Sebelum memberi Sepuluh Firman, Allah mengingatkan apa yang sudah Ia lakukan: membebaskan dan membawa Israel kepada-Nya (19:4; 20:2). Urutannya penting: kasih dulu, baru aturan. Di rumah, aturan yang diberikan dalam relasi yang hangat akan diterima sangat berbeda dengan aturan yang diberikan dalam suasana dingin dan penuh ancaman.","Perintah “hormatilah ayahmu dan ibumu” (20:12) mengikat anak, tetapi juga mengundang kita bertanya: apakah kita mudah dihormati? Konsistensi, kejujuran, dan cara kita memperlakukan orang tua kita sendiri ikut membentuk rasa hormat anak.","Keluaran 21 memuat aturan tentang budak dan ganti rugi yang terasa jauh dari dunia kita. Namun di baliknya ada prinsip yang tetap berlaku: kekuasaan harus dibatasi dan yang lemah dilindungi (misalnya 21:26–27). Dalam keluarga, orang tua memegang kuasa besar atas anak; kuasa itu dipercayakan untuk melindungi, bukan untuk menguasai."],
 tanya:["Apakah aturan di rumah kita lebih terasa sebagai ungkapan kasih atau ancaman?","Hal apa dari diri kita yang membuat anak mudah atau sulit menghormati kita?","Bagaimana kita memakai kuasa sebagai orang tua: melindungi atau menguasai?"],
 aksi:"Pilih satu aturan rumah, lalu jelaskan kepada anak alasannya dengan tenang dan dengarkan pendapat mereka. Hubungi orang tua atau mertua kalian minggu ini sebagai teladan menghormati orang tua."}},
25:{anak:{r:["Hukum Allah di pasal 22–23 banyak membela orang yang lemah: orang asing, janda, dan anak yatim tidak boleh ditindas (Keluaran 22:21–22). Ada juga perintah unik: kalau melihat keledai musuhmu jatuh karena bebannya, tolonglah (23:5). Menolong orang yang tidak kita sukai? Wah, itu berat!","Ada juga ayat: jangan ikut-ikutan orang banyak berbuat jahat (23:2). Kalau semua teman sekelas mengejek seseorang atau menyontek, bukan berarti itu jadi benar.","Di pasal 24, seluruh bangsa berkata: segala firman Tuhan akan kami lakukan (24:3, 7). Lalu Musa naik ke gunung, ke dalam awan, selama empat puluh hari empat puluh malam (24:18). Janji itu indah, tapi menepatinya ternyata tidak gampang. Nanti kita lihat apa yang terjadi."],
 tanya:["Siapa “orang lemah” di sekitarmu, di kelas atau lingkungan rumah?","Pernah merasa terdorong ikut-ikutan teman berbuat salah? Apa yang membantumu bertahan?","Apa susahnya menolong orang yang tidak kita sukai?"],
 aksi:"Ajak bicara atau temani seseorang di sekolah yang sering sendirian. Kalau teman-teman mengejek seseorang, jangan ikut tertawa."},
 ortu:{r:["Keluaran 22–23 penuh perhatian bagi yang rentan: orang asing, janda, anak yatim, orang miskin yang meminjam uang (22:21–27). Allah menyebut alasannya: kamu pun dulu orang asing di Mesir (23:9). Pengalaman pernah susah seharusnya membuat kita lebih peka, bukan lebih keras.","Perintah menolong hewan milik musuh (23:4–5) sangat konkret. Kasih kepada musuh dalam Perjanjian Lama tidak dimulai dari perasaan, tetapi dari tindakan nyata. Anak-anak belajar hal ini dari cara kita membicarakan dan memperlakukan orang yang menyakiti kita: tetangga yang menyebalkan, rekan kerja, atau kerabat yang sulit.","Di pasal 24, bangsa itu dengan semangat berjanji melakukan semua firman Tuhan (24:7). Janji pernikahan kita juga diucapkan dengan semangat. Kesetiaan sejati teruji bukan di hari janji diucapkan, tetapi di hari-hari biasa sesudahnya."],
 tanya:["Pengalaman sulit apa di masa lalu yang bisa membuat kita lebih peka kepada orang lain?","Bagaimana anak-anak mendengar kita membicarakan orang yang menyakiti kita?","Janji pernikahan mana yang paling perlu kita perbarui dalam tindakan sehari-hari?"],
 aksi:"Sebagai keluarga, lakukan satu tindakan nyata bagi orang yang rentan bulan ini: mengunjungi panti, membantu tetangga lansia, atau berbagi makanan."}},
26:{anak:{r:["Allah ingin tinggal di tengah-tengah umat-Nya. Ia berkata: buatlah tempat kudus bagi-Ku, supaya Aku diam di tengah-tengah mereka (Keluaran 25:8). Allah tidak mau jauh dari kita!","Bahan-bahannya dikumpulkan dari persembahan setiap orang yang tergerak hatinya (25:2). Bukan dipaksa, tapi karena mau. Ada emas, kain, kulit, kayu, minyak. Setiap orang bisa ikut menyumbang sesuai yang mereka punya.","Di dalam Kemah Suci ada tabut perjanjian, meja roti, dan kandil yang lampunya harus terus menyala (27:20). Hari ini, Allah juga hadir di gereja, terutama dalam Sakramen Mahakudus di tabernakel. Lampu merah yang menyala di dekat tabernakel mengingatkan kita bahwa Yesus hadir di sana."],
 tanya:["Apa artinya bagimu bahwa Allah ingin tinggal dekat dengan kita?","Apa yang bisa kamu persembahkan untuk Tuhan, selain uang?","Pernah perhatikan lampu merah di dekat tabernakel di gereja? Tahu artinya?"],
 aksi:"Hari Minggu ini, sebelum atau sesudah Misa, berlutut sebentar di depan tabernakel dan sapa Yesus dengan doa singkat."},
 ortu:{r:["Keluaran 25:8 adalah salah satu ayat terindah di kitab ini: Allah ingin diam di tengah umat-Nya. Seluruh rancangan Kemah Suci yang begitu rinci berangkat dari keinginan itu. Allah tidak puas hanya membebaskan; Ia ingin hadir dan tinggal bersama.","Bahan-bahannya datang dari persembahan sukarela, “setiap orang yang terdorong hatinya” (25:2). Pemberian untuk Tuhan dan sesama yang paling bermakna lahir dari hati yang rela, bukan rasa terpaksa atau gengsi. Anak-anak bisa diajak memberi dari uang saku mereka sendiri, dengan sukacita.","Detail Kemah Suci, tirai, papan, pelataran, menunjukkan bahwa Allah peduli pada cara Ia didekati. Dalam keluarga, menciptakan sudut doa di rumah, waktu doa yang tetap, atau sikap hormat saat Misa adalah cara kecil menyediakan “tempat” bagi Allah di tengah keluarga kita."],
 tanya:["Di mana dan kapan Allah mendapat “tempat” dalam rutinitas keluarga kita?","Apakah pemberian kita lahir dari hati yang rela atau dari kebiasaan saja?","Bagaimana kita bisa mengajak anak memberi dengan sukacita?"],
 aksi:"Buat atau rapikan sudut doa sederhana di rumah bersama anak-anak (salib, Alkitab, lilin). Ajak anak menyisihkan sebagian kecil uang sakunya untuk kolekte atau orang yang membutuhkan."}},
27:{anak:{r:["Imam besar Harun memakai pakaian khusus. Di bahunya ada dua batu yang bertuliskan nama suku-suku Israel, dan di dadanya ada tutup dada dengan dua belas permata, satu untuk setiap suku (Keluaran 28:12, 29). Setiap kali Harun masuk ke hadirat Tuhan, ia membawa nama-nama umatnya di bahu dan di hatinya.","Bayangkan: namamu dibawa di hati seseorang setiap kali ia berdoa! Itulah yang terjadi saat orang tuamu, teman, atau Gereja mendoakanmu. Kamu juga bisa melakukannya untuk orang lain: membawa nama mereka dalam doa.","Di pasal 30 ada mezbah ukupan, tempat dupa harum dibakar setiap pagi dan petang (30:7–8). Dalam Mazmur 141:2, doa diibaratkan seperti ukupan yang naik ke hadapan Tuhan. Doa kita, sekecil apa pun, naik kepada Allah seperti asap dupa yang harum."],
 tanya:["Nama siapa saja yang ingin kamu “bawa di hati” dalam doa?","Gimana rasanya tahu ada orang yang mendoakanmu?","Kapan waktu terbaik untuk berdoa setiap hari menurutmu?"],
 aksi:"Tulis nama lima orang di selembar kertas. Selama seminggu, doakan mereka satu per satu setiap pagi atau malam."},
 ortu:{r:["Harun membawa nama-nama suku Israel di bahunya dan di dadanya, “sebagai tanda peringatan di hadapan TUHAN” (28:12, 29). Orang tua menjalankan peran imamat kecil di rumah: membawa nama setiap anak kepada Allah, di bahu (menanggung) dan di hati (mengasihi).","Mendoakan anak dengan menyebut nama mereka satu per satu, beserta pergumulan masing-masing, adalah salah satu pemberian terbesar orang tua. Banyak anak dewasa yang mengenang bahwa mereka tahu orang tuanya mendoakan mereka setiap hari, dan itu menjadi jangkar ketika mereka jauh dari rumah.","Ukupan dibakar pagi dan petang, terus-menerus (30:7–8). Kebiasaan doa keluarga tidak harus panjang, tetapi perlu tetap. Sedikit tetapi setia sering lebih berdampak daripada lama tetapi jarang."],
 tanya:["Kapan terakhir kali kita mendoakan setiap anak dengan menyebut namanya?","Pergumulan apa yang sedang dihadapi masing-masing anak saat ini?","Waktu doa tetap apa yang realistis untuk keluarga kita?"],
 aksi:"Sepakati satu waktu doa keluarga yang singkat tetapi tetap, pagi atau malam. Setiap orang tua mendoakan satu anak dengan menyebut namanya dan kebutuhannya."}},
28:{anak:{r:["Allah memenuhi Bezaleel dengan Roh-Nya, dengan keahlian, pengertian, dan kepandaian untuk membuat karya seni bagi Kemah Suci (Keluaran 31:3). Jadi bakat menggambar, membuat kerajinan, atau mendesain juga bisa jadi karunia Roh Kudus!","Tapi di pasal 32 terjadi hal yang menyedihkan. Musa lama sekali di atas gunung, dan bangsa itu tidak sabar. Mereka meminta Harun membuat allah yang kelihatan, lalu Harun membuat anak lembu emas. Waktu ditanya Musa, Harun menjawab, “Aku melemparkan emas itu ke dalam api, dan keluarlah anak lembu ini” (32:24). Alasan yang konyol sekali, kan?","Allah murka, tetapi Musa berdoa memohon ampun bagi bangsanya (32:11–14). Di pasal 33, Musa memohon: kalau Engkau tidak berjalan bersama kami, janganlah suruh kami berangkat (33:15). Musa tahu, yang paling penting bukan negeri yang dijanjikan, tetapi Allah sendiri ada bersama mereka."],
 tanya:["Bakat apa yang kamu punya yang bisa dipakai untuk Tuhan dan orang lain?","Pernah membuat alasan konyol seperti Harun waktu ketahuan salah?","Kenapa ya bangsa Israel tidak sabar menunggu Musa?"],
 aksi:"Pakai bakatmu untuk membuat sesuatu bagi orang lain minggu ini, misalnya kartu, gambar, atau masakan. Kalau berbuat salah, akui tanpa membuat alasan."},
 ortu:{r:["Bezaleel dipenuhi Roh Allah untuk keterampilan tangan (31:3–5). Gereja menghargai semua bentuk karunia, bukan hanya yang tampak “rohani”. Memperhatikan dan menghargai bakat unik setiap anak, termasuk yang tidak berhubungan dengan nilai akademis, adalah bagian dari mendidik mereka melihat karya Roh.","Anak lembu emas lahir dari ketidaksabaran: “Musa ini… kami tidak tahu apa yang terjadi dengan dia” (32:1). Harun memilih menyenangkan orang banyak, lalu membuat alasan yang hampir lucu (32:24). Sebagai pemimpin keluarga, kita juga tergoda menuruti tekanan, termasuk tekanan anak atau lingkungan, lalu mencari pembenaran.","Kontras dengan Harun, Musa berdiri di celah dan berdoa bagi bangsanya (32:11–13, 31–32). Ketika anak atau pasangan jatuh, peran kita bukan menjadi jaksa, melainkan pendoa. Dan seperti Musa, kerinduan terdalam kita semestinya bukan sekadar keluarga yang sukses, tetapi keluarga yang disertai Allah (33:15)."],
 tanya:["Bakat apa pada anak-anak yang mungkin selama ini kurang kita hargai?","Dalam hal apa kita cenderung menuruti tekanan lalu mencari pembenaran?","Saat anggota keluarga jatuh, kita lebih sering menjadi jaksa atau pendoa?"],
 aksi:"Puji secara spesifik satu bakat setiap anak minggu ini. Saat seseorang di rumah berbuat salah, doakan dia lebih dulu sebelum menegurnya."}},
29:{anak:{r:["Musa memohon kepada Allah: perlihatkanlah kiranya kemuliaan-Mu kepadaku (Keluaran 33:18). Lalu Allah lewat di depannya dan memperkenalkan diri: TUHAN, Allah penyayang dan pengasih, panjang sabar, berlimpah kasih dan setia (34:6). Inilah cara Allah ingin dikenal!","Sesudah bangsa itu berdosa dengan anak lembu emas, Allah memberi loh batu yang baru (34:1). Allah memberi kesempatan kedua. Waktu Musa turun dari gunung, kulit wajahnya bercahaya karena ia telah berbicara dengan Tuhan, dan ia sendiri tidak tahu (34:29).","Di pasal 35–36, bangsa itu membawa persembahan untuk Kemah Suci dengan sukarela. Saking banyaknya, Musa sampai harus menyuruh mereka berhenti memberi (36:6–7)! Bangsa yang tadinya memberikan emas untuk berhala, sekarang memberi dengan murah hati untuk Tuhan."],
 tanya:["Dari sifat-sifat Allah di 34:6, mana yang paling kamu butuhkan sekarang?","Pernah dapat kesempatan kedua setelah berbuat salah? Gimana rasanya?","Menurutmu, bagaimana wajah orang yang sering “berbicara dengan Tuhan”?"],
 aksi:"Hafalkan Keluaran 34:6 minggu ini. Beri kesempatan kedua kepada seseorang yang pernah mengecewakanmu."},
 ortu:{r:["Keluaran 34:6–7 adalah “pengakuan iman” tentang siapa Allah, yang kemudian dikutip berulang kali dalam Kitab Suci. Allah memperkenalkan diri pertama-tama sebagai penyayang, pengasih, dan panjang sabar. Gambaran tentang Allah yang dimiliki anak-anak sering terbentuk dari gambaran orang tua yang mereka alami.","Loh batu baru diberikan setelah loh pertama dipecahkan (34:1). Dalam pernikahan dan pengasuhan, ada banyak “loh batu yang pecah”: janji yang dilanggar, kepercayaan yang retak. Allah memberi contoh bahwa perjanjian bisa diperbarui, bukan dengan menganggap dosa tidak penting, tetapi dengan pengampunan dan awal yang baru.","Wajah Musa bercahaya setelah berbicara dengan Tuhan (34:29), dan ia sendiri tidak menyadarinya. Orang yang sungguh-sungguh berdoa tidak perlu memamerkan kesalehannya; buahnya terlihat dengan sendirinya dalam kesabaran, kelembutan, dan damai yang dirasakan orang-orang di sekitarnya."],
 tanya:["Gambaran Allah seperti apa yang mungkin dibentuk anak-anak dari cara kita mendidik?","“Loh batu” apa dalam relasi kita yang perlu diperbarui?","Apa buah doa yang ingin dirasakan anak-anak dari kita?"],
 aksi:"Bacakan Keluaran 34:6 bersama keluarga dan diskusikan bagaimana sifat-sifat itu bisa tampak di rumah. Pasangan: perbarui satu janji yang pernah terlupakan."}},
30:{anak:{r:["Pasal 37–39 berisi laporan pembuatan Kemah Suci dan semua perlengkapannya. Kedengarannya membosankan, tapi lihat kalimat yang berulang terus: “seperti yang diperintahkan TUHAN kepada Musa” (misalnya 39:1, 5, 7). Mereka mengerjakan semuanya dengan teliti.","Ada detail kecil yang menarik: bak tembaga dibuat dari cermin-cermin para perempuan yang melayani di pintu Kemah Pertemuan (38:8). Barang pribadi yang biasa dipakai untuk berdandan diserahkan untuk Tuhan.","Setelah selesai, Musa memeriksa semua pekerjaan itu. Semuanya sesuai perintah, lalu Musa memberkati mereka (39:43). Pekerjaan yang dikerjakan dengan setia dan teliti layak dihargai, sekecil apa pun peranmu."],
 tanya:["Tugas apa yang biasanya kamu kerjakan asal-asalan? Kenapa?","Barang apa milikmu yang berharga yang rela kamu berikan untuk orang lain atau Tuhan?","Gimana rasanya kalau pekerjaanmu dihargai?"],
 aksi:"Kerjakan satu tugas rumah atau PR dengan teliti sampai tuntas tanpa disuruh dua kali."},
 ortu:{r:["Pasal-pasal yang sering dilewati ini menunjukkan ketelitian dan ketaatan: berulang kali dicatat semuanya dikerjakan “seperti yang diperintahkan TUHAN” (39:42). Iman juga tampak dalam pekerjaan yang dilakukan dengan baik, termasuk pekerjaan rumah tangga dan pekerjaan kantor yang tidak dilihat siapa pun.","Cermin para perempuan menjadi bak pembasuhan (38:8). Persembahan yang paling bermakna kadang bukan sisa, tetapi sesuatu yang dekat dengan diri kita: waktu luang, hobi, kenyamanan pribadi. Orang tua tahu betul pengorbanan semacam ini.","Musa memeriksa, lalu memberkati para pekerja (39:43). Apresiasi adalah bagian dari kepemimpinan. Anak-anak dan pasangan lebih bersemangat ketika usaha mereka dilihat dan dihargai, bukan hanya ketika hasilnya sempurna."],
 tanya:["Pekerjaan sehari-hari apa yang bisa kita persembahkan kepada Tuhan dengan lebih sungguh?","Pengorbanan apa yang selama ini kita berikan untuk keluarga, dan apakah kita memberikannya dengan sukacita?","Kapan terakhir kali kita memberkati atau menghargai usaha anak, bukan hasilnya?"],
 aksi:"Minggu ini, ucapkan apresiasi spesifik atas usaha (bukan hasil) setiap anggota keluarga. Coba tutup hari dengan memberkati anak-anak sebelum tidur."}},
31:{anak:{r:["Akhirnya Kemah Suci selesai didirikan, tepat pada hari pertama bulan pertama tahun kedua sejak keluar dari Mesir (Keluaran 40:17). Lalu awan menutupi Kemah Pertemuan dan kemuliaan Tuhan memenuhinya (40:34). Allah sungguh hadir di tengah umat-Nya!","Ingat awal Kitab Keluaran? Bangsa Israel jadi budak, membangun kota untuk Firaun. Di akhir kitab, mereka membangun tempat tinggal untuk Allah. Dari melayani Firaun menjadi melayani Allah. Itulah kisah Keluaran!","Setiap kali awan naik dari atas Kemah Suci, mereka berangkat; kalau awan tidak naik, mereka tetap tinggal (40:36–37). Mereka belajar mengikuti tuntunan Tuhan, langkah demi langkah. Kita juga bisa belajar bertanya: Tuhan, ke mana aku harus melangkah?"],
 tanya:["Apa bagian Kitab Keluaran yang paling kamu ingat? Kenapa?","Apa bedanya melayani “Firaun” dengan melayani Allah dalam hidupmu?","Bagaimana kamu bisa tahu tuntunan Tuhan dalam hidupmu?"],
 aksi:"Ceritakan ulang kisah Keluaran dengan kata-katamu sendiri kepada keluarga dalam lima menit. Mulai minggu ini, tanyakan kepada Tuhan dalam doa sebelum mengambil keputusan penting."},
 ortu:{r:["Keluaran dimulai dengan Israel membangun kota perbekalan bagi Firaun (1:11) dan diakhiri dengan Israel membangun tempat kediaman bagi Allah (40:34). Kerja yang sama, membangun, tetapi untuk tuan yang berbeda. Pertanyaan bagi keluarga kita: untuk siapa sebenarnya kita bekerja keras selama ini?","Kemuliaan Tuhan memenuhi Kemah Suci (40:34). Allah yang membebaskan adalah Allah yang ingin tinggal bersama. Iman keluarga bukan hanya soal diselamatkan dari masalah, tetapi soal hidup sehari-hari bersama Allah yang hadir.","Israel bergerak hanya ketika awan bergerak (40:36–37). Banyak keluarga bergerak karena desakan: ikut tren, takut tertinggal, tekanan sosial. Menimbang keputusan besar, pindah, pekerjaan, sekolah anak, dalam doa bersama adalah cara mengikuti “awan” Tuhan."],
 tanya:["Untuk “tuan” siapa keluarga kita paling banyak bekerja keras saat ini?","Di mana kita mengalami kehadiran Allah dalam keseharian keluarga?","Keputusan apa yang sedang kita hadapi yang perlu lebih banyak didoakan bersama?"],
 aksi:"Rayakan selesainya Kitab Keluaran bersama keluarga. Tulis satu keputusan keluarga yang sedang menunggu, lalu doakan bersama selama seminggu sebelum memutuskan."}},
32:{anak:{r:["Kitab Imamat dimulai dengan aturan korban: korban bakaran, korban sajian, korban keselamatan. Mungkin terasa asing, karena kita tidak lagi mempersembahkan binatang. Tapi intinya sama: membawa yang terbaik kepada Tuhan sebagai tanda syukur dan penyerahan diri.","Ada detail kecil: setiap korban sajian harus dibubuhi garam (Imamat 2:13). Garam membuat makanan awet dan enak. Yesus juga berkata kita adalah garam dunia (Matius 5:13). Hidup kita bisa membuat dunia di sekitar kita lebih “enak” dan lebih baik.","Ada juga yang menarik: orang miskin boleh mempersembahkan burung tekukur atau merpati, bukan lembu (1:14). Allah tidak menuntut semua orang memberi hal yang sama. Yang Ia lihat adalah hati yang mau memberi dari apa yang dimiliki."],
 tanya:["Apa “yang terbaik” yang bisa kamu persembahkan kepada Tuhan hari ini?","Bagaimana caranya hidupmu bisa menjadi “garam” bagi teman-teman?","Kenapa ya Allah membolehkan orang miskin memberi burung saja?"],
 aksi:"Berikan waktu terbaikmu hari ini untuk Tuhan: matikan gawai dan berdoa atau membaca Kitab Suci selama 10 menit dengan sungguh-sungguh."},
 ortu:{r:["Imamat dibuka dengan aturan korban yang rinci. Catatan Gereja menjelaskan bahwa aturan-aturan ini bukan sekadar undang-undang, tetapi membentuk cara hidup: seluruh hidup diarahkan kepada Allah. Bagi kita, persembahan itu menemukan kepenuhannya dalam kurban Kristus yang kita rayakan dalam Ekaristi.","Korban bakaran dibakar seluruhnya (1:9). Tidak ada yang disisakan untuk diri sendiri. Ini gambaran penyerahan total. Pertanyaan bagi orang tua: bagian hidup mana yang masih kita sisihkan untuk diri sendiri, tidak kita serahkan kepada Allah?","Persembahan disesuaikan dengan kemampuan; orang yang tidak mampu boleh membawa burung (1:14). Allah tidak membandingkan. Di rumah, ini mengingatkan kita untuk tidak membandingkan anak satu dengan yang lain, atau keluarga kita dengan keluarga lain, tetapi menghargai pemberian setiap orang sesuai kemampuannya."],
 tanya:["Bagian hidup mana yang masih sulit kita serahkan sepenuhnya kepada Allah?","Apakah kita cenderung membandingkan anak-anak satu sama lain?","Bagaimana Ekaristi bisa menjadi pusat “persembahan” keluarga kita?"],
 aksi:"Pada Misa berikutnya, saat persembahan, ajak setiap anggota keluarga dalam hati mempersembahkan satu hal dari minggu itu kepada Tuhan, lalu ceritakan sesudahnya."}},
33:{anak:{r:["Imamat 4–5 membahas korban untuk dosa, termasuk dosa yang tidak disengaja. Ternyata kita bisa berbuat salah tanpa sadar, misalnya menyakiti perasaan teman tanpa bermaksud. Allah menyediakan jalan untuk memperbaikinya.","Ada satu langkah penting: orang itu harus mengakui dosanya (5:5). Mengaku salah itu langkah pertama untuk dipulihkan. Dalam Gereja, kita punya Sakramen Tobat, tempat kita mengakui dosa dan menerima pengampunan.","Lalu ada aturan ganti rugi: kalau seseorang merugikan sesamanya, ia harus mengembalikan semuanya ditambah seperlima (6:5). Minta maaf saja belum cukup; kalau bisa, perbaiki juga kerugiannya. Kalau merusak barang teman, ganti; kalau mengambil, kembalikan."],
 tanya:["Pernah menyakiti seseorang tanpa sengaja? Apa yang kamu lakukan sesudahnya?","Kenapa mengaku salah itu sulit?","Apa contoh “ganti rugi” yang bisa kamu lakukan kalau berbuat salah kepada teman atau saudara?"],
 aksi:"Pikirkan satu kesalahan yang belum kamu perbaiki. Minta maaf dan lakukan sesuatu untuk memperbaikinya minggu ini."},
 ortu:{r:["Imamat membedakan dosa yang tidak disengaja, tetapi tetap menyediakan jalan pemulihannya (pasal 4). Ini mengajarkan bahwa dampak kesalahan tetap nyata walaupun niat kita baik. Dalam keluarga, “aku kan tidak bermaksud begitu” sering menjadi tameng untuk tidak bertanggung jawab atas luka yang kita timbulkan.","Pengakuan dosa disebut dengan jelas (5:5). Pengakuan adalah bagian dari pemulihan, baik di hadapan Allah maupun di hadapan sesama. Anak-anak yang melihat orang tuanya pergi ke Sakramen Tobat, dan juga mendengar orang tuanya meminta maaf di rumah, belajar bahwa mengaku salah bukan aib.","Ganti rugi ditambah seperlima (6:5) menunjukkan bahwa pertobatan menyangkut tindakan nyata. Memulihkan kepercayaan pasangan atau anak sering membutuhkan lebih dari kata maaf: perubahan perilaku yang konsisten dan usaha ekstra untuk memperbaiki."],
 tanya:["Dalam hal apa kita sering memakai alasan “aku tidak bermaksud begitu”?","Kapan terakhir kali keluarga kita menerima Sakramen Tobat?","Kepercayaan siapa di rumah yang perlu kita pulihkan dengan tindakan nyata?"],
 aksi:"Rencanakan waktu untuk menerima Sakramen Tobat bersama sebagai keluarga. Pilih satu luka kecil di rumah dan perbaiki dengan tindakan nyata, bukan hanya kata-kata."}},
34:{anak:{r:["Di Imamat 6:13 ada perintah: api di atas mezbah harus tetap menyala, jangan dibiarkan padam. Para imam harus menjaganya setiap hari. Api itu seperti iman: perlu dijaga setiap hari supaya tidak padam.","Di pasal 8–9, Harun dan anak-anaknya ditahbiskan menjadi imam. Waktu mereka mempersembahkan korban pertama, api keluar dari hadapan Tuhan dan seluruh bangsa bersorak dan sujud (9:24). Hari yang luar biasa!","Tapi tidak lama kemudian, dua anak Harun, Nadab dan Abihu, mempersembahkan api asing yang tidak diperintahkan Tuhan, dan mereka mati (10:1–2). Kisah ini mengajarkan bahwa Allah itu kudus, dan kita perlu menghormati-Nya dengan sungguh-sungguh, bukan sembarangan atau seenaknya."],
 tanya:["Apa yang bisa membuat “api” imanmu tetap menyala setiap hari?","Bagaimana sikapmu di gereja: sungguh-sungguh atau asal-asalan?","Apa artinya menghormati Allah yang kudus?"],
 aksi:"Pilih satu kebiasaan kecil untuk menjaga iman setiap hari minggu ini, misalnya doa pagi singkat. Saat Misa, ikuti dengan sungguh-sungguh tanpa main gawai."},
 ortu:{r:["“Api harus dijaga tetap menyala di atas mezbah, janganlah dibiarkan padam” (6:13). Api tidak padam karena satu badai, tetapi karena tidak diberi kayu setiap hari. Iman keluarga dan cinta dalam pernikahan juga jarang padam dalam semalam; biasanya meredup pelan-pelan karena tidak dirawat.","Peristiwa Nadab dan Abihu (10:1–2) mengejutkan dan sulit. Yang jelas dari teks, mereka mempersembahkan sesuatu yang tidak diperintahkan. Pelajarannya bagi kita: mendekati Allah dengan hormat, tidak menjadikan ibadah sekadar rutinitas, tontonan, atau ajang kesombongan.","Setelah kehilangan dua anaknya, “Harun berdiam diri” (10:3). Ada saat-saat duka yang tidak bisa dijelaskan. Keluarga yang beriman tidak selalu punya jawaban, tetapi tetap tinggal di hadapan Allah, bahkan dalam keheningan."],
 tanya:["“Kayu bakar” apa yang setiap hari kita berikan untuk menjaga iman dan cinta di rumah?","Apakah ibadah keluarga kita mulai menjadi rutinitas tanpa hati?","Bagaimana kita menghadapi duka atau peristiwa yang tidak bisa kita mengerti?"],
 aksi:"Jadwalkan satu waktu khusus berdua bersama pasangan minggu ini untuk “menambah kayu” pada relasi kalian: berbincang, berdoa, atau sekadar berjalan berdua."}},
35:{anak:{r:["Imamat 11 berisi daftar binatang yang boleh dan tidak boleh dimakan oleh orang Israel. Di tengah daftar itu ada kalimat penting: kuduslah kamu, sebab Aku kudus (11:44). Kudus artinya “dikhususkan” untuk Allah, berbeda dari yang lain.","Sebagai orang Katolik, kita tidak terikat aturan makanan ini. Yesus menyatakan semua makanan halal (Markus 7:19). Tapi panggilan untuk hidup kudus tetap berlaku: cara kita berbicara, memperlakukan orang lain, dan memakai waktu bisa berbeda dari kebiasaan buruk di sekitar kita.","Pasal 12 berbicara tentang ibu yang baru melahirkan. Ada korban yang lebih murah bagi keluarga miskin: dua ekor burung (12:8). Tahukah kamu? Itulah persembahan yang dibawa Maria dan Yusuf waktu mempersembahkan bayi Yesus di Bait Allah (Lukas 2:24). Keluarga Yesus adalah keluarga sederhana."],
 tanya:["Apa artinya hidup “kudus” untuk anak seusiamu?","Dalam hal apa kamu bisa berbeda dari teman-teman untuk hal yang baik?","Bagaimana perasaanmu tahu keluarga Yesus dulu sederhana?"],
 aksi:"Pilih satu cara hidup “berbeda” minggu ini, misalnya tidak ikut berkata kasar walaupun teman-teman melakukannya."},
 ortu:{r:["“Kuduslah kamu, sebab Aku kudus” (11:44–45) adalah gagasan pokok Kitab Imamat menurut pengantar dari Gereja. Kekudusan bukan sekadar soal ritual, tetapi seluruh cara hidup yang ditandai oleh hubungan dengan Allah. Aturan makanan yang rinci itu membuat Israel mengingat identitasnya setiap kali makan.","Kita tidak lagi terikat aturan makanan Imamat (bdk. Markus 7:19), tetapi prinsipnya bisa kita renungkan: kebiasaan sehari-hari yang kecil, apa yang kita tonton, bagaimana kita makan bersama, bagaimana kita berbicara di meja makan, membentuk identitas keluarga.","Imamat 12:8 memberi keringanan bagi keluarga miskin, dan Lukas 2:24 mencatat bahwa Maria dan Yusuf membawa dua burung. Keluarga Kudus Nazaret hidup dalam kesederhanaan. Ini menghibur sekaligus menantang kita yang sering mengukur keberhasilan keluarga dari harta."],
 tanya:["Kebiasaan sehari-hari apa yang membentuk identitas iman keluarga kita?","Apa yang kita tonton atau dengar bersama yang mungkin perlu ditinjau ulang?","Apa yang bisa kita teladani dari kesederhanaan Keluarga Kudus?"],
 aksi:"Jadikan satu waktu makan minggu ini tanpa gawai dan buka dengan doa yang dipimpin bergantian oleh anak-anak."}},
36:{anak:{r:["Imamat 13–14 membahas penyakit kulit yang dalam terjemahan disebut kusta. Orang yang sakit harus tinggal di luar perkemahan dan berseru “Najis! Najis!” supaya orang lain menjauh (13:45–46). Bayangkan betapa kesepiannya mereka.","Tapi ada juga upacara untuk orang yang sudah sembuh: imam keluar menemui mereka di luar perkemahan dan menyatakan mereka tahir (14:3). Mereka boleh pulang dan berkumpul lagi dengan keluarga!","Di Injil, Yesus menyentuh orang kusta dan menyembuhkannya, lalu menyuruhnya menunjukkan diri kepada imam sesuai hukum Musa (Markus 1:41–44). Yesus tidak menjauhi orang yang dijauhi semua orang. Di sekolahmu mungkin ada teman yang “dijauhi” karena beda atau dianggap aneh."],
 tanya:["Bagaimana rasanya dijauhi atau tidak diajak teman-teman?","Siapa di sekitarmu yang sering dijauhi? Kenapa?","Apa yang bisa kamu lakukan seperti Yesus untuk teman seperti itu?"],
 aksi:"Ajak satu teman yang sering sendirian untuk bermain, makan bersama, atau mengerjakan tugas bersama minggu ini."},
 ortu:{r:["Aturan tentang penyakit kulit (13:45–46) melindungi kesehatan umat, tetapi juga membuat penderitanya terasing. Imamat 14 memberi jalan pulang: imam keluar ke luar perkemahan untuk memeriksa dan menyatakan tahir (14:3). Pemulihan selalu berarti kembali ke komunitas.","Yesus melampaui batas ini dengan menyentuh orang kusta (Markus 1:41). Dalam masyarakat kita, ada banyak “orang di luar perkemahan”: penderita penyakit tertentu, orang dengan gangguan jiwa, keluarga yang tertimpa aib. Anak-anak belajar memperlakukan mereka dari cara kita membicarakan dan memperlakukan mereka.","Dalam keluarga pun, seseorang bisa merasa “di luar perkemahan”: anak yang selalu dianggap bermasalah, anggota keluarga besar yang dikucilkan. Rumah yang beriman adalah rumah yang membuka jalan pulang."],
 tanya:["Siapa “orang di luar perkemahan” di lingkungan kita?","Bagaimana anak-anak mendengar kita membicarakan orang yang sakit atau tertimpa aib?","Adakah anggota keluarga yang merasa dikucilkan dan perlu dibukakan jalan pulang?"],
 aksi:"Kunjungi atau hubungi seseorang yang sakit atau terasing minggu ini, sebaiknya bersama anak-anak."}},
37:{anak:{r:["Imamat 16 bercerita tentang Hari Pendamaian, hari paling kudus dalam setahun. Hanya pada hari itu imam besar boleh masuk ke tempat maha kudus, tempat tabut perjanjian berada, untuk mengadakan pendamaian bagi seluruh bangsa.","Ada dua ekor kambing. Satu dipersembahkan, dan yang lain dilepas ke padang gurun setelah imam menumpangkan tangannya dan mengakui semua kesalahan bangsa di atas kepalanya (16:21–22). Kambing itu seolah membawa pergi semua dosa jauh-jauh.","Bagi kita, Yesus adalah “Anak domba Allah yang menghapus dosa dunia” (Yohanes 1:29). Di Imamat 17:11 dikatakan bahwa nyawa ada di dalam darah. Yesus memberikan nyawa-Nya untuk kita. Dosa yang sudah diampuni dibawa pergi jauh, tidak perlu kamu pikul terus-menerus."],
 tanya:["Pernah merasa terus terbebani oleh kesalahan yang sudah lalu?","Apa artinya bagimu bahwa dosamu “dibawa pergi jauh”?","Kenapa Yesus disebut Anak Domba Allah?"],
 aksi:"Tulis di kertas satu kesalahan yang sering bikin kamu merasa bersalah. Bawa dalam doa, serahkan kepada Yesus, lalu robek kertasnya sebagai tanda kamu percaya pengampunan-Nya."},
 ortu:{r:["Hari Pendamaian (pasal 16) adalah puncak sistem ibadah Israel. Kata Ibrani kipper berarti membersihkan dosa dan kenajisan. Kambing yang dilepas ke padang gurun membawa pergi kesalahan umat (16:22). Gereja menghubungkan ayat ini dengan Kristus yang menanggung dosa kita (Yesaya 53:11–12; 1 Petrus 2:24).","Banyak orang tua hidup dengan beban rasa bersalah: kesalahan dalam mendidik anak, kata-kata yang terlanjur keluar, masa lalu sebelum menikah. Pendamaian berarti dosa yang sudah diakui dan diampuni dibawa pergi, tidak perlu terus dipikul.","Pasal 18 berbicara tentang kekudusan relasi dalam keluarga dan seksualitas. Gereja mengajarkan bahwa tubuh dan relasi kita berharga di mata Allah. Orang tua punya peran penting mendampingi anak memahami dan menghargai tubuh serta relasi dengan cara yang sesuai usia mereka, sebelum mereka belajar dari sumber yang keliru."],
 tanya:["Rasa bersalah apa yang masih kita pikul padahal sudah kita bawa kepada Allah?","Bagaimana kita menunjukkan kepada pasangan bahwa kesalahan yang sudah dimaafkan benar-benar sudah dilepaskan?","Apakah kita sudah mulai membicarakan nilai tubuh dan relasi kepada anak sesuai usianya?"],
 aksi:"Bawa satu beban rasa bersalah ke Sakramen Tobat atau ke dalam doa, lalu sungguh lepaskan. Cari satu sumber Katolik yang baik untuk mulai berbicara dengan anak tentang tubuh dan relasi sesuai usianya."}},
38:{anak:{r:["Imamat 19 adalah pasal tentang hidup kudus sehari-hari. Ayat-ayatnya praktis sekali: hormati ibu dan bapamu (19:3), jangan mencuri, jangan berbohong (19:11), jangan mengutuki orang tuli atau menaruh batu sandungan di depan orang buta (19:14).","Ada juga perintah untuk tidak memanen sampai ke tepi ladang, supaya orang miskin dan orang asing bisa ikut memungut (19:9–10). Allah ingin umat-Nya peduli kepada yang kekurangan.","Dan yang paling terkenal: kasihilah sesamamu manusia seperti dirimu sendiri (19:18). Yesus menyebut ini hukum terutama yang kedua. Bahkan orang asing pun harus dikasihi seperti diri sendiri (19:34). Ada juga perintah berdiri menghormati orang tua yang beruban (19:32)."],
 tanya:["Dari Imamat 19, perintah mana yang paling sulit buatmu?","Apa contoh “menaruh batu sandungan” bagi teman di zaman sekarang?","Bagaimana cara menunjukkan hormat kepada kakek-nenek atau orang yang lebih tua?"],
 aksi:"Lakukan satu kebaikan untuk orang yang lebih tua minggu ini, misalnya memberi tempat duduk, membantu membawa barang, atau menelepon kakek-nenek."},
 ortu:{r:["Imamat 19 menghubungkan kekudusan dengan kehidupan sehari-hari: menghormati orang tua (19:3), membayar upah tepat waktu (19:13), bersikap adil di pengadilan (19:15), dan tidak menyebar fitnah (19:16). Kekudusan ternyata bukan hanya di tempat ibadah, tetapi di dapur, kantor, dan pasar.","Perintah menyisakan panen untuk orang miskin (19:9–10) adalah bentuk jaring pengaman sosial kuno. Keluarga kita bisa bertanya: apakah kita “memanen sampai ke tepi”, memaksimalkan semua untuk diri sendiri, atau menyisakan ruang untuk orang lain?","Yesus mengangkat 19:18 sebagai hukum utama kedua. Kasih kepada sesama pertama kali diuji di rumah sendiri: kepada pasangan yang menyebalkan hari ini, anak yang sulit, atau mertua yang berbeda pendapat. Pasal ini juga meminta kita mengasihi orang asing seperti diri sendiri (19:34)."],
 tanya:["Dalam hal apa kekudusan kita diuji di tempat kerja atau dalam urusan uang?","Apa yang bisa keluarga kita “sisakan” untuk orang lain?","Siapa “sesama” di rumah yang paling sulit kita kasihi minggu ini?"],
 aksi:"Pilih satu orang yang sulit dikasihi minggu ini, lalu lakukan satu tindakan kasih yang nyata kepadanya. Ajak anak menyisihkan sebagian makanan atau barang untuk dibagikan."}},
39:{anak:{r:["Imamat 23 berisi daftar hari raya Israel: Sabat setiap minggu, Paskah, Pentakosta, Hari Pendamaian, dan hari raya Pondok Daun. Allah ingin umat-Nya punya waktu khusus untuk beristirahat, bersyukur, dan merayakan bersama.","Kita juga punya kalender liturgi: Adven, Natal, Prapaskah, Paskah, Pentakosta. Setiap masa punya warna dan maknanya sendiri. Hari Minggu adalah “Sabat” kita, hari kebangkitan Yesus.","Di pasal 24 ada perintah supaya lampu di Kemah Suci terus menyala dan roti sajian diletakkan setiap Sabat (24:2–8). Ada hal-hal yang perlu dilakukan dengan setia, terus-menerus, bukan cuma sekali-sekali."],
 tanya:["Hari raya Gereja mana yang paling kamu suka? Kenapa?","Apa bedanya hari Minggu dengan hari-hari lain di keluargamu?","Bagaimana caranya supaya hari Minggu terasa istimewa?"],
 aksi:"Bersama keluarga, rencanakan sesuatu yang istimewa untuk hari Minggu ini selain ke gereja, misalnya makan bersama atau jalan-jalan."},
 ortu:{r:["Imamat 23 menata waktu Israel di sekitar Allah: setiap minggu ada Sabat, setiap tahun ada hari-hari raya. Waktu bukan hanya untuk bekerja dan berprestasi; ada ritme kerja dan istirahat, biasa dan perayaan.","Bagi banyak keluarga modern, hari Minggu menjadi hari mengejar ketertinggalan: lembur, les, belanja. Gereja mengajak kita menguduskan hari Tuhan sebagai hari ibadah, istirahat, dan kebersamaan keluarga. Ini bukan beban, tetapi hadiah.","Kalender liturgi Gereja juga bisa menjadi alat mendidik iman. Adven, Prapaskah, dan Paskah memberi kesempatan untuk tradisi keluarga: korona Adven, puasa bersama, menghias telur Paskah. Tradisi seperti itu membuat iman terasa hidup bagi anak-anak."],
 tanya:["Seperti apa biasanya hari Minggu keluarga kita?","Apa yang perlu kita kurangi supaya hari Minggu menjadi hari istirahat dan kebersamaan?","Tradisi liturgi apa yang bisa kita mulai di rumah?"],
 aksi:"Tetapkan satu “aturan Minggu” keluarga, misalnya makan bersama tanpa gawai setelah Misa. Pilih satu tradisi untuk masa liturgi berikutnya."}},
40:{anak:{r:["Imamat 25 berbicara tentang tahun Yobel. Setiap lima puluh tahun, tanah yang dijual kembali kepada pemilik aslinya, dan orang yang menjual dirinya menjadi budak dibebaskan. “Maklumkanlah pembebasan” (25:10)! Itu seperti tombol “mulai lagi” bagi keluarga yang jatuh miskin.","Kenapa begitu? Karena Allah berkata: tanah itu milik-Ku, kamu hanyalah pendatang dan penumpang bagi-Ku (25:23). Semua yang kita punya sebenarnya titipan Allah, termasuk mainan, gawai, dan kamarmu.","Di pasal 26 Allah berjanji: Aku akan hadir di tengah-tengahmu, Aku akan menjadi Allahmu dan kamu akan menjadi umat-Ku (26:12). Kitab Imamat ditutup dengan janji yang indah: Allah ingin tinggal bersama kita."],
 tanya:["Kalau semua yang kamu punya adalah titipan Allah, bagaimana seharusnya kamu menjaganya?","Siapa yang butuh “mulai lagi” di sekitarmu, dan bagaimana kamu bisa membantu?","Apa artinya Allah “hadir di tengah-tengah” keluargamu?"],
 aksi:"Rapikan dan rawat barang-barangmu minggu ini sebagai tanda syukur. Pilih satu barang yang masih bagus tapi jarang kamu pakai untuk diberikan kepada yang membutuhkan."},
 ortu:{r:["Tahun Yobel (25:8–17) adalah gagasan yang sangat radikal: setiap lima puluh tahun, tanah kembali dan orang yang terjerat utang dibebaskan. Allah tidak ingin kemiskinan menjadi warisan turun-temurun. Yesus memulai karya-Nya dengan mengutip Yesaya yang memaklumkan “tahun rahmat Tuhan” (Lukas 4:19).","Dasar Yobel adalah 25:23: tanah itu milik Tuhan, kita hanya pendatang. Cara pandang ini mengubah cara kita memandang harta, rumah, dan bahkan anak-anak: semuanya titipan, bukan milik mutlak. Sebagai penatalayan, kita akan diminta mempertanggungjawabkannya.","Imamat 25:35 meminta umat menolong saudara yang jatuh miskin. Keluarga besar kita mungkin punya saudara yang sedang terjerat utang atau kesulitan. Pertolongan yang bijak, tanpa merendahkan, bisa menjadi “Yobel” kecil bagi mereka."],
 tanya:["Apakah kita memandang harta dan anak-anak sebagai milik atau titipan?","Siapa di keluarga besar atau lingkungan kita yang butuh “Yobel”, kesempatan untuk mulai lagi?","Bagaimana kita mengajari anak-anak sikap penatalayan atas barang-barang mereka?"],
 aksi:"Diskusikan sebagai pasangan satu cara konkret membantu seseorang yang sedang kesulitan keuangan, dengan bijak dan tanpa merendahkan. Rayakan selesainya Kitab Imamat bersama anak-anak."}},
41:{anak:{r:["Kitab Bilangan dimulai dengan sensus: semua laki-laki Israel yang berumur dua puluh tahun ke atas dihitung, suku demi suku (Bilangan 1:2–3). Setiap orang tercatat. Tidak ada yang dianggap tidak penting.","Lalu perkemahan diatur: setiap suku berkemah di bawah panjinya masing-masing, mengelilingi Kemah Pertemuan (2:2). Bayangkan dari atas: ribuan tenda tersusun rapi, dan di tengah-tengahnya ada tempat Allah hadir. Allah menjadi pusat kehidupan mereka.","Orang Lewi tidak dihitung bersama yang lain karena mereka punya tugas khusus: mengurus Kemah Suci (1:49–50). Setiap suku punya tempat, dan setiap orang punya peran. Di keluarga dan di kelasmu juga begitu: kamu punya tempat dan peran yang penting."],
 tanya:["Kalau keluargamu adalah sebuah perkemahan, apa yang ada di tengah-tengahnya?","Apa peranmu di keluarga yang tidak bisa digantikan orang lain?","Gimana rasanya tahu bahwa Allah mengenal setiap orang satu per satu?"],
 aksi:"Tanyakan kepada orang tuamu: “Apa yang bisa aku bantu supaya keluarga kita lebih teratur?” Lalu kerjakan."},
 ortu:{r:["Bilangan dibuka dengan penghitungan nama demi nama, suku demi suku (1:2). Allah tidak memandang umat-Nya sebagai massa tanpa wajah. Dalam kesibukan, anak-anak bisa menjadi “jumlah” yang harus diurus: diantar, diberi makan, dicek PR-nya. Ayat ini mengingatkan setiap anak adalah pribadi dengan nama, cerita, dan kebutuhan sendiri.","Susunan perkemahan menempatkan Kemah Pertemuan di tengah (2:2, 17). Bentuk perkemahan itu sendiri adalah pernyataan iman: Allah di pusat. Jika keluarga kita digambar dari atas, apa yang sebenarnya ada di tengah: pekerjaan, sekolah, gawai, atau Allah?","Orang Lewi diberi tugas khusus mengurus Kemah Suci (1:50; 3:6–8). Dalam keluarga, peran yang berbeda, mencari nafkah, mengurus rumah, mendampingi belajar, semuanya bernilai di mata Allah. Tidak ada peran yang lebih rendah bila dijalankan dengan setia."],
 tanya:["Kapan terakhir kali kita memperhatikan setiap anak secara pribadi, satu per satu?","Jika keluarga kita digambar dari atas, apa yang ada di tengah?","Peran siapa di rumah yang selama ini kurang dihargai?"],
 aksi:"Minggu ini, luangkan waktu berdua saja dengan setiap anak secara bergantian, walau hanya 15 menit. Hargai peran pasangan dengan ucapan terima kasih yang spesifik."}},
42:{anak:{r:["Bilangan 6 berbicara tentang orang nazir, yaitu orang yang bernazar mengkhususkan diri bagi Tuhan untuk waktu tertentu. Mereka tidak minum anggur dan tidak mencukur rambut (6:3–5). Contoh terkenal di kemudian hari adalah Simson.","Lalu ada berkat yang sangat indah, yang diberikan Tuhan kepada Harun untuk memberkati umat: TUHAN memberkati engkau dan melindungi engkau; TUHAN menyinari engkau dengan wajah-Nya dan memberi engkau kasih karunia; TUHAN menghadapkan wajah-Nya kepadamu dan memberi engkau damai sejahtera (6:24–26).","Berkat ini sampai sekarang masih dipakai dalam ibadah. Bayangkan Allah “menghadapkan wajah-Nya” kepadamu, seperti orang tua yang tersenyum menatap anaknya. Itulah cara Allah memandangmu."],
 tanya:["Apa artinya Allah “menghadapkan wajah-Nya” kepadamu?","Pernah dengar berkat ini diucapkan di gereja?","Hal apa yang bisa kamu “khususkan” untuk Tuhan, seperti orang nazir?"],
 aksi:"Hafalkan Bilangan 6:24–26. Ucapkan berkat itu untuk saudaramu atau orang tuamu sebelum tidur."},
 ortu:{r:["Berkat imam di Bilangan 6:24–26 diberikan Allah sendiri, dan diakhiri dengan janji: “Aku akan memberkati mereka” (6:27). Berkat bukan sekadar harapan baik, tetapi penempatan nama Allah atas umat-Nya.","Dalam tradisi Yahudi dan Kristen, orang tua sering memberkati anak-anaknya dengan kata-kata ini. Anak yang diberkati orang tuanya setiap malam membawa ingatan bahwa ia dipandang dengan kasih, oleh orang tuanya dan oleh Allah.","Nazar orang nazir (pasal 6) juga mengingatkan bahwa ada saat-saat untuk mengkhususkan diri: puasa, retret, atau melepaskan sesuatu demi Tuhan. Masa Prapaskah adalah kesempatan bagi keluarga untuk berlatih ini bersama."],
 tanya:["Apakah anak-anak pernah mendengar kita memberkati mereka dengan kata-kata?","Apa yang menghalangi kita melakukannya?","Hal apa yang bisa kita “khususkan” untuk Tuhan sebagai keluarga?"],
 aksi:"Mulai malam ini, berkati setiap anak dengan Bilangan 6:24–26 sambil membuat tanda salib di dahi mereka. Lakukan setiap malam selama seminggu."}},
43:{anak:{r:["Bilangan 7 adalah salah satu pasal terpanjang di Alkitab. Isinya? Dua belas pemimpin suku membawa persembahan untuk mezbah, satu suku setiap hari selama dua belas hari, dan persembahan mereka persis sama (7:12–83)! Setiap persembahan dicatat satu per satu.","Kenapa ditulis berulang-ulang? Mungkin karena Allah menghargai setiap persembahan, bahkan kalau sama dengan yang lain. Pemberianmu tidak kalah penting dibanding pemberian orang lain.","Di pasal 9 ada cerita indah: orang-orang yang tidak bisa merayakan Paskah karena najis diberi kesempatan kedua sebulan kemudian (9:10–11). Lalu bangsa itu belajar mengikuti awan: kalau awan naik, mereka berangkat; kalau awan diam, mereka tinggal, walau sehari atau setahun (9:22)."],
 tanya:["Pernah merasa pemberianmu kalah dibanding orang lain?","Kenapa ya Allah memberi kesempatan kedua untuk merayakan Paskah?","Gimana rasanya kalau harus menunggu lama tanpa tahu kapan berangkat?"],
 aksi:"Beri sesuatu dengan tulus minggu ini tanpa membandingkan dengan pemberian orang lain. Latih kesabaran: tunggu giliranmu tanpa mengeluh."},
 ortu:{r:["Bilangan 7 mencatat dua belas persembahan identik dengan rincian yang sama, berulang dua belas kali. Bagi kita yang terbiasa dengan efisiensi, ini terasa berlebihan. Namun pengulangan itu menyatakan sesuatu: setiap suku, setiap pemberian, tercatat dan dihargai di hadapan Allah.","Dalam keluarga, anak-anak sering ingin diperhatikan secara adil. Menghargai usaha setiap anak satu per satu, walaupun mirip, mengajarkan bahwa mereka masing-masing berarti, bukan hanya yang paling menonjol.","Bilangan 9:15–23 menggambarkan Israel yang berangkat dan berhenti mengikuti awan, kadang dua hari, kadang sebulan, kadang setahun (9:22). Ada masa menunggu dalam hidup keluarga: menunggu pekerjaan, menunggu kesembuhan, menunggu anak. Iman berarti tetap setia, baik saat bergerak maupun saat diam."],
 tanya:["Apakah kita memberi perhatian yang adil kepada setiap anak?","Masa menunggu apa yang sedang dijalani keluarga kita?","Bagaimana kita tetap setia di masa menunggu?"],
 aksi:"Puji setiap anak secara terpisah untuk satu hal yang ia lakukan minggu ini. Doakan bersama pasangan satu hal yang sedang kalian tunggu."}},
44:{anak:{r:["Akhirnya Israel berangkat dari Sinai. Setiap kali tabut perjanjian berangkat, Musa berdoa: bangkitlah, TUHAN (10:35). Mereka tahu, perjalanan ini harus dipimpin Tuhan.","Tapi baru saja berjalan, mereka sudah mengeluh. Mereka rindu ikan, mentimun, semangka, bawang di Mesir (11:5), dan lupa bahwa di Mesir mereka budak! Musa sampai berkata kepada Tuhan: aku tidak sanggup sendirian memikul seluruh bangsa ini (11:14). Allah menolong Musa dengan memberi Roh kepada tujuh puluh tua-tua.","Di pasal 12, kakak-kakak Musa sendiri, Miryam dan Harun, mengecam Musa. Musa diam saja; Alkitab menyebut dia orang yang sangat lembut hatinya (12:3). Waktu Miryam dihukum, Musa malah berdoa supaya ia sembuh (12:13). Bangsa itu juga menunggu Miryam selama tujuh hari sebelum berangkat (12:15)."],
 tanya:["Pernah merindukan sesuatu yang dulu, padahal sebenarnya tidak baik?","Apa yang kamu lakukan kalau dikritik saudaramu?","Kenapa Musa malah mendoakan Miryam?"],
 aksi:"Kalau minggu ini ada yang mengkritik atau menyalahkanmu, tahan diri untuk tidak langsung membalas, lalu doakan orang itu."},
 ortu:{r:["Kerinduan bangsa itu pada makanan Mesir (11:4–6) adalah nostalgia yang selektif: mereka ingat ikan dan mentimun, tetapi lupa cambuk mandor. Dalam pernikahan dan keluarga, kita kadang merindukan “masa lalu yang indah” sambil lupa beratnya, dan mengabaikan berkat yang ada sekarang.","Seruan Musa, “aku seorang diri tidak dapat memikul tanggung jawab atas seluruh bangsa ini” (11:14), sangat jujur. Banyak orang tua, terutama yang memikul beban paling berat, merasakan hal yang sama. Allah menjawab dengan membagi Roh kepada tujuh puluh tua-tua (11:16–17). Meminta bantuan, dari pasangan, keluarga, atau komunitas, adalah jalan Allah juga.","Musa disebut sangat lembut hatinya (12:3) saat dikritik oleh saudara-saudaranya sendiri. Kritik paling menyakitkan sering datang dari orang terdekat. Kelembutan bukan kelemahan, tetapi kekuatan untuk tidak membalas, dan bahkan mendoakan (12:13)."],
 tanya:["Masa lalu apa yang sering kita rindukan sambil melupakan berkat sekarang?","Beban apa yang sedang dipikul sendirian oleh salah satu dari kita?","Bagaimana biasanya kita merespons kritik dari keluarga terdekat?"],
 aksi:"Tanyakan kepada pasangan: “Beban apa yang paling ingin kamu bagi?” lalu ambil satu bagian. Cari satu sumber bantuan dari luar (keluarga, komunitas, atau paroki) bila perlu."}},
