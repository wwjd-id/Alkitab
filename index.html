<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a4b2a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Alkitab Keluarga</title>
<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2622; --muted:#7a6f66; --line:#e6ddd0;
  --accent:#8a4b2a; --accent-soft:#f3e4d8; --ok:#2f7a55; --warn:#a0621c; --warn-soft:#fbefdc;
  --g1:#ffd9b8; --g2:#bcd4f6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1917;--card:#26221f;--ink:#efe8df;--muted:#a8998b;--line:#3a332d;--accent:#e0a37c;--accent-soft:#3a2b22;--ok:#6fc49a;--warn:#e7b26b;--warn-soft:#3a2f1f;--g1:#3d2340;--g2:#123049;}
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(150deg,var(--g1) 0%,var(--g2) 100%) fixed;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.8px;line-height:1.55}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-weight:600;font-size:20.8px;margin:0 0 4px}
.sub{color:var(--muted);font-size:11.2px;margin:0}
main{max-width:760px;margin:0 auto;padding:8px 16px 60px}
nav.tabs{display:flex;gap:6px;margin:12px 0 16px;overflow-x:auto}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:700;font-size:11.2px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(60,40,30,.08);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.period{display:inline-block;font-size:9.6px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;margin-bottom:6px}
.daytitle{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-weight:600;font-size:17.6px;margin:2px 0 8px}
.reads{list-style:none;padding:0;margin:0 0 6px}
.reads li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reads li:last-child{border-bottom:0}
.dk{font-size:8.8px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;font:inherit;font-weight:600;font-size:11.2px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.members{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mem{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;user-select:none;font-weight:600;font-size:11.2px}
.mem.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mem .box{width:16px;height:16px;border-radius:4px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:8.8px}
.sec h3{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-weight:600;font-size:13.6px;margin:16px 0 4px}
.sec p,.sec li{margin:4px 0}
.sec ul{padding-left:20px;margin:4px 0}
.tag{font-size:9.6px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;white-space:nowrap}
.tag.g{background:var(--accent-soft);color:var(--accent)}
.tag.r{background:#e3eef8;color:#2a5b86}
@media (prefers-color-scheme: dark){.tag.r{background:#1f3242;color:#8fc0ea}}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:12px}
.empty{color:var(--muted);font-size:12px}
.srcs{font-size:10.4px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.srcs a{color:var(--accent)}
a{color:var(--accent)}
.list input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.dayrow{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow:hover{background:var(--accent-soft)}
.dnum{font-weight:700;min-width:44px;color:var(--muted);font-size:11.2px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.dtext{flex:1;font-size:11.2px}
.ticks{font-size:9.6px;color:var(--ok);font-weight:700;white-space:nowrap}
.has{font-size:8.8px;font-weight:700;color:var(--accent);margin-left:4px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.prog > div{height:100%;background:var(--ok)}
label.f{display:block;font-size:10.4px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input.t,input[type=date]{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.hide{display:none}
.reads li{display:block}
.rbtn{padding:5px 10px;font-size:10.4px}
.reader{margin:8px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.rtabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.rtabs button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:10.4px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.rtabs button.on{background:var(--accent);color:#fff}
.rbody{padding:10px 12px;max-height:70vh;overflow:auto}
.rframe{width:100%;height:60vh;border:0;border-radius:8px;background:#fff}
.rtext .rv{margin:4px 0;line-height:1.7}
.rtext sup{color:var(--accent);font-weight:700;margin-right:2px}
.rtext.rtl{direction:rtl;text-align:right;font-size:16px}
.rch{font-weight:700;margin:10px 0 4px;color:var(--muted);font-size:10.4px}
.rnote{font-size:9.6px;color:var(--muted);margin-top:8px}
.chap{padding:10px 0;border-bottom:1px dashed var(--line);list-style:none}
.chead{font-size:12px}.ctitle{color:var(--accent);font-weight:700}
.csum{margin:4px 0 8px;font-size:12px}
.h2{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-weight:600;font-size:15.2px;font-weight:700}
.xblock{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}.xhead{font-weight:700;color:var(--accent);font-size:11.2px}
.sechead{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-weight:600;font-weight:700;font-size:13.6px;margin:14px 0 4px}
nav.tabs button,.btn,.rtabs button,.mem,.period,.tag,.dk,label.f,.has,.ticks,.dnum,.rnote,.srcs{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.couple{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--accent-soft)}
.couple summary{cursor:pointer;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12px}
.ren p{margin:6px 0}
.rbox{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:10px 0}.rbox ul{margin:4px 0;padding-left:18px}.rbox p{margin:4px 0}
</style>
</head>

<header>
  <h1>📖 Alkitab Keluarga</h1>
  <p class="sub">Menyusuri Alkitab urut kitab demi kitab, 3 pasal sehari, dengan ringkasan pasal dan penjelasan 5W 1H bersumber.</p>
</header>
<main>
  <nav class="tabs">
    <button data-v="today" class="on">Hari ini</button>
    <button data-v="ren">Renungan</button>
    <button data-v="all">Semua hari</button>
    <button data-v="family">Keluarga</button>
    <button data-v="about">Aturan & sumber</button>

  <section id="v-today"></section>
  <section id="v-ren" class="hide"></section>
  <section id="v-all" class="hide list"></section>
  <section id="v-family" class="hide"></section>
  <section id="v-about" class="hide"></section>
</main>

<script>
/* ===== Daftar kitab: urutan Alkitab Deuterokanonika LAI ===== */
// [nama, nama Inggris (untuk teks asli/Inggris), jumlah pasal atau daftar unit, singkatan SABDA, bagian]
const BOOKLIST = [
 ["Kejadian","Genesis",50,"Kej","PL"],["Keluaran","Exodus",40,"Kel","PL"],["Imamat","Leviticus",27,"Im","PL"],["Bilangan","Numbers",36,"Bil","PL"],["Ulangan","Deuteronomy",34,"Ul","PL"],
 ["Yosua","Joshua",24,"Yos","PL"],["Hakim-hakim","Judges",21,"Hak","PL"],["Rut","Ruth",4,"Rut","PL"],["1 Samuel","1 Samuel",31,"1Sam","PL"],["2 Samuel","2 Samuel",24,"2Sam","PL"],
 ["1 Raja-raja","1 Kings",22,"1Raj","PL"],["2 Raja-raja","2 Kings",25,"2Raj","PL"],["1 Tawarikh","1 Chronicles",29,"1Taw","PL"],["2 Tawarikh","2 Chronicles",36,"2Taw","PL"],
 ["Ezra","Ezra",10,"Ezr","PL"],["Nehemia","Nehemiah",13,"Neh","PL"],["Ester","Esther",10,"Est","PL"],["Ayub","Job",42,"Ayb","PL"],["Mazmur","Psalm",150,"Mzm","PL"],
 ["Amsal","Proverbs",31,"Ams","PL"],["Pengkhotbah","Ecclesiastes",12,"Pkh","PL"],["Kidung Agung","Song of Solomon",8,"Kid","PL"],["Yesaya","Isaiah",66,"Yes","PL"],
 ["Yeremia","Jeremiah",52,"Yer","PL"],["Ratapan","Lamentations",5,"Rat","PL"],["Yehezkiel","Ezekiel",48,"Yeh","PL"],["Daniel","Daniel",12,"Dan","PL"],["Hosea","Hosea",14,"Hos","PL"],
 ["Yoel","Joel",3,"Yl","PL"],["Amos","Amos",9,"Am","PL"],["Obaja","Obadiah",1,"Ob","PL"],["Yunus","Jonah",4,"Yun","PL"],["Mikha","Micah",7,"Mi","PL"],["Nahum","Nahum",3,"Nah","PL"],
 ["Habakuk","Habakkuk",3,"Hab","PL"],["Zefanya","Zephaniah",3,"Zef","PL"],["Hagai","Haggai",2,"Hag","PL"],["Zakharia","Zechariah",14,"Za","PL"],["Maleakhi","Malachi",4,"Mal","PL"],
 ["Tobit","Tobit",14,null,"DK"],["Yudit","Judith",16,null,"DK"],["Tambahan Ester","Esther",["10:4-13","11","12","13","14","15","16"],null,"DK"],
 ["Kebijaksanaan Salomo","Wisdom",19,null,"DK"],["Sirakh","Sirach",51,null,"DK"],["Barukh","Baruch",6,null,"DK"],["Tambahan Daniel","Daniel",["3:24-90","13","14"],null,"DK"],
 ["1 Makabe","1 Maccabees",16,null,"DK"],["2 Makabe","2 Maccabees",15,null,"DK"],
 ["Matius","Matthew",28,"Mat","PB"],["Markus","Mark",16,"Mrk","PB"],["Lukas","Luke",24,"Luk","PB"],["Yohanes","John",21,"Yoh","PB"],["Kisah Para Rasul","Acts",28,"Kis","PB"],
 ["Roma","Romans",16,"Rm","PB"],["1 Korintus","1 Corinthians",16,"1Kor","PB"],["2 Korintus","2 Corinthians",13,"2Kor","PB"],["Galatia","Galatians",6,"Gal","PB"],["Efesus","Ephesians",6,"Ef","PB"],
 ["Filipi","Philippians",4,"Flp","PB"],["Kolose","Colossians",4,"Kol","PB"],["1 Tesalonika","1 Thessalonians",5,"1Tes","PB"],["2 Tesalonika","2 Thessalonians",3,"2Tes","PB"],
 ["1 Timotius","1 Timothy",6,"1Tim","PB"],["2 Timotius","2 Timothy",4,"2Tim","PB"],["Titus","Titus",3,"Tit","PB"],["Filemon","Philemon",1,"Flm","PB"],["Ibrani","Hebrews",13,"Ibr","PB"],
 ["Yakobus","James",5,"Yak","PB"],["1 Petrus","1 Peter",5,"1Ptr","PB"],["2 Petrus","2 Peter",3,"2Ptr","PB"],["1 Yohanes","1 John",5,"1Yoh","PB"],["2 Yohanes","2 John",1,"2Yoh","PB"],
 ["3 Yohanes","3 John",1,"3Yoh","PB"],["Yudas","Jude",1,"Yud","PB"],["Wahyu","Revelation",22,"Why","PB"]
];
const SECTIONS = {PL:["Perjanjian Lama","#8a5a2b"], DK:["Deuterokanonika","#b0702a"], PB:["Perjanjian Baru","#3f6fa8"]};
const PER_DAY = 3;

/* Susun rencana: 3 pasal per hari, tidak melompati batas kitab */
const PLAN = [];
for(const [name,en,chs,sab,sec] of BOOKLIST){
  const units = Array.isArray(chs) ? chs : Array.from({length:chs},(_,i)=>String(i+1));
  for(let i=0;i<units.length;i+=PER_DAY){
    const part = units.slice(i,i+PER_DAY).map(u=>({book:name, en, ch:u, sab, sec, key:name+" "+u}));
    PLAN.push({day:PLAN.length+1, book:name, sec, units:part});
  }
}
const TOTAL = PLAN.length;
function dayLabel(p){ const c=p.units.map(u=>u.ch); if(c.some(x=>/\D/.test(x))) return p.book+" "+c.join(", "); return p.book+" "+(c.length===1?c[0]:c[0]+"–"+c[c.length-1]); }

/* ===== Ringkasan per pasal (kata-kata sendiri, BUKAN ayat) ===== */
const SUMMARY = {
"Kejadian 1":["Penciptaan dunia","Allah menciptakan langit, bumi, dan segala isinya dalam enam hari, termasuk manusia menurut gambar-Nya. Semuanya \"sungguh amat baik\"."],
"Kejadian 2":["Hari ketujuh & Taman Eden","Allah berhenti pada hari ketujuh. Manusia dibentuk dari debu tanah, ditempatkan di taman Eden, lalu perempuan diciptakan sebagai penolong yang sepadan."],
"Kejadian 3":["Manusia jatuh ke dalam dosa","Ular membujuk perempuan; ia dan suaminya makan buah yang dilarang, lalu bersembunyi. Mereka menerima hukuman dan diusir dari taman Eden."],
"Kejadian 4":["Kain dan Habel","Anak-anak Adam dan Hawa: Kain membunuh adiknya, Habel. Lalu silsilah keturunan Kain sampai Lamekh, dan kelahiran Set."],
"Kejadian 5":["Silsilah Adam sampai Nuh","Daftar keturunan Adam melalui Set sampai Nuh, termasuk Henokh yang \"bergaul dengan Allah\" dan Metusalah."],
"Kejadian 6":["Kejahatan manusia & perintah membuat bahtera","Kejahatan manusia makin besar. Nuh mendapat kasih karunia di mata Tuhan dan disuruh membuat bahtera."],
"Kejadian 7":["Air bah datang","Nuh, keluarganya, dan binatang-binatang masuk ke bahtera. Air bah menutupi bumi."],
"Kejadian 8":["Air surut","Bahtera kandas di pegunungan Ararat. Nuh melepas burung gagak dan merpati, lalu keluar dan mempersembahkan korban kepada Tuhan."],
"Kejadian 9":["Perjanjian dengan Nuh","Allah memberkati Nuh dan membuat perjanjian dengan pelangi sebagai tandanya. Lalu kisah Nuh mabuk dan Ham."],
"Kejadian 10":["Daftar bangsa-bangsa","Keturunan anak-anak Nuh, yaitu Sem, Ham, dan Yafet, yang menjadi bangsa-bangsa di bumi."],
"Kejadian 11":["Menara Babel","Manusia membangun menara di Babel, lalu Tuhan mengacaukan bahasa mereka. Silsilah Sem sampai Abram, dan keluarga Terah pindah dari Ur ke Haran."],
"Kejadian 12":["Panggilan Abram","Tuhan memanggil Abram pergi ke negeri yang akan ditunjukkan-Nya dan menjanjikan berkat. Abram ke Kanaan, lalu ke Mesir karena kelaparan."],
"Kejadian 13":["Abram dan Lot berpisah","Abram dan Lot berpisah karena ternak mereka terlalu banyak. Lot memilih lembah Yordan dekat Sodom; Tuhan menjanjikan negeri itu kepada keturunan Abram."],
"Kejadian 14":["Abram menyelamatkan Lot","Lot ditawan dalam perang raja-raja, lalu diselamatkan Abram. Melkisedek, raja Salem, memberkati Abram."],
"Kejadian 15":["Perjanjian Allah dengan Abram","Allah berjanji keturunan Abram akan sebanyak bintang. Abram percaya, dan Allah mengikat perjanjian dengannya."],
"Kejadian 16":["Hagar dan Ismael","Sarai memberikan Hagar kepada Abram. Hagar mengandung, melarikan diri, ditemui malaikat Tuhan, lalu melahirkan Ismael."],
"Kejadian 17":["Perjanjian sunat","Allah meneguhkan perjanjian-Nya, mengganti nama Abram menjadi Abraham dan Sarai menjadi Sara, menetapkan sunat, dan menjanjikan Ishak."],
"Kejadian 18":["Tiga tamu di Mamre","Abraham menjamu tiga tamu; Sara tertawa mendengar janji akan punya anak. Abraham memohon bagi Sodom."],
"Kejadian 19":["Sodom dan Gomora","Lot dan anak-anaknya diselamatkan, sementara Sodom dan Gomora dimusnahkan. Istri Lot menoleh ke belakang."],
"Kejadian 20":["Abraham dan Abimelekh","Di Gerar, Abraham kembali mengaku Sara sebagai adiknya. Allah memperingatkan Raja Abimelekh dalam mimpi."],
"Kejadian 21":["Ishak lahir","Ishak lahir sesuai janji. Hagar dan Ismael disuruh pergi, tetapi Allah memelihara mereka. Abraham membuat perjanjian dengan Abimelekh di Bersyeba."],
"Kejadian 22":["Ujian bagi Abraham","Allah menguji Abraham untuk mempersembahkan Ishak; pada saat terakhir Tuhan menyediakan seekor domba jantan sebagai gantinya."],
"Kejadian 23":["Sara wafat","Sara meninggal. Abraham membeli gua Makhpela sebagai tempat pemakaman."],
"Kejadian 24":["Istri untuk Ishak","Hamba Abraham pergi mencari istri bagi Ishak dan bertemu Ribka."],

"Kejadian 26":["Ishak dan Abimelekh","Ishak tinggal di Gerar, berselisih soal sumur-sumur, lalu berdamai dengan Abimelekh. Tuhan meneguhkan janji-Nya kepada Ishak."],

"Kejadian 49":["Berkat Yakub bagi anak-anaknya","Yakub memberkati kedua belas anaknya, lalu meninggal."],
"Kejadian 50":["Yakub dikuburkan; Yusuf wafat","Yakub dikuburkan di Kanaan. Yusuf mengampuni saudara-saudaranya, lalu meninggal di Mesir."],
"Keluaran 1":["Israel ditindas di Mesir","Keturunan Yakub bertambah banyak. Raja Mesir yang baru takut, lalu memperbudak mereka dan menyuruh bayi laki-laki dibunuh. Bidan Sifra dan Pua takut akan Allah dan membiarkan bayi-bayi hidup."],
"Keluaran 2":["Musa lahir dan lari ke Midian","Bayi Musa disembunyikan dalam keranjang di sungai Nil dan diangkat anak oleh putri Firaun. Setelah dewasa ia membunuh seorang Mesir, lari ke Midian, dan menikah dengan Zipora. Allah mendengar seruan Israel."],
"Keluaran 3":["Semak yang menyala","Allah memanggil Musa dari semak yang menyala di gunung Horeb, mengutusnya membebaskan Israel, dan menyatakan nama-Nya: \"AKU ADALAH AKU\"."],
"Keluaran 4":["Tanda-tanda dan Harun","Musa diberi tanda-tanda (tongkat menjadi ular, tangan kena kusta). Ia merasa tidak pandai bicara, maka Harun ditetapkan menjadi juru bicaranya. Musa kembali ke Mesir dan bangsa itu percaya."],
"Keluaran 5":["Firaun menolak, beban ditambah","Firaun menolak membiarkan Israel pergi dan malah menyuruh mereka membuat batu bata tanpa disediakan jerami. Para mandur Israel menyalahkan Musa dan Harun."],
"Keluaran 6":["Janji Allah ditegaskan","Allah meneguhkan janji-Nya untuk membebaskan Israel, tetapi bangsa itu tidak mau mendengar karena patah semangat. Lalu dicatat silsilah Musa dan Harun."],
"Keluaran 7":["Tongkat Harun & tulah darah","Tongkat Harun menjadi ular di depan Firaun. Tulah pertama: air sungai Nil menjadi darah. Hati Firaun tetap keras."],
"Keluaran 8":["Tulah katak, nyamuk, lalat","Tulah katak, nyamuk, dan lalat pikat. Firaun sempat berjanji akan melepas Israel, tetapi ingkar lagi setiap kali tulah berhenti."],
"Keluaran 9":["Tulah ternak, barah, hujan es","Ternak Mesir mati, orang Mesir kena barah, lalu hujan es besar. Firaun mengaku bersalah, tetapi kembali mengeraskan hati."],
"Keluaran 10":["Tulah belalang dan gelap","Belalang menghabiskan tanaman, lalu gelap gulita meliputi Mesir tiga hari, sedangkan di tempat orang Israel ada terang."],
"Keluaran 11":["Pemberitahuan tulah terakhir","Musa memberitahukan tulah kesepuluh: kematian setiap anak sulung di Mesir."],
"Keluaran 12":["Paskah dan keluar dari Mesir","Allah menetapkan Paskah: anak domba disembelih dan darahnya dioleskan di ambang pintu. Anak sulung Mesir mati, dan Israel keluar dari Mesir pada malam itu juga."],
"Keluaran 13":["Anak sulung & tiang awan","Anak sulung dikuduskan bagi Tuhan dan hari raya Roti Tidak Beragi ditetapkan. Allah menuntun bangsa itu dengan tiang awan pada siang hari dan tiang api pada malam hari."],
"Keluaran 14":["Menyeberangi laut","Firaun mengejar dengan keretanya. Musa mengulurkan tangan, air laut terbelah, Israel berjalan di tanah kering, dan tentara Mesir tenggelam."],
"Keluaran 15":["Nyanyian kemenangan; air pahit","Musa dan Israel menyanyikan pujian, Miryam memimpin para perempuan menari. Di Mara air pahit menjadi manis, lalu mereka tiba di Elim."],
"Keluaran 16":["Manna dan burung puyuh","Bangsa itu bersungut-sungut karena lapar. Allah memberi burung puyuh dan manna setiap pagi, kecuali hari Sabat."],
"Keluaran 17":["Air dari batu; perang Amalek","Di Masa dan Meriba Musa memukul batu dan keluar air. Israel melawan Amalek; selama tangan Musa terangkat (ditopang Harun dan Hur), Israel menang."],
"Keluaran 18":["Nasihat Yitro","Yitro, mertua Musa, datang berkunjung. Melihat Musa mengadili rakyat sendirian, Yitro menyarankan agar ia mengangkat pemimpin-pemimpin untuk membantunya."],
"Keluaran 19":["Tiba di gunung Sinai","Allah menawarkan perjanjian: Israel akan menjadi milik kesayangan-Nya, kerajaan imam dan bangsa yang kudus. Bangsa itu menyucikan diri, lalu Tuhan turun di atas gunung dengan guruh dan api."],
"Keluaran 20":["Sepuluh Firman","Allah memberikan Sepuluh Firman. Bangsa itu ketakutan dan meminta Musa saja yang berbicara kepada mereka."],
"Keluaran 21":["Hukum tentang budak dan luka","Awal \"kitab perjanjian\": aturan tentang budak Ibrani, pembunuhan, penganiayaan, dan ganti rugi atas luka."],
"Keluaran 22":["Hukum tentang harta & kepedulian","Aturan tentang pencurian dan ganti rugi, serta perintah untuk tidak menindas orang asing, janda, dan anak yatim."],
"Keluaran 23":["Keadilan dan hari raya","Perintah berlaku adil di pengadilan, menolong hewan musuh, tahun Sabat, hari Sabat, dan tiga hari raya. Allah berjanji mengutus malaikat-Nya di depan Israel."],
"Keluaran 24":["Perjanjian dimeteraikan","Bangsa itu berjanji melakukan segala firman Tuhan, dan perjanjian dimeteraikan dengan darah. Musa naik ke gunung selama empat puluh hari empat puluh malam."],
"Keluaran 25":["Tabut, meja, kandil","Allah meminta persembahan sukarela untuk membuat tempat kudus supaya Ia diam di tengah-tengah mereka, lalu memberi rancangan tabut perjanjian, meja roti, dan kandil."],
"Keluaran 26":["Kemah Suci","Rancangan Kemah Suci: tirai-tirai, papan-papan, dan tabir yang memisahkan tempat kudus dari tempat maha kudus."],
"Keluaran 27":["Mezbah dan pelataran","Rancangan mezbah korban bakaran, pelataran Kemah Suci, dan minyak untuk lampu yang harus terus menyala."],
"Keluaran 28":["Pakaian imam","Rancangan pakaian kudus untuk Harun: efod, tutup dada dengan dua belas permata bertuliskan nama suku-suku Israel, jubah, dan serban."],
"Keluaran 29":["Penahbisan imam","Tata cara menahbiskan Harun dan anak-anaknya menjadi imam, serta korban harian. Allah berjanji akan diam di tengah-tengah Israel."],
"Keluaran 30":["Mezbah ukupan dan lain-lain","Mezbah pembakaran ukupan, uang pendamaian setengah syikal, bak pembasuhan, minyak urapan, dan ukupan kudus."],
"Keluaran 31":["Bezaleel dan loh batu","Allah memenuhi Bezaleel dan Aholiab dengan Roh-Nya untuk membuat semua perlengkapan. Sabat ditegaskan sebagai tanda, lalu Musa menerima dua loh batu."],
"Keluaran 32":["Anak lembu emas","Karena Musa lama tidak turun, Harun membuat anak lembu emas dan bangsa itu menyembahnya. Musa memecahkan loh batu, lalu memohon ampun bagi bangsanya."],
"Keluaran 33":["Musa memohon penyertaan Tuhan","Tuhan menyuruh Israel berangkat. Musa berbicara dengan Tuhan \"berhadapan muka\" di Kemah Pertemuan dan memohon agar Tuhan sendiri berjalan menyertai mereka."],
"Keluaran 34":["Loh batu baru, wajah Musa bersinar","Tuhan menyatakan diri sebagai Allah yang penyayang dan pengasih, memperbarui perjanjian, dan memberi loh batu baru. Kulit muka Musa bercahaya."],
"Keluaran 35":["Persembahan sukarela","Musa menyampaikan perintah Sabat dan mengajak setiap orang yang tergerak hatinya membawa persembahan. Para pengrajin mulai bekerja."],
"Keluaran 36":["Persembahan berlebihan","Bangsa itu membawa persembahan begitu banyak sampai harus disuruh berhenti. Para tukang membuat tirai dan papan Kemah Suci."],
"Keluaran 37":["Tabut dan perlengkapannya dibuat","Bezaleel membuat tabut, tutup pendamaian dengan kerub, meja, kandil, dan mezbah ukupan."],
"Keluaran 38":["Mezbah, bak, pelataran","Mezbah korban bakaran, bak tembaga dari cermin para perempuan yang melayani, dan pelataran dibuat. Lalu dicatat jumlah logam yang terpakai."],
"Keluaran 39":["Pakaian imam selesai","Pakaian imam dibuat. Seluruh pekerjaan diperiksa Musa; semuanya sesuai perintah Tuhan, dan Musa memberkati mereka."],
"Keluaran 40":["Kemah Suci didirikan","Kemah Suci didirikan pada hari pertama bulan pertama. Awan menutupinya dan kemuliaan Tuhan memenuhinya, lalu awan itu menuntun perjalanan Israel."],
"Imamat 1":["Korban bakaran","Aturan korban bakaran dari lembu, kambing domba, atau burung, yang seluruhnya dibakar di atas mezbah."],
"Imamat 2":["Korban sajian","Aturan korban sajian dari tepung, minyak, dan kemenyan. Setiap korban sajian harus dibubuhi garam."],
"Imamat 3":["Korban keselamatan","Aturan korban keselamatan (korban persekutuan). Lemak dan darah tidak boleh dimakan."],
"Imamat 4":["Korban penghapus dosa","Korban penghapus dosa untuk dosa yang tidak disengaja, baik oleh imam, seluruh umat, pemimpin, maupun orang biasa."],
"Imamat 5":["Pengakuan dan korban penebus salah","Kasus-kasus yang memerlukan korban penghapus dosa; orang harus mengakui dosanya. Orang miskin boleh mempersembahkan burung atau tepung. Lalu aturan korban penebus salah."],
"Imamat 6":["Ganti rugi dan tugas imam","Orang yang merugikan sesamanya harus mengembalikan semuanya ditambah seperlima. Lalu petunjuk bagi imam: api di mezbah harus tetap menyala."],
"Imamat 7":["Aturan korban (lanjutan)","Aturan korban penebus salah dan korban keselamatan, serta bagian yang menjadi hak imam."],
"Imamat 8":["Harun ditahbiskan","Musa menahbiskan Harun dan anak-anaknya sebagai imam di depan seluruh umat, sesuai perintah Tuhan."],
"Imamat 9":["Korban pertama para imam","Harun mempersembahkan korban untuk pertama kalinya. Kemuliaan Tuhan tampak dan api keluar dari hadapan Tuhan menghanguskan korban itu."],
"Imamat 10":["Nadab dan Abihu","Dua anak Harun mempersembahkan api asing yang tidak diperintahkan, lalu mati. Ada aturan tambahan bagi para imam."],
"Imamat 11":["Binatang tahir dan najis","Daftar binatang yang boleh dan tidak boleh dimakan. \"Kuduslah kamu, sebab Aku kudus.\""],
"Imamat 12":["Penyucian sesudah melahirkan","Aturan penyucian seorang ibu sesudah melahirkan, termasuk korban yang lebih ringan bagi yang tidak mampu."],
"Imamat 13":["Penyakit kulit","Cara imam memeriksa penyakit kulit (yang dalam terjemahan disebut kusta) dan jamur pada pakaian."],
"Imamat 14":["Pentahiran orang sakit kulit","Upacara pentahiran orang yang sudah sembuh dari penyakit kulit, dan aturan tentang jamur pada rumah."],
"Imamat 15":["Lelehan tubuh","Aturan kenajisan karena lelehan dari tubuh laki-laki dan perempuan, dan cara pentahirannya."],
"Imamat 16":["Hari Pendamaian","Setahun sekali imam besar masuk ke tempat maha kudus untuk mengadakan pendamaian. Seekor kambing dilepas ke padang gurun membawa kesalahan umat."],
"Imamat 17":["Darah adalah nyawa","Korban hanya boleh dipersembahkan di Kemah Pertemuan. Darah tidak boleh dimakan karena nyawa ada di dalam darah."],
"Imamat 18":["Kekudusan hubungan keluarga","Larangan hubungan yang tidak pantas antara anggota keluarga dan kebiasaan bangsa-bangsa lain yang dianggap keji."],
"Imamat 19":["Kudus dalam hidup sehari-hari","Hormati ibu dan bapa, sisakan panen untuk orang miskin, jangan mencuri atau menipu, kasihilah sesamamu manusia seperti dirimu sendiri, dan kasihi orang asing."],
"Imamat 20":["Hukuman atas pelanggaran","Hukuman bagi yang mempersembahkan anak kepada Molokh, meminta petunjuk arwah, mengutuk orang tua, dan melanggar kekudusan keluarga."],
"Imamat 21":["Kekudusan para imam","Aturan khusus tentang kehidupan para imam dan imam besar."],
"Imamat 22":["Persembahan yang kudus","Siapa yang boleh makan persembahan kudus, dan syarat hewan korban: harus tidak bercacat."],
"Imamat 23":["Hari-hari raya","Daftar hari raya: Sabat, Paskah, Roti Tidak Beragi, buah sulung, Pentakosta, peniupan serunai, Hari Pendamaian, dan Pondok Daun."],
"Imamat 24":["Lampu, roti, dan si penghujat","Lampu di Kemah Suci harus terus menyala dan roti sajian diletakkan setiap Sabat. Lalu kisah seorang yang menghujat nama Tuhan."],
"Imamat 25":["Tahun Sabat dan Yobel","Setiap tahun ketujuh tanah diistirahatkan. Setiap tahun kelima puluh (Yobel) tanah kembali ke pemiliknya dan budak dibebaskan. Tanah itu milik Tuhan."],
"Imamat 26":["Berkat dan kutuk","Berkat jika Israel taat, kutuk jika memberontak. Namun Tuhan tetap mengingat perjanjian-Nya bila mereka mengaku dosa."],
"Imamat 27":["Nazar dan penebusan","Aturan tentang nazar, penilaian orang dan barang yang dipersembahkan, dan persepuluhan."],
"Bilangan 1":["Sensus pertama","Di padang gurun Sinai, laki-laki Israel yang berumur dua puluh tahun ke atas dihitung menurut suku. Orang Lewi tidak dihitung karena bertugas di Kemah Suci."],
"Bilangan 2":["Susunan perkemahan","Kedua belas suku berkemah mengelilingi Kemah Pertemuan, masing-masing di bawah panjinya."],
"Bilangan 3":["Tugas orang Lewi","Orang Lewi diambil Tuhan sebagai ganti anak-anak sulung Israel dan dibagi tugas menurut kaumnya."],
"Bilangan 4":["Mengangkut Kemah Suci","Tugas kaum Kehat, Gerson, dan Merari dalam mengangkut perlengkapan Kemah Suci."],
"Bilangan 5":["Kemurnian perkemahan","Orang najis ditempatkan di luar perkemahan, aturan ganti rugi, dan tata cara bila seorang suami cemburu."],
"Bilangan 6":["Nazir dan berkat imam","Aturan bagi orang yang bernazar sebagai nazir, lalu berkat imam: \"TUHAN memberkati engkau dan melindungi engkau...\""],
"Bilangan 7":["Persembahan para pemimpin","Setiap pemimpin suku membawa persembahan yang sama untuk pentahbisan mezbah, satu suku setiap hari selama dua belas hari."],
"Bilangan 8":["Lampu dan penahbisan Lewi","Ketujuh lampu dipasang pada kandil, lalu orang Lewi ditahirkan dan diserahkan untuk melayani."],
"Bilangan 9":["Paskah kedua; awan penuntun","Paskah dirayakan di padang gurun, dengan kesempatan kedua bagi yang najis. Israel berangkat atau berkemah mengikuti awan di atas Kemah Suci."],
"Bilangan 10":["Berangkat dari Sinai","Dua nafiri perak dibuat untuk memberi tanda. Israel berangkat dari Sinai menurut urutan sukunya, didahului tabut perjanjian."],
"Bilangan 11":["Bersungut-sungut minta daging","Bangsa itu mengeluh dan rindu makanan Mesir. Musa merasa tidak sanggup sendirian, lalu tujuh puluh tua-tua diberi Roh. Tuhan mengirim burung puyuh."],
"Bilangan 12":["Miryam dan Harun mengecam Musa","Miryam dan Harun mengecam Musa. Tuhan membela Musa, orang yang sangat lembut hatinya. Miryam kena penyakit kulit dan harus tinggal di luar perkemahan tujuh hari."],
"Bilangan 13":["Dua belas pengintai","Dua belas pengintai dikirim ke Kanaan. Negerinya subur, tetapi sepuluh orang menakut-nakuti bangsa itu: \"Kami seperti belalang.\" Kaleb mengajak maju."],
"Bilangan 14":["Takut dan memberontak","Bangsa itu menangis dan ingin kembali ke Mesir. Yosua dan Kaleb mengajak percaya. Akibatnya, Israel harus mengembara empat puluh tahun di padang gurun."],
"Bilangan 15":["Aturan korban dan jumbai","Aturan korban setelah masuk negeri itu, dosa yang disengaja dan tidak disengaja, serta jumbai pada ujung pakaian sebagai pengingat perintah Tuhan."],
"Bilangan 16":["Pemberontakan Korah","Korah, Datan, dan Abiram memberontak melawan Musa dan Harun. Bumi menelan mereka, dan Harun berdiri di antara yang mati dan yang hidup untuk menghentikan tulah."],
"Bilangan 17":["Tongkat Harun bertunas","Dua belas tongkat diletakkan di Kemah Suci; tongkat Harun bertunas, berbunga, dan berbuah badam sebagai tanda pilihan Tuhan."],
"Bilangan 18":["Tugas dan bagian imam","Tugas imam dan orang Lewi, serta bagian dari persembahan dan persepuluhan yang menjadi hak mereka."],
"Bilangan 19":["Lembu merah dan air pentahiran","Abu lembu betina merah dicampur air dipakai untuk mentahirkan orang yang menyentuh mayat."],
"Bilangan 20":["Air dari batu; Harun wafat","Miryam meninggal. Di Meriba Musa memukul batu sehingga keluar air, tetapi karena tidak menghormati kekudusan Tuhan, ia tidak boleh masuk Kanaan. Edom menolak memberi jalan; Harun meninggal di gunung Hor."],
"Bilangan 21":["Ular tembaga","Bangsa itu mengeluh dan dipagut ular. Musa membuat ular tembaga; siapa yang memandangnya tetap hidup. Israel mengalahkan Sihon dan Og."],
"Bilangan 22":["Bileam dan keledainya","Balak, raja Moab, memanggil Bileam untuk mengutuk Israel. Di jalan, keledai Bileam melihat malaikat Tuhan dan berbicara kepadanya."],
"Bilangan 23":["Kutuk menjadi berkat","Bileam membuka mulut untuk mengutuk, tetapi yang keluar adalah berkat. \"Allah bukan manusia, sehingga Ia berdusta.\""],
"Bilangan 24":["Bintang dari Yakub","Bileam memberkati Israel untuk ketiga kalinya dan bernubuat tentang bintang yang terbit dari Yakub."],
"Bilangan 25":["Dosa di Baal-Peor","Israel berzina dengan perempuan Moab dan menyembah Baal-Peor. Pinehas bertindak tegas dan tulah berhenti."],
"Bilangan 26":["Sensus kedua","Generasi baru dihitung. Dari yang dihitung di Sinai, tidak ada yang tersisa kecuali Kaleb dan Yosua."],
"Bilangan 27":["Anak-anak Zelafehad; Yosua","Lima putri Zelafehad meminta hak waris dan Tuhan membenarkan mereka. Yosua ditetapkan sebagai pengganti Musa."],
"Bilangan 28":["Korban harian dan hari raya","Jadwal korban: setiap hari, setiap Sabat, awal bulan, Paskah, dan hari raya Tujuh Minggu."],
"Bilangan 29":["Korban hari raya bulan ketujuh","Korban untuk hari peniupan serunai, Hari Pendamaian, dan hari raya Pondok Daun."],
"Bilangan 30":["Aturan nazar","Nazar harus ditepati. Aturan nazar seorang perempuan yang masih tinggal bersama ayahnya atau sudah bersuami."],
"Bilangan 31":["Perang melawan Midian","Israel berperang melawan Midian. Bileam tewas, dan rampasan dibagi antara tentara, umat, dan Kemah Suci."],
"Bilangan 32":["Suku-suku di seberang Yordan","Ruben dan Gad meminta tanah di timur Yordan. Musa mengizinkan asalkan mereka ikut berperang bersama saudara-saudaranya."],
"Bilangan 33":["Tempat-tempat persinggahan","Daftar tempat persinggahan Israel dari Mesir sampai dataran Moab."],
"Bilangan 34":["Batas-batas tanah Kanaan","Batas negeri yang akan diwarisi dan nama para pemimpin yang akan membagi tanah itu."],
"Bilangan 35":["Kota Lewi dan kota perlindungan","Orang Lewi diberi kota-kota. Enam kota perlindungan ditetapkan bagi orang yang membunuh tanpa sengaja."],
"Bilangan 36":["Warisan putri Zelafehad","Supaya tanah tidak pindah suku, putri-putri yang mewarisi tanah menikah dalam sukunya sendiri. Kelima putri Zelafehad menaatinya."],
"Ulangan 1":["Musa mengenang perjalanan","Di seberang Yordan, Musa mulai berbicara kepada Israel. Ia mengenang pengangkatan hakim-hakim dan kisah para pengintai yang membuat Israel tidak jadi masuk Kanaan."],
"Ulangan 2":["Melewati Edom, Moab, Amon","Israel diperintahkan tidak memerangi Edom, Moab, dan Amon, lalu mengalahkan Sihon, raja Hesybon."],
"Ulangan 3":["Og dikalahkan; Musa tidak boleh menyeberang","Og, raja Basan, dikalahkan dan tanah di timur Yordan dibagi. Musa memohon boleh masuk negeri itu, tetapi Tuhan menolak dan menyuruhnya menguatkan Yosua."],
"Ulangan 4":["Jangan melupakan","Musa mendesak Israel berpegang pada perintah Tuhan, tidak membuat patung, dan mengajarkan semuanya kepada anak cucu. Allah dekat kepada umat-Nya."],
"Ulangan 5":["Sepuluh Firman diulang","Musa mengulang Sepuluh Firman yang diberikan di Horeb dan mengingatkan bagaimana bangsa itu meminta dia menjadi perantara."],
"Ulangan 6":["Shema: dengarlah, hai Israel","\"Dengarlah, hai Israel: TUHAN itu Allah kita, TUHAN itu esa.\" Kasihilah Tuhan dengan segenap hati, dan ajarkan firman-Nya berulang-ulang kepada anak-anak."],
"Ulangan 7":["Umat pilihan","Israel dipilih bukan karena besar jumlahnya, tetapi karena Tuhan mengasihinya. Mereka tidak boleh mengikuti ilah-ilah bangsa lain."],
"Ulangan 8":["Bukan dari roti saja","Allah merendahkan Israel di padang gurun supaya mereka tahu manusia hidup bukan dari roti saja. Jangan lupa Tuhan ketika sudah makmur."],
"Ulangan 9":["Bukan karena kamu benar","Israel menerima negeri itu bukan karena kebenarannya sendiri. Musa mengingatkan anak lembu emas dan doanya bagi bangsa yang tegar tengkuk."],
"Ulangan 10":["Apa yang dituntut Tuhan","Loh batu baru diletakkan dalam tabut. Tuhan menuntut supaya Israel takut akan Dia, mengasihi-Nya, dan mengasihi orang asing."],
"Ulangan 11":["Berkat atau kutuk","Kasihi dan taati Tuhan, tuliskan firman-Nya di hati, ajarkan kepada anak-anak. Di depan mereka ada berkat dan kutuk."],
"Ulangan 12":["Satu tempat ibadah","Israel harus memusnahkan tempat-tempat penyembahan berhala dan beribadah di tempat yang dipilih Tuhan."],
"Ulangan 13":["Waspada terhadap penyesat","Jangan mengikuti nabi atau siapa pun, termasuk keluarga sendiri, yang mengajak menyembah allah lain."],
"Ulangan 14":["Makanan tahir dan persepuluhan","Daftar makanan tahir dan najis. Persepuluhan dipakai juga untuk orang Lewi, orang asing, anak yatim, dan janda."],
"Ulangan 15":["Tahun penghapusan utang","Setiap tujuh tahun utang dihapuskan dan budak Ibrani dibebaskan dengan bekal. Bukalah tangan lebar-lebar bagi saudaramu yang miskin."],
"Ulangan 16":["Tiga hari raya; keadilan","Paskah, hari raya Tujuh Minggu, dan Pondok Daun dirayakan bersama seluruh rumah tangga. Hakim harus adil: \"Semata-mata keadilan harus kaukejar.\""],
"Ulangan 17":["Pengadilan dan raja","Aturan pengadilan dan tentang raja: tidak boleh menumpuk kuda, istri, dan emas, dan harus membaca kitab hukum setiap hari."],
"Ulangan 18":["Imam, larangan sihir, nabi","Bagian para imam dan orang Lewi. Dilarang bertenung dan bertanya kepada arwah. Tuhan akan membangkitkan seorang nabi seperti Musa."],

"Mazmur 1":`<p>${T_G} Menurut catatan New Catholic Bible, Mazmur 1 dan 2 dipandang sebagai kata pengantar seluruh Kitab Mazmur. Orang benar diibaratkan pohon yang tidak layu: seperti pohon di tanah subur, mereka sanggup bertahan menghadapi beratnya hidup.</p>${SRC([["New Catholic Bible, Mzm 1","https://coursebible.com/new-catholic-bible-ncb/psalm-1"]])}`,
"Mazmur 2":`<p>${T_G} Ini mazmur penobatan raja. "Yang diurapi" dalam bahasa Ibrani adalah <i>mashiah</i>, dalam bahasa Yunani <i>christos</i>; dari sinilah kata Mesias dan Kristus. Perjanjian Baru memahaminya tentang Kristus.</p>${SRC([["Catatan Mzm 2","https://bible.usccb.org/bible/psalms/2"]])}`,
"Mazmur 19":`<p>${T_G} Bagian pertama mazmur ini memuji langit sebagai tanda kuasa dan hikmat Penciptanya; bagian kedua memuji hukum Tuhan. Dalam sastra kuno lain matahari dianggap hakim dan pemberi hukum; di mazmur ini matahari hanyalah ciptaan.</p>${SRC([["Catatan Mzm 19","https://bible.usccb.org/bible/ps/19"]])}`,
"Mazmur 104":`<p>${T_R} Menurut <i>Oxford Handbook of the Psalms</i>, Mazmur 104 sering dibandingkan dengan "Himne Agung untuk Aten" dari Mesir, yang ditemukan pada 1884 di sebuah makam di Tell el-Amarna. Para ahli masih membahas hubungan keduanya.</p>${SRC([["Oxford Handbook of the Psalms","https://academic.oup.com/edited-volume/35006/chapter/298739466"]])}`,
"Mazmur 136":`<p>${T_G} Himne ini memuji Allah Israel ("Allah segala allah") yang menciptakan dunia tempat Israel hidup. Setiap ayatnya diulang: "kasih setia-Nya untuk selama-lamanya".</p>${SRC([["Catatan Mzm 136","https://coursebible.com/new-american-bible-revised-edition-nabre/psalm-136"]])}`,
"Amsal 1":`<p>${T_G} seluruh ajaran Amsal berdasar pada prinsip "takut akan Tuhan adalah permulaan pengetahuan" (1:7). "takut akan Tuhan" terutama berarti sikap hati, bukan perasaan takut: rasa hormat yang mendalam kepada Allah disertai ketaatan.</p>${SRC([["Pengantar Amsal","https://press.vatican.va/archive/ENG0839/_PJZ.HTM"],["Catatan Amsal","https://mail.biblehub.com/nabre/proverbs/footnotes.htm"]])}`,
"Lukas 2":`
<h3>👤 SIAPA saja?</h3>
<ul><li>${T_R} <b>Kaisar Agustus</b>: kaisar Romawi pertama, lahir 23 September 63 SM, wafat 19 Agustus 14 M (Britannica).</li>
<li>${T_G} <b>Kirenius</b>: Sulpicius Quirinius menjadi gubernur Siria pada tahun 6–7 M, saat Yudea digabungkan ke provinsi Siria, dan saat itu diadakan sensus di Yudea.</li></ul>
<h3>📅 KAPAN?</h3>
<ul><li>${T_G} Di zaman Agustus, yang pemerintahannya biasanya dihitung 27 SM–14 M.</li><li>Gereja tidak mengajarkan bahwa Kristus lahir pada tahun tertentu (Catholic Answers, mengutip Benediktus XVI).</li></ul>
<div class="note">⚠️ Catatan resmi Gereja sendiri mengakui ada persoalan sejarah soal tanggal sensus di masa Kirenius, dan upaya menyelesaikannya belum berhasil.</div>
<h3>💭 MENGAPA Lukas menyebut Kaisar Agustus?</h3>
<p>${T_G} Bukan kebetulan: juru selamat dan pembawa damai yang sejati adalah anak yang lahir di Betlehem.</p>
<h3>🗣️ Ngobrol yuk</h3><ul><li>Kaisar Agustus punya istana dan tentara, Yesus lahir di tempat makan hewan. Kenapa ya Tuhan memilih cara seperti itu?</li></ul>
${SRC([["Catatan Lukas 2","https://bible.usccb.org/bible/lk/2"],["Augustus (Britannica)","https://www.britannica.com/biography/Augustus-Roman-emperor"],["Catholic Answers","https://www.catholic.com/audio/ddp/the-year-jesus-was-born"]])}`,
"Wahyu 1":`
<h3>👤 SIAPA penulisnya?</h3>
<p>${T_G} penulisnya menyebut diri Yohanes dan dibuang ke Pulau Patmos karena imannya. Sebagian Bapa Gereja menyebutnya Rasul Yohanes, sebagian lain tidak setuju.</p>
<h3>📍 DI MANA?</h3><p>${T_R} Menurut Britannica, di bawah Romawi Patmos menjadi tempat pembuangan, dan menurut tradisi Yohanes dikirim ke sana sekitar tahun 95 M.</p>
<h3>📅 KAPAN?</h3><p>${T_G} Kemungkinan ditulis menjelang akhir pemerintahan Kaisar Domitianus (81–96 M), seorang penganiaya orang Kristen.</p>
<h3>💭 MENGAPA penuh simbol?</h3><p>${T_G} Wahyu ditulis dengan gaya apokaliptik; simbolnya tidak boleh dibaca harfiah. Empat = dunia, enam = ketidaksempurnaan, tujuh = keutuhan, dua belas = suku-suku Israel. Pesannya: harapan dan penghiburan.</p>
${SRC([["Pengantar Wahyu (vatican.va)","https://www.vatican.va/archive/ENG0839/_P12J.HTM"],["Patmos (Britannica)","https://www.britannica.com/place/Patmos"]])}`,
"Keluaran 1":`
<h3>📖 APA arti nama kitab ini?</h3>
<p>${T_G} Nama "Keluaran" (Yunani: <i>Exodus</i>) berasal dari kata Yunani untuk "keberangkatan". Para penerjemah Septuaginta memberi nama itu karena peristiwa utamanya adalah keluarnya Israel dari Mesir.</p>
<h3>👤 SIAPA "Firaun" itu?</h3>
<p>${T_G} "Firaun" adalah gelar semua raja Mesir, bukan nama pribadi. Kitab ini tidak menyebut nama raja mana pun. Ungkapan "raja yang tidak mengenal Yusuf" (1:8) bisa berarti raja itu tidak mau tahu jasa-jasa Yusuf.</p>
<h3>💭 MENGAPA para bidan berani?</h3>
<p>${T_G} Teksnya sendiri memberi alasan: mereka takut akan Allah (1:17), lebih dari takut kepada raja.</p>
<h3>📅 KAPAN?</h3><p class="empty">Kitab Keluaran tidak menyebut nama raja Mesir, jadi tahun peristiwanya tidak bisa dipastikan dari teks. Para ahli berbeda pendapat.</p>
${SRC([["Pengantar Keluaran","https://mail.biblehub.com/nabre/exodus/intro.htm"],["Catatan Kel 1","https://bible.usccb.org/bible/exodus/1"]])}`,
"Keluaran 3":`
<h3>📍 DI MANA?</h3>
<p>${T_G} Nama "Horeb" mungkin berarti "kering" atau "tandus". Menurut tradisi, Horeb adalah nama lain gunung Sinai, tetapi belum pasti apakah kedua nama itu sejak awal menunjuk gunung yang sama. Semak (<i>seneh</i>) itu mungkin semak berduri.</p>
<h3>👤 SIAPA yang menampakkan diri?</h3>
<p>${T_G} "Malaikat" dalam bahasa Ibrani adalah <i>mal'ak</i>, artinya "utusan". Ucapan Musa "Siapakah aku ini?" (3:11) adalah ungkapan yang biasa dipakai orang rendah kepada atasannya.</p>
<h3>💭 APA arti "AKU ADALAH AKU"?</h3>
<p>${T_G} Nama ini menunjukkan hubungan antara nama Allah, YHWH, dan akar kata Ibrani <i>h-y-h</i>, "ada". Karena hormat, orang Yahudi kemudian tidak mengucapkan nama itu dan menggantinya dengan <i>Adonai</i> ("Tuhan"). Septuaginta menerjemahkannya "Akulah Dia yang ada". Bentuk "Yehova" muncul dari salah baca.</p>
${SRC([["Catatan Kel 3","https://bible.usccb.org/bible/exodus/3"]])}`,
"Keluaran 12":`
<h3>💭 MENGAPA kisahnya seperti terputus?</h3>
<p>${T_G} Bagian 12:1–20 berisi aturan Paskah yang ditambahkan kemudian, sehingga menyela alur cerita.</p>
<h3>✝️ APA hubungannya dengan Yesus?</h3>
<p>${T_G} Perintah "tulang-tulangnya tidak boleh dipatahkan" (12:46) dikutip di Yohanes 19:36 tentang Yesus di salib. Anak domba Paskah dipandang sebagai gambaran Kristus.</p>
${SRC([["Catatan Kel 12","https://bible.usccb.org/bible/exodus/12"],["Yoh 19","https://bible.usccb.org/bible/john/19"]])}`,
"Keluaran 15":`
<h3>📍 DI MANA laut itu?</h3>
<p>${T_G} "Laut Teberau" (dalam terjemahan lain "Laut Merah") berasal dari kata Ibrani <i>yam suph</i>, yang sebenarnya berarti "Laut Teberau" atau "laut alang-alang". Lokasinya tidak pasti. Melihat rute Israel ke Sinai, kemungkinan bukan Laut Merah yang terlalu jauh di selatan, melainkan perairan yang lebih kecil.</p>
<h3>🎵 APA istimewanya nyanyian ini?</h3>
<p>${T_G} Banyak ahli menganggap puisi ini salah satu karya tertua dalam Alkitab, yang dulunya berdiri sendiri. Seruan Miryam (15:21) mengulang baris pertama nyanyian itu dan mungkin dinyanyikan sebagai antifon (jawaban) sesudah setiap bait.</p>
<p>${T_G} Kata "kasih setia" (15:13) adalah <i>hesed</i> dalam bahasa Ibrani: kasih, kebaikan, kesetiaan yang lahir dari hubungan perjanjian.</p>
${SRC([["Catatan Kel 15","https://bible.usccb.org/bible/exodus/15"]])}`,
"Keluaran 16":`
<h3>🍞 APA manna itu?</h3>
<p>${T_G} Nama "manna" dijelaskan dari pertanyaan orang Israel, <i>man hu</i>, "apakah ini?" (16:15). Catatan lama New American Bible menyebut manna mungkin mirip zat alami yang masih ditemukan di Sinai, tetapi setidaknya sebagian bersifat mukjizat. Perbandingan dengan ketumbar hanya soal ukuran dan bentuknya.</p>
<h3>✝️ APA hubungannya dengan kita?</h3>
<p>${T_G} Tradisi Kristen memandang manna sebagai gambaran Ekaristi (lihat Yohanes 6). Paulus mengutip 16:18 untuk mengajarkan berbagi secara adil (2 Korintus 8:15).</p>
<h3>📏 BERAPA banyak?</h3>
<p>${T_G} Satu gomer kira-kira dua quart, sekitar dua liter.</p>
${SRC([["Catatan Kel 16","https://bible.usccb.org/bible/exodus/16"],["New American Bible (vatican.va)","https://www.vatican.va/archive/ENG0839/_INDEX.HTM"]])}`,
"Keluaran 20":`
<h3>🔢 BAGAIMANA menghitung sepuluh firman?</h3>
<p>${T_G} Pembagian perintah-perintah ini menjadi tepat "sepuluh" agak tidak pasti, karena teksnya sendiri tidak memberi nomor. Secara tradisional di kalangan Katolik, 20:1–6 dihitung sebagai satu perintah dan 20:17 sebagai dua.</p>
<p>${T_G} Katekismus Gereja Katolik (no. 2066) menjelaskan bahwa pembagian dan penomoran perintah berbeda-beda dalam sejarah; Gereja Katolik mengikuti pembagian dari Santo Agustinus.</p>
<h3>📍 DI MANA lagi muncul?</h3>
<p>${T_G} Sepuluh Firman muncul dua kali dalam Alkitab: Keluaran 20 dan Ulangan 5, dengan sedikit perbedaan.</p>
${SRC([["Catatan Kel 20","https://bible.usccb.org/bible/exodus/20"],["Catatan NAB lama","https://www.vatican.va/archive/ENG0839/_P21.HTM"],["Katekismus (vatican.va)","https://www.vatican.va/archive/ENG0015/_INDEX.HTM"]])}`,
"Keluaran 21":`
<h3>📜 APA ini?</h3>
<p>${T_G} Kumpulan hukum 20:22–23:33 disebut "kitab perjanjian" (24:7). Lebih dari separuh hukum sipil dan keagamaannya punya kemiripan dengan hukum-hukum berhuruf paku dari Timur Dekat kuno.</p>
<h3>💭 MENGAPA ada aturan budak?</h3>
<p>${T_G} Orang Israel bisa menjadi budak sesamanya untuk membayar utang. Aturan ini memberi batas waktu dan berusaha mengurangi kejahatan perbudakan, walaupun perbudakan sendiri belum dikecam dalam Perjanjian Lama.</p>
<h3>⚖️ BAGAIMANA dengan "mata ganti mata"?</h3>
<p>${T_G} Di sini hukum pembalasan setimpal (talion) dipakai untuk kasus tertentu: seorang perempuan hamil yang tidak bersalah terluka oleh dua orang yang berkelahi. Masih diperdebatkan apakah hukum ini pernah diterapkan secara harfiah di Israel. Yesus mengajak mencari keadilan yang lebih dalam (Matius 5:38–40).</p>
${SRC([["Catatan Kel 21","https://bible.usccb.org/bible/exodus/21"],["Catatan Kel 21:22–25","https://bible.usccb.org/bible/ex/21"]])}`,
"Keluaran 25":`
<h3>📏 BERAPA besar tabut itu?</h3>
<p>${T_G} Satu hasta adalah jarak dari siku sampai ujung jari tengah, sekitar 45 cm. Jadi tabut kira-kira 1,1 m panjangnya, 0,7 m lebarnya, dan 0,7 m tingginya.</p>
<h3>🪽 APA itu tutup pendamaian dan kerub?</h3>
<p>${T_G} Kata Ibrani untuk tutup itu, <i>kapporet</i>, dikaitkan dengan <i>kippur</i>, seperti dalam Yom Kippur (Hari Pendamaian). Kerub-kerub mungkin berbentuk singa bersayap berkepala manusia; bersama tabut, mereka menjadi takhta bagi Tuhan yang tidak kelihatan (bdk. Mazmur 80:2).</p>
<h3>🕎 Ada yang masih ada sampai sekarang?</h3>
<p>${T_G} Kandil bercabang tujuh (menorah) masih dipakai dalam liturgi Yahudi sampai sekarang. Meja emas di Bait Allah zaman Herodes terpahat pada Gapura Titus di Roma.</p>
${SRC([["Catatan Kel 25","https://bible.usccb.org/bible/ex/25"],["Catatan Kel 25 (lanjutan)","https://bible.usccb.org/bible/exodus/25"]])}`,
"Keluaran 32":`
<h3>🐂 APA sebenarnya anak lembu emas itu?</h3>
<p>${T_G} Tampaknya anak lembu emas itu dimaksudkan sebagai gambaran Tuhan sendiri, bukan allah lain. Kekuatan Tuhan dilambangkan dengan kekuatan seekor lembu jantan muda. Karena itu Harun berkata, "Besok hari raya bagi TUHAN" (32:5).</p>
<h3>📅 KAPAN kisah ini terulang?</h3>
<p>${T_G} Pada abad kesepuluh SM, raja Yerobeam membuat anak lembu emas di Betel dan Dan, mungkin sebagai takhta bagi Tuhan seperti tabut di Yerusalem (1 Raja-raja 12:27–30).</p>
${SRC([["Catatan Kel 32","https://bible.usccb.org/bible/Exodus/32"],["Catatan Kel 32 (Yerobeam)","https://bible.usccb.org/bible/exodus/32:32"]])}`,
"Keluaran 34":`
<h3>✨ MENGAPA Musa sering digambar bertanduk?</h3>
<p>${T_G} Kata Ibrani untuk "bercahaya" dieja sama dengan kata "tanduk". Dari situ muncul tradisi seni yang menggambarkan Musa bertanduk.</p>
<p>${T_R} Vulgata, terjemahan Latin oleh Santo Hieronimus, menerjemahkannya <i>cornuta</i> ("bertanduk"). Terjemahan inilah yang memengaruhi seni Barat, termasuk patung Musa karya Michelangelo. Septuaginta (Yunani) memakai kata "dimuliakan", dan Paulus berbicara tentang "kemuliaan" wajah Musa (2 Korintus 3:7).</p>
${SRC([["Catatan Kel 34","https://bible.usccb.org/bible/exodus/34"],["Aleteia","https://it-front.aleteia.org/2021/08/23/the-reason-why-michelangelos-moses-has-horns"],["Biblical Archaeology Society","https://library.biblicalarchaeology.org/department/epistles-the-horns-of-moses/"]])}`,
"Imamat 1":`
<h3>📖 APA arti nama kitab ini?</h3>
<p>${T_G} Nama "Imamat" (Yunani: <i>Leviticus</i>) diberikan oleh para penerjemah Yunani karena sebagian besar isinya berkaitan dengan para imam dari suku Lewi.</p>
<h3>💭 MENGAPA banyak sekali aturan?</h3>
<p>${T_G} Kitab ini membahas ibadah (korban, kekudusan, imamat, hari raya), tetapi juga soal perilaku, etika, dan ekonomi. Aturan-aturan itu bukan sekadar undang-undang; bersama-sama mereka membentuk cara hidup. Gagasan pokoknya adalah perintah yang terus diulang: "Kuduslah kamu, sebab Aku, TUHAN, kudus."</p>
<h3>🗂️ BAGAIMANA susunannya?</h3>
<p>${T_G} I. Aturan korban (1–7); II. Penahbisan imam (8–10); III. Hukum kemurnian (11–16); IV. Hukum kekudusan (17–26); V. Penebusan persembahan (27).</p>
${SRC([["Pengantar Imamat","https://biblehub.com/nabre/leviticus/intro.htm"],["Pengantar Imamat NAB lama (vatican.va)","https://www.vatican.va/archive/ENG0839/_P2M.HTM"]])}`,
"Imamat 16":`
<h3>💭 APA arti "mengadakan pendamaian"?</h3>
<p>${T_G} Kata kerja Ibrani <i>kipper</i> secara khusus berarti menghapus dosa dan kenajisan, sehingga juga bisa diterjemahkan "membersihkan". Dari kata yang sama berasal nama Yom Kippur.</p>
<h3>👤 SIAPA Azazel?</h3>
<p>${T_G} Azazel (16:8) adalah nama untuk roh jahat; artinya kira-kira "dewa yang marah/garang". Kambing itu dilepas ke padang gurun, seolah membawa pergi kesalahan umat.</p>
<h3>✝️ APA hubungannya dengan Yesus?</h3>
<p>${T_G} Catatan silang Gereja menghubungkan 16:22 dengan Yesaya 53:11–12, Yohanes 1:29 ("Anak domba Allah yang menghapus dosa dunia"), dan 1 Petrus 2:24.</p>
${SRC([["Catatan Im 16","https://bible.usccb.org/bible/leviticus/16"],["Catatan Im 16:6 dan silang","https://coursebible.com/new-american-bible-revised-edition-nabre/leviticus-16"]])}`,
"Imamat 19":`
<h3>✝️ APA hubungannya dengan Yesus?</h3>
<p>${T_G} "Kasihilah sesamamu manusia seperti dirimu sendiri" (19:18) dikutip Yesus sebagai hukum terutama yang kedua, sesudah mengasihi Allah (Matius 22:39; Markus 12:31).</p>
${SRC([["Mat 22","https://bible.usccb.org/bible/matthew/22"],["Mrk 12","https://bible.usccb.org/bible/mark/12"]])}`,
"Bilangan 1":`
<h3>📖 APA arti nama kitab ini?</h3>
<p>${T_G} Kitab Bilangan mendapat namanya dari dua sensus (penghitungan) bangsa Israel: satu di awal (pasal 1) dan satu menjelang akhir perjalanan di padang gurun (pasal 26).</p>
<p>${T_R} Nama Ibraninya <i>Bemidbar</i>, "di padang gurun", diambil dari kata-kata awal kitab ini.</p>
<h3>🗂️ BAGAIMANA susunannya?</h3>
<p>${T_G} I. Sensus dan persiapan berangkat dari Sinai (1:1–10:10); II. Keberangkatan, pemberontakan, dan pengembaraan empat puluh tahun (10:11–25:18); III. Persiapan memasuki negeri yang dijanjikan (pasal 26–36).</p>
${SRC([["Pengantar Bilangan","https://bible.usccb.org/bible/Numbers/0"],["Bemidbar (Sefaria)","https://prod.sefaria.org.il/The_Torah%3B_A_Women's_Commentary%2C_Parashah_Introductions%2C_Bamidbar"]])}`,
"Bilangan 21":`
<h3>✝️ APA hubungannya dengan Yesus?</h3>
<p>${T_G} Yesus sendiri memakai kisah ular tembaga: "Sama seperti Musa meninggikan ular di padang gurun, demikian juga Anak Manusia harus ditinggikan" (Yohanes 3:14–15).</p>
${SRC([["Yoh 3","https://bible.usccb.org/bible/john/3"]])}`,
"Bilangan 22":`
<h3>👤 SIAPA Bileam?</h3>
<p>${T_G} Bileam bukan orang Israel; ia dipanggil Balak, raja Moab, untuk mengutuk Israel.</p>
<p>${T_R} Pada 1967, penggalian di Deir 'Alla, Yordania, menemukan 119 kepingan plester bertuliskan tinta hitam dan merah. Teks itu menceritakan penglihatan "Bileam bin Beor, seorang pelihat para dewa" yang didatangi para dewa pada malam hari. Teks ini diperkirakan dari abad ke-9 sampai ke-8 SM dan kini disimpan di Museum Arkeologi Yordania, Amman.</p>
<p>${T_R} Para ahli mencatat bahwa teks ini dan kisah di Bilangan sama-sama memuat tradisi tentang Bileam yang dikenal di Israel dan di daerah seberang Yordan, walaupun gambaran Bileam di kedua teks itu berbeda.</p>
${SRC([["Deir 'Alla (Center for Online Judaic Studies)","https://cojs.org/deir-alla_inscription-_750-700_bce/"],["Jordan Times","https://jordantimes.com/node/374324"],["Prasasti Deir 'Alla","https://en.wikipedia.org/wiki/Deir_Alla_inscription"]])}`,
"Ulangan 1":`
<h3>📖 APA arti nama kitab ini?</h3>
<p>${T_G} Nama "Ulangan" (Yunani: <i>Deuteronomion</i>) berasal dari Septuaginta untuk 17:18, "salinan hukum". Nama itu cocok karena kitab ini mengulang banyak isi hukum dari kitab-kitab sebelumnya, seperti "hukum kedua".</p>
<h3>🗣️ BAGAIMANA bentuknya?</h3>
<p>${T_G} Kitab ini terdiri dari tiga pidato panjang Musa. Masing-masing berisi cerita, hukum, dan nasihat, sehingga nadanya mendesak, seperti soal hidup dan mati.</p>
<h3>📅 KAPAN?</h3>
<p>${T_G} Kitab ini berhubungan dengan "kitab Taurat" yang ditemukan di Bait Allah Yerusalem sekitar tahun 622 SM pada zaman raja Yosia (2 Raja-raja 22:8–13). Ada tanda-tanda penyuntingan kemudian, misalnya rujukan tentang pembuangan (4:1–40; 28:63–68; 30:1–10).</p>
${SRC([["Pengantar Ulangan","https://bible.usccb.org/bible/deuteronomy/0"],["Ulangan (Britannica)","https://www.britannica.com/topic/biblical-literature/Deuteronomy-Introductory-discourse"]])}`,
"Ulangan 6":`
<h3>✝️ APA hubungannya dengan Yesus?</h3>
<p>${T_G} Ketika ditanya hukum mana yang paling utama, Yesus mengutip ayat ini: "Dengarlah, hai Israel, Tuhan Allah kita, Tuhan itu esa. Kasihilah Tuhan, Allahmu, dengan segenap hatimu..." (Markus 12:29–30). Saat dicobai di padang gurun, Yesus juga mengutip 6:13 dan 6:16 (Matius 4:7, 10).</p>
${SRC([["Mrk 12","https://bible.usccb.org/bible/mark/12"],["Mat 4","https://bible.usccb.org/bible/matthew/4"]])}`,
"Ulangan 8":`
<h3>✝️ APA hubungannya dengan Yesus?</h3>
<p>${T_G} "Manusia hidup bukan dari roti saja" (8:3) adalah jawaban Yesus kepada iblis di padang gurun (Matius 4:4).</p>
${SRC([["Mat 4","https://bible.usccb.org/bible/matthew/4"]])}`,
"Yosua 1":`
<h3>📖 APA isi kitab ini?</h3>
<p>${T_G} Kitab Yosua menceritakan bagaimana Israel menduduki tanah Kanaan. Yosua digambarkan sebagai penerus Musa, dan "penaklukan" itu disajikan sebagai kelanjutan keluaran dari Mesir.</p>
<h3>💭 Apakah semuanya terjadi secepat itu?</h3>
<p>${T_G} Bila dibandingkan dengan Hakim-hakim pasal 1, tampak bahwa Israel menjadi kekuatan utama di negeri itu secara perlahan dan sedikit demi sedikit, tidak sekaligus. Kitab Yosua menyajikan gambaran yang sangat diidealkan, sebagai pelajaran iman tentang apa yang harus dilakukan supaya tidak kehilangan negeri itu.</p>
<p>${T_R} Kitab Yosua sendiri mengakui ada penduduk yang tidak dihalau (misalnya 15:63; 16:10; 17:12–13), dan bukti arkeologi juga menunjukkan penduduk asli tidak dimusnahkan.</p>
<h3>🗂️ BAGAIMANA susunannya?</h3>
<p>${T_G} I. Penaklukan Kanaan (1–12); II. Pembagian tanah (13–21); III. Kembalinya suku-suku timur Yordan dan perpisahan Yosua (22–24).</p>
${SRC([["Pengantar Yosua","https://biblehub.com/nabre/joshua/intro.htm"],["Enter the Bible (Luther Seminary)","https://enterthebible.org/courses/joshua/lessons/introductory-issues-in-joshua"]])}`,
"Yosua 10":`
<h3>📜 APA itu Kitab Orang Jujur?</h3>
<p>${T_R} Kitab Orang Jujur (<i>Sefer haYashar</i>) yang disebut di 10:13 adalah sumber kuno yang kini sudah hilang. Kitab Yosua mengutipnya untuk kisah matahari yang berhenti.</p>
${SRC([["Enter the Bible (Luther Seminary)","https://enterthebible.org/courses/joshua/lessons/introductory-issues-in-joshua"]])}`

/* ===== Renungan harian (kata-kata kami, berpijak pada ayat yang dirujuk) ===== */
const RENUNGAN = {
1:{anak:{r:["Pernah merasa dirimu biasa-biasa aja dibanding teman? Kejadian 1 bercerita Allah menciptakan segalanya: terang, langit, laut, tumbuhan, binatang. Setiap kali selesai, Allah melihat semuanya baik. Tapi waktu sampai pada manusia, ada yang beda: manusia diciptakan menurut gambar Allah (1:27), dan sesudah itu semuanya disebut \"sungguh amat baik\" (1:31).","Artinya, nilaimu bukan ditentukan nilai rapor, merek sepatu, atau jumlah likes. Nilaimu sudah ditentukan Allah sejak awal. Teman yang sering diejek di kelas juga sama berharganya di mata Allah.","Di Kejadian 3, manusia memilih tidak taat. Setelah salah, mereka malu dan bersembunyi (3:8–10). Tapi Allah tidak meninggalkan mereka; Ia datang dan memanggil: \"Di manakah engkau?\" Lalu lihat apa yang terjadi: Adam menyalahkan perempuan, perempuan menyalahkan ular (3:12–13). Kedengarannya familiar, kan? Kita juga sering begitu kalau ketahuan salah."],
 tanya:["Apa yang biasanya bikin kamu merasa berharga atau tidak berharga?","Kenapa ya kita suka menyalahkan orang lain saat ketahuan salah?","Allah tetap mencari manusia yang bersembunyi. Apa artinya buat kamu waktu kamu berbuat salah?"],
 aksi:"Sebelum tidur, akui satu kesalahanmu hari ini ke orang tua tanpa menyalahkan siapa pun. Lalu ucapkan satu pujian tulus untuk saudara atau temanmu."},
 ortu:{r:["Kejadian 1:27 menegaskan bahwa setiap anak kita diciptakan menurut gambar Allah. Anak bukan proyek untuk dibentuk sesuai ambisi kita, tetapi pribadi yang sudah berharga sebelum ia berprestasi apa pun. Di tengah tekanan nilai, les, dan perbandingan dengan anak orang lain, ayat ini mengingatkan dari mana harga diri anak berasal.","Kejadian 2:18 juga berbicara tentang kita sebagai pasangan: tidak baik manusia seorang diri, maka Allah menjadikan penolong yang sepadan. Rumah tangga dirancang sebagai kerja sama, bukan persaingan siapa yang paling benar atau paling capek.","Kejadian 3 memperlihatkan pola yang sering terulang di rumah: saat masalah muncul, Adam menyalahkan istrinya, dan istrinya menyalahkan ular (3:12–13). Anak-anak belajar menghadapi kesalahan bukan dari nasihat kita, tetapi dari melihat bagaimana kita bertengkar dan berbaikan. Allah sendiri memberi teladan: Ia datang mencari manusia yang bersembunyi (3:9). Begitu pula seharusnya kita mendekati anak yang berbuat salah: mencari dan memanggil, bukan langsung menghukum."],
 tanya:["Apakah anak-anak merasa dicintai karena siapa mereka, atau karena prestasi mereka?","Saat anak mengaku salah, reaksi pertama kita biasanya apa?","Pola saling menyalahkan apa yang mungkin dilihat anak-anak dari kita berdua?"],
 aksi:"Hari ini, katakan kepada setiap anak satu hal yang kamu syukuri tentang dirinya, bukan tentang prestasinya. Kalau ada gesekan dengan pasangan, ganti \"kamu sih…\" dengan \"aku merasa…\"."}},
2:{anak:{r:["Kain dan Habel adalah kakak-adik, anak-anak Adam dan Hawa (Kejadian 4:1–2). Waktu persembahan Habel diterima dan persembahan Kain tidak, Kain jadi panas hati dan mukanya muram (4:5). Kamu pernah merasa begitu? Waktu saudara atau teman dipuji, kita malah kesal.","Allah tidak diam saja. Ia mengingatkan Kain bahwa dosa sedang mengintip di depan pintu, dan Kain harus menguasainya (4:7). Rasa iri itu wajar muncul, tapi kita yang memutuskan mau dituruti atau tidak. Sayangnya, Kain membiarkan iri itu tumbuh sampai ia membunuh adiknya.","Waktu ditanya di mana Habel, Kain menjawab, \"Apakah aku penjaga adikku?\" (4:9). Sebenarnya, jawabannya iya. Kita memang dipanggil untuk saling menjaga, bukan saling menjatuhkan. Di pasal 5 ada Henokh, yang hidup bergaul dengan Allah (5:24), dan di pasal 6 ada Nuh yang juga hidup bergaul dengan Allah di tengah dunia yang makin jahat (6:9). Ternyata kita bisa memilih jalan yang berbeda dari orang-orang di sekitar kita."],
 tanya:["Kapan terakhir kali kamu merasa iri? Kepada siapa, dan kenapa?","Apa yang bisa kamu lakukan saat rasa iri mulai muncul, sebelum jadi marah?","Menurutmu, apa artinya \"menjaga\" saudaramu?"],
 aksi:"Lakukan satu hal baik untuk saudaramu hari ini tanpa disuruh, misalnya membantu tugasnya, meminjamkan barang, atau mengucapkan selamat atas keberhasilannya."},
 ortu:{r:["Kisah Kain dan Habel adalah kisah persaingan saudara kandung pertama di Alkitab. Hampir semua orang tua dengan lebih dari satu anak tahu rasanya menengahi pertengkaran yang dipicu rasa iri. Kejadian 4:7 memberi bahasa yang bagus untuk mengajari anak: perasaan iri itu \"mengintip di depan pintu\", dan kita bisa belajar menguasainya.","Ayat yang sama juga untuk kita. Kemarahan yang dibiarkan, baik terhadap pasangan, anak, maupun keadaan, seperti tamu yang menunggu di depan pintu; makin lama makin berani masuk. Kain tidak meledak dalam sehari. Kekesalannya tumbuh, dibiarkan, lalu berbuah kekerasan.","Di pasal 5 dan 6 ada dua tokoh yang menonjol: Henokh (5:24) dan Nuh (6:9), satu-satunya yang disebut \"hidup bergaul dengan Allah\". Di tengah generasi yang makin rusak, mereka berbeda. Anak-anak kita tumbuh di dunia yang juga penuh tekanan. Teladan iman yang paling kuat bagi mereka adalah melihat orang tuanya sendiri bergaul dengan Allah setiap hari."],
 tanya:["Bagaimana selama ini kita menanggapi pertengkaran anak-anak: mencari siapa yang salah, atau membantu mereka mengenali perasaannya?","Kemarahan apa yang sedang \"menunggu di depan pintu\" dalam diri kita?","Apa yang dilihat anak-anak tentang hubungan kita dengan Tuhan?"],
 aksi:"Saat anak bertengkar berikutnya, tanyakan dulu \"kamu merasa apa?\" sebelum memutuskan siapa yang salah. Malam ini, luangkan 10 menit untuk berdoa bersama sebagai keluarga."}},
3:{anak:{r:["Bayangkan disuruh membuat kapal raksasa padahal belum ada tanda-tanda hujan, dan semua orang di sekitarmu hidup seenaknya. Kejadian 7:5 mencatat Nuh melakukan semuanya sesuai perintah Tuhan. Taat waktu orang lain tidak taat itu berat, tapi Nuh tetap melakukannya.","Air bah datang lama sekali. Tapi di Kejadian 8:1 ada kalimat pendek yang kuat: Allah mengingat Nuh. Waktu kamu merasa sendirian karena memilih yang benar, misalnya tidak ikut menyontek atau tidak ikut mengejek teman, Allah juga ingat kamu.","Setelah air surut, Allah membuat janji dan menaruh pelangi sebagai tandanya (9:13). Pelangi itu seperti \"pengingat janji\" dari Allah. Lalu ada cerita yang agak aneh: Nuh mabuk, dan anaknya Ham malah menceritakan keadaan ayahnya, sementara Sem dan Yafet menutupi ayah mereka dengan hormat (9:20–23). Ada cara menghormati orang tua bahkan saat mereka sedang tidak sempurna."],
 tanya:["Pernah memilih yang benar padahal teman-teman memilih yang lain? Rasanya gimana?","Apa artinya buatmu bahwa Allah \"mengingat\" kamu?","Gimana cara menghormati orang tua atau guru, bahkan saat mereka melakukan kesalahan?"],
 aksi:"Pilih satu hal benar yang akan kamu lakukan minggu ini walaupun teman-temanmu tidak melakukannya. Setiap kali lihat pelangi, ucapkan terima kasih atas janji Allah."},
 ortu:{r:["Nuh membangun bahtera bersama keluarganya, dan seluruh keluarganya masuk ke dalamnya (7:7). Iman Nuh berdampak bagi istri, anak-anak, dan menantu-menantunya. Keputusan iman orang tua, kecil maupun besar, selalu ikut membawa anak-anak.","Ada adegan yang sering terlewat di Kejadian 9:20–23. Saat Nuh mabuk dan telanjang, Ham melihat lalu menceritakannya kepada saudara-saudaranya, sedangkan Sem dan Yafet berjalan mundur untuk menutupi ayah mereka. Dalam keluarga, kita mengenal kelemahan satu sama lain lebih dari siapa pun. Pilihannya: mengumbar, atau menutupi dengan hormat.","Ini berlaku untuk pasangan, dan juga untuk anak. Kelemahan anak bukan bahan cerita di grup WhatsApp keluarga atau unggahan media sosial. Kita juga bisa mengajari anak bagaimana menghormati orang tua tanpa harus berpura-pura orang tuanya sempurna."],
 tanya:["Keputusan iman apa yang ingin kita ambil sebagai keluarga tahun ini?","Pernahkah kita, tanpa sadar, menceritakan kelemahan pasangan atau anak kepada orang lain?","Bagaimana cara kita meminta maaf kepada anak saat kita sendiri yang salah?"],
 aksi:"Minggu ini, bicarakan hanya hal baik tentang pasangan dan anak di depan orang lain. Kalau kamu salah kepada anak, minta maaf secara langsung kepadanya."}},
4:{anak:{r:["Kejadian 10 berisi daftar bangsa-bangsa dari keturunan anak-anak Nuh. Semua bangsa itu berasal dari satu keluarga. Jadi teman yang beda suku, beda bahasa, atau beda warna kulit sebenarnya \"satu keluarga besar\" dengan kita.","Di Kejadian 11, orang-orang di Babel membangun menara yang puncaknya sampai ke langit, karena ingin \"mencari nama\" (11:4), ingin terkenal. Tuhan lalu mengacaukan bahasa mereka sehingga mereka tidak bisa melanjutkan pembangunan. Ingin dikenal itu wajar, tapi kalau tujuannya cuma pamer, biasanya berakhir berantakan.","Satu pasal kemudian, Allah memanggil Abram untuk pergi dari negerinya ke tempat yang belum ia kenal. Justru Allah yang berjanji akan membuat nama Abram masyhur dan menjadikannya berkat (12:2). Bedanya: orang Babel mengejar ketenaran untuk diri sendiri, Abram percaya dan taat, lalu Allah yang mengangkatnya."],
 tanya:["Pernah ingin terkenal atau viral? Untuk apa?","Apa bedanya ingin terkenal dengan ingin jadi berkat buat orang lain?","Kalau semua bangsa satu keluarga, gimana seharusnya kita memperlakukan teman yang berbeda?"],
 aksi:"Lakukan satu kebaikan hari ini yang tidak dilihat atau diketahui siapa pun, dan jangan diceritakan ke siapa-siapa."},
 ortu:{r:["Abram dan Sarai meninggalkan tanah kelahiran mereka bersama (Kejadian 12:4–5). Panggilan Tuhan sering membawa keluarga keluar dari zona nyaman: pindah kota, ganti pekerjaan, atau mengubah cara hidup. Langkah iman seperti itu lebih kuat bila diambil berdua.","Tapi di Mesir, karena takut, Abram meminta Sarai mengaku sebagai adiknya (12:11–13). Catatan resmi Gereja menegaskan teks ini tidak membenarkan tipu daya Abraham. Rasa takut bisa membuat kita melindungi diri sendiri dengan mengorbankan orang yang paling dekat.","Bagi orang tua, kisah menara Babel (11:4) juga patut direnungkan. Seberapa sering kita membangun \"menara\" berupa prestasi anak, rumah, atau status, demi nama kita sendiri? Allah memanggil Abram bukan untuk menjadi terkenal, tetapi supaya menjadi berkat bagi semua kaum di bumi (12:3)."],
 tanya:["Dalam situasi apa kita cenderung menyelamatkan diri sendiri dulu, bukan pasangan atau anak?","\"Menara\" apa yang sedang kita bangun demi nama kita sendiri?","Bagaimana keluarga kita bisa menjadi berkat bagi orang lain?"],
 aksi:"Tanyakan kepada pasangan: \"Kapan kamu merasa paling tidak kulindungi?\" lalu dengarkan tanpa membela diri. Pilih satu cara keluarga kalian bisa menjadi berkat bagi orang lain bulan ini."}},
5:{anak:{r:["Abram dan keponakannya, Lot, punya ternak yang sangat banyak sampai para gembala mereka bertengkar. Di Kejadian 13:8–9, Abram yang lebih tua dan lebih berhak justru mempersilakan Lot memilih duluan, supaya tidak ada perkelahian. Lot memilih tanah yang kelihatan paling subur.","Mengalah bukan berarti kalah. Abram tahu bahwa hubungan baik lebih penting daripada menang. Dan setelah itu, Tuhan sendiri berjanji memberikan seluruh negeri itu kepada keturunan Abram (13:14–15).","Di Kejadian 15, Allah mengajak Abram keluar malam-malam dan berkata: coba hitung bintang-bintang, sebanyak itulah keturunanmu nanti (15:5). Padahal Abram belum punya anak sama sekali! Tapi Abram percaya (15:6). Percaya itu artinya tetap berpegang pada janji Allah walaupun hasilnya belum kelihatan."],
 tanya:["Kapan terakhir kali kamu mengalah supaya tidak bertengkar? Rasanya gimana?","Kenapa mengalah kadang terasa berat?","Hal apa yang sedang kamu tunggu dan doakan?"],
 aksi:"Kalau hari ini ada rebutan dengan saudara atau teman, coba mengalah duluan. Malam ini lihat langit, lalu ceritakan ke Tuhan satu hal yang sedang kamu tunggu."},
 ortu:{r:["Kejadian 13 memperlihatkan kedewasaan Abram dalam konflik keluarga. Ia tidak memaksakan haknya sebagai yang lebih tua, tetapi mendahulukan perdamaian (13:8–9). Anak-anak yang sering bertengkar butuh melihat contoh seperti ini dari orang tuanya, termasuk dalam hubungan dengan mertua, ipar, dan saudara.","Kejadian 15:6 mencatat Abram percaya kepada Tuhan, padahal sudah bertahun-tahun menunggu anak dan belum ada tanda apa-apa. Banyak keluarga juga sedang menunggu sesuatu: anak, rumah, pekerjaan, kesembuhan, atau anak yang kembali ke jalan yang benar.","Percaya bukan berarti tidak bertanya. Abram sendiri jujur bertanya kepada Tuhan (15:2–3). Tapi ia tetap memilih percaya. Saat anak melihat orang tuanya tetap berdoa di tengah penantian, mereka belajar bahwa iman bukan hanya untuk saat semuanya lancar."],
 tanya:["Konflik keluarga besar apa yang mungkin perlu kita selesaikan dengan sikap seperti Abram?","Apa yang sedang kita tunggu sebagai keluarga? Apakah kita masih membicarakannya dengan Tuhan?","Apakah anak-anak tahu apa yang sedang kita doakan?"],
 aksi:"Ceritakan kepada anak-anak satu hal yang sedang kalian doakan sebagai orang tua, lalu doakan bersama. Tulis doa itu dan simpan untuk dibaca lagi nanti."}},
6:{anak:{r:["Hagar adalah seorang hamba perempuan yang diperlakukan dengan keras, lalu kabur ke padang gurun sendirian (Kejadian 16:6). Bayangkan rasanya: sendirian, takut, dan merasa tidak ada yang peduli.","Tapi di padang gurun itu, malaikat Tuhan menemuinya. Hagar lalu menyebut Tuhan \"El-Roi\", yang artinya Allah yang melihat (16:13). Waktu kamu merasa tidak dianggap, tidak dilihat, atau sendirian, Allah tetap melihatmu.","Di pasal 17, Allah mengganti nama Abram menjadi Abraham dan Sarai menjadi Sara, tanda janji baru. Di pasal 18, tiga tamu datang dan berkata Sara akan punya anak. Sara tertawa karena merasa sudah terlalu tua. Lalu Tuhan bertanya: adakah sesuatu yang mustahil untuk Tuhan? (18:14)."],
 tanya:["Pernah merasa tidak dilihat atau tidak dianggap? Apa yang membantumu waktu itu?","Apa artinya buatmu bahwa Allah adalah \"Allah yang melihat\"?","Hal apa yang menurutmu mustahil, tapi ingin kamu serahkan ke Tuhan?"],
 aksi:"Perhatikan satu teman yang sering sendirian di sekolah, lalu sapa atau ajak dia bergabung."},
 ortu:{r:["Di Kejadian 16, Sarai punya rencana sendiri untuk \"membantu\" janji Tuhan, dan Abram mengikutinya tanpa banyak pertimbangan. Hasilnya: konflik, kecemburuan, dan saling menyalahkan (16:5). Keputusan yang terburu-buru, tanpa membawanya dulu kepada Tuhan, sering meninggalkan luka yang panjang dalam keluarga.","Kisah Hagar juga mengingatkan bahwa di dalam setiap keluarga ada orang yang bisa merasa \"tidak terlihat\": anak tengah, anak yang tidak menonjol, atau pasangan yang kelelahan diam-diam. Allah adalah El-Roi, Allah yang melihat (16:13). Kita dipanggil untuk ikut melihat.","Di pasal 18, Abraham menjamu tamu dengan murah hati, lalu dengan berani memohon bagi Sodom (18:23–32). Kita bisa mendoakan bukan hanya keluarga sendiri, tetapi juga orang lain, bahkan mereka yang jauh dari Tuhan."],
 tanya:["Keputusan besar apa yang pernah kita ambil terburu-buru? Apa yang kita pelajari?","Siapa di rumah kita yang mungkin sedang merasa \"tidak terlihat\"?","Siapa yang ingin kita doakan bersama sebagai keluarga?"],
 aksi:"Untuk keputusan besar berikutnya, sepakati untuk mendoakannya dulu minimal tiga hari. Minggu ini, luangkan waktu khusus untuk anak yang paling jarang mendapat perhatian."}},
7:{anak:{r:["Kejadian 19 adalah kisah yang menegangkan. Sodom dan Gomora dimusnahkan karena kejahatannya, tetapi Lot dan anak-anaknya diselamatkan. Mereka dilarang menoleh ke belakang, tapi istri Lot menoleh (19:26). Kadang kita sudah diberi jalan keluar dari hal yang buruk, tapi hati kita masih ingin kembali ke sana.","Di pasal 21 akhirnya Ishak lahir! Sara yang dulu tertawa tidak percaya, sekarang tertawa bahagia (21:6). Janji Allah memang kadang lama, tapi pasti.","Di pasal yang sama ada kisah yang sedih: Hagar dan anaknya, Ismael, harus pergi. Di padang gurun, Ismael menangis. Kejadian 21:17 mencatat Allah mendengar suara anak itu. Bukan suara orang dewasa, tapi suara anak! Doamu, sekecil apa pun, didengar Allah."],
 tanya:["Ada nggak kebiasaan buruk yang sudah kamu tinggalkan tapi kadang masih ingin kamu lakukan lagi?","Pernah menunggu sesuatu lama sekali lalu akhirnya terjadi? Ceritakan!","Apa doa yang ingin kamu sampaikan ke Tuhan tapi selama ini ragu?"],
 aksi:"Malam ini, sampaikan doa yang selama ini kamu simpan ke Tuhan dengan kata-katamu sendiri. Kalau mau, ceritakan juga ke orang tuamu."},
 ortu:{r:["Kejadian 20 terasa seperti mengulang pasal 12: Abraham kembali mengaku Sara sebagai adiknya karena takut. Ternyata pola lama bisa terulang, bahkan pada orang beriman sekalipun. Banyak pola dalam keluarga, seperti cara marah, cara menghindar, atau cara berbohong kecil, juga terus berulang dan bahkan menurun ke anak.","Tetapi Kejadian 21:1 mencatat bahwa Tuhan memperhatikan Sara sesuai janji-Nya. Kesetiaan Tuhan lebih besar daripada kegagalan kita yang berulang. Ini kabar baik bagi setiap orang tua yang merasa sudah berkali-kali gagal.","Kejadian 21:17 juga patut kita renungkan sebagai orang tua: Allah mendengar suara anak yang menangis. Anak-anak kita punya pergumulan sendiri, dan tangisan mereka, baik yang terdengar maupun yang dipendam, didengar Allah. Pertanyaannya: apakah kita juga mendengarnya?"],
 tanya:["Pola lama apa yang terus berulang di keluarga kita, mungkin bahkan dari orang tua kita dulu?","Kapan terakhir kali kita benar-benar mendengarkan anak tanpa memotong atau menasihati?","Janji Tuhan apa yang sudah kita lihat tergenapi dalam keluarga kita?"],
 aksi:"Pilih satu pola lama, lalu sepakati satu langkah kecil untuk memutusnya minggu ini. Ajak setiap anak bercerita 10 menit tanpa kamu menyela atau menasihati."}},
8:{anak:{r:["Kejadian 22 adalah salah satu kisah paling menegangkan di Alkitab. Allah menguji Abraham untuk mempersembahkan Ishak, anak yang sudah lama dinanti. Dalam perjalanan, Ishak bertanya: di mana anak dombanya? Abraham menjawab bahwa Allah sendiri yang akan menyediakannya (22:8). Dan benar, pada saat terakhir Tuhan menyediakan seekor domba jantan sebagai gantinya.","Kisah ini mengajarkan bahwa Allah bisa dipercaya bahkan saat kita tidak mengerti apa yang sedang terjadi.","Di pasal 24, hamba Abraham ditugasi mencari istri untuk Ishak. Sebelum melakukan apa pun, ia berdoa minta petunjuk (24:12), dan Tuhan menjawab doanya lewat Ribka yang baik hati, yang bahkan menimba air untuk unta-untanya (24:19). Berdoa sebelum melakukan sesuatu adalah kebiasaan yang keren."],
 tanya:["Hal apa yang bikin kamu khawatir minggu ini?","Pernah mengalami Tuhan \"menyediakan\" sesuatu yang kamu butuhkan?","Kebiasaan apa yang bisa kamu mulai supaya selalu berdoa sebelum melakukan hal penting?"],
 aksi:"Sebelum mengerjakan tugas, ujian, atau lomba berikutnya, berdoa dulu satu kalimat. Coba kebaikan seperti Ribka: bantu seseorang lebih dari yang diminta."},
 ortu:{r:["Kisah Abraham dan Ishak di Kejadian 22 menyentuh sisi terdalam setiap orang tua: anak adalah milik yang paling kita sayangi. Kisah ini mengingatkan bahwa anak-anak pada akhirnya adalah titipan Allah, bukan milik kita sepenuhnya. Menyerahkan anak kepada Tuhan sering berarti melepaskan rasa ingin mengendalikan masa depan mereka.","Kejadian 23:2 mencatat Abraham meratapi dan menangisi Sara. Iman tidak membuat duka jadi tidak ada. Anak-anak perlu melihat bahwa orang beriman pun boleh menangis, dan bahwa duka bisa dibawa kepada Tuhan.","Kejadian 24 diakhiri dengan kalimat yang lembut: Ishak mencintai Ribka, dan karena itu ia terhibur setelah ibunya meninggal (24:67). Pernikahan yang sehat menjadi tempat pulang saat kita kehilangan, dan anak-anak yang tumbuh di rumah seperti itu belajar apa artinya cinta yang menghibur."],
 tanya:["Bagian mana dari masa depan anak-anak yang paling sulit kita serahkan kepada Tuhan?","Bagaimana selama ini kita menunjukkan duka atau kesedihan di depan anak?","Saat salah satu dari kita lelah atau berduka, apa yang paling menolong?"],
 aksi:"Doakan setiap anak secara khusus malam ini, serahkan masa depannya kepada Tuhan. Tanyakan kepada pasangan: \"Beban apa yang sedang kamu bawa diam-diam?\""}},
9:{anak:{r:["Esau dan Yakub adalah anak kembar, tapi sifat mereka sangat berbeda. Suatu hari Esau pulang kelaparan, lalu menjual hak kesulungannya kepada Yakub demi semangkuk makanan (Kejadian 25:29–34). Hak kesulungan itu sangat berharga, tapi ditukar demi keinginan sesaat.","Kita juga kadang begitu: menukar hal yang berharga, seperti kejujuran, waktu belajar, atau kepercayaan orang tua, demi kesenangan sebentar, misalnya main game atau ikut-ikutan teman.","Di pasal 27, Yakub menyamar menjadi Esau supaya mendapat berkat dari ayahnya, Ishak, yang sudah buta. Ia berhasil, tapi akibatnya Esau sangat marah dan keluarga mereka jadi terpecah. Kebohongan mungkin berhasil sebentar, tapi biasanya merusak hubungan untuk waktu yang lama."],
 tanya:["Hal berharga apa yang kadang kamu tukar demi kesenangan sesaat?","Pernah berbohong dan ternyata akibatnya lebih besar dari yang kamu kira?","Kenapa kejujuran penting dalam keluarga?"],
 aksi:"Hari ini, tunda satu keinginan sampai tugas pentingmu selesai. Kalau ada kebohongan kecil yang belum kamu akui, akui hari ini."},
 ortu:{r:["Kejadian 25:28 mencatat dengan jujur: Ishak lebih sayang kepada Esau, sedangkan Ribka lebih sayang kepada Yakub. Di pasal 27, pilih kasih itu berbuah tipu daya, kebencian, dan keluarga yang terpecah bertahun-tahun.","Anak-anak sangat peka terhadap siapa yang \"lebih disayang\". Pilih kasih tidak selalu disengaja; kadang kita lebih cocok dengan satu anak karena sifatnya mirip dengan kita, atau lebih sering memuji anak yang berprestasi.","Kisah ini juga memperlihatkan orang tua yang tidak sejalan: Ribka menyusun rencana di belakang suaminya (27:5–10). Saat ayah dan ibu tidak satu suara, anak-anak bisa terjepit di tengah. Keputusan tentang anak sebaiknya dibicarakan dan disepakati berdua."],
 tanya:["Apakah ada anak yang mungkin merasa kurang disayang? Apa yang mungkin membuatnya merasa begitu?","Dalam hal apa kita sering tidak satu suara soal anak?","Bagaimana cara kita menyelesaikan beda pendapat soal anak tanpa melibatkan mereka?"],
 aksi:"Minggu ini, jadwalkan waktu berdua dengan masing-masing anak secara bergantian. Sepakati satu aturan rumah yang selama ini sering kalian perdebatkan."}},
10:{anak:{r:["Yakub kabur dari rumah karena Esau marah. Malam itu ia tidur di tempat terbuka dengan batu sebagai bantal. Lalu ia bermimpi melihat tangga yang menghubungkan bumi dan langit, dan Tuhan berjanji akan menyertainya ke mana pun ia pergi (Kejadian 28:15).","Saat bangun, Yakub berkata bahwa Tuhan ada di tempat itu dan ia tidak mengetahuinya (28:16). Padahal Yakub sedang dalam pelarian karena kesalahannya sendiri! Tuhan tetap hadir, bahkan saat kita sedang jauh dari-Nya.","Di Haran, Yakub jatuh cinta pada Rahel dan bekerja tujuh tahun untuk menikahinya, tapi ia ditipu Laban dan malah diberi Lea lebih dulu (29:25). Yakub yang dulu menipu ayahnya, sekarang merasakan sendiri rasanya ditipu."],
 tanya:["Di mana saja kamu pernah merasa Tuhan dekat denganmu?","Pernah merasakan sendiri akibat dari perbuatan yang dulu kamu lakukan ke orang lain?","Apa bedanya kalau kita ingat Tuhan selalu ada di dekat kita?"],
 aksi:"Hari ini, setiap kali pindah tempat (rumah, sekolah, les), ingatkan dirimu dalam hati: \"Tuhan ada di sini.\""},
