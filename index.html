${SRC([["Catatan Im 13",U("leviticus",13)],["Catatan Im 13 (lanjutan)","https://coursebible.com/new-american-bible-revised-edition-nabre/leviticus-13"],["Mrk 1",U("mark",1)]])}`,
37:`<h3>❓ Mengapa darah tidak boleh dimakan?</h3>
<p>${T_G} Imamat 17:11 menyebut alasannya: nyawa makhluk ada di dalam darahnya, dan darah diberikan untuk mengadakan pendamaian. Para rasul di Yerusalem kemudian juga meminta orang-orang bukan Yahudi yang menjadi percaya untuk menjauhkan diri dari darah (Kisah Para Rasul 15:20, 29).</p>
${SRC([["Im 17",U("leviticus",17)],["Kis 15",U("acts",15)]])}`,
38:`<h3>❓ Apakah Imamat melarang tato?</h3>
<p>${T_G} Imamat 19:28 melarang menoreh tubuh karena orang mati dan merajah diri.</p>
<p>${T_R} Banyak ahli memahami larangan ini dalam rangka penolakan terhadap kebiasaan berkabung bangsa-bangsa lain. Rabi Rashi mencatat bahwa orang Amori biasa menoreh tubuh ketika ada yang meninggal. Ayat-ayat sejajar: Ulangan 14:1 dan 1 Raja-raja 18:28.</p>
<p>${T_G} Prinsip yang tetap berlaku bagi orang Kristen: tubuh kita adalah bait Roh Kudus (1 Korintus 6:19–20).</p>
${SRC([["Im 19:28 (NABRE)","https://beta.biblegateway.com/verse/en/Leviticus%2019:28"],["Christianity Today","https://christianitytoday.com/scot-mcknight/2021/january/what-about-tats.html"],["Rashi (Sefaria)","https://www.sefaria.org.il/sheets/51548"],["1 Kor 6",U("1corinthians",6)]])}`,
39:`<h3>❓ Apa itu hari raya Pondok Daun?</h3>
<p>${T_G} Selama tujuh hari orang Israel tinggal di pondok-pondok, supaya keturunan mereka tahu bahwa Israel tinggal di pondok ketika keluar dari Mesir (23:42–43). Yesus juga datang ke Yerusalem pada hari raya ini dan berseru, "Barangsiapa haus, baiklah ia datang kepada-Ku" (Yohanes 7:2, 37).</p>
${SRC([["Im 23",U("leviticus",23)],["Yoh 7",U("john",7)]])}`,
40:`<h3>❓ Apakah tahun Yobel pernah dijalankan?</h3>
<p>${T_R} Menurut Bible Odyssey (Society of Biblical Literature), hukum Yobel disajikan seolah untuk dipraktikkan, tetapi tahun Yobel tidak disebut di bagian lain Alkitab Ibrani; mungkin hukum ini mengungkapkan nilai-nilai ideal. Ahli lain berpendapat Yobel bukan khayalan, tetapi diabaikan karena orang kaya tidak mau menanggung akibatnya.</p>
<p>${T_G} Yesus memulai karya-Nya dengan mengutip Yesaya: memberitakan pembebasan dan "tahun rahmat Tuhan" (Lukas 4:18–19).</p>
${SRC([["Bible Odyssey","https://bibleodyssey.org/passages/related-articles/jubilee-year"],["Theology of Work","https://exp.theologyofwork.org/old-testament/leviticus-and-work/the-sabbath-year-and-the-year-of-jubilee-leviticus-25"],["Luk 4",U("luke",4)]])}`,
41:`<h3>❓ Benarkah jumlahnya 603.550 orang?</h3>
<p>${T_R} Angka yang sangat besar ini sudah lama dibahas para ahli. Salah satu pendapat: angka ribuan baru dimasukkan ke dalam hitungan pada tahap penyalinan teks yang lebih kemudian. Usulan lain: kata Ibrani <i>elep</i>, yang biasanya berarti "seribu", di sini mungkin berarti "kaum" atau satuan kelompok.</p>
${SRC([["Komentar penerjemahan Bil 1 (UBS)","https://old-tips.translation.bible/?p=25337"],["KJV Study, Bil 1:46","https://kjvstudy.org/book/Numbers/chapter/1/verse/46"]])}`,
42:`<h3>❓ Siapa saja orang nazir yang terkenal?</h3>
<p>${T_G} Simson adalah nazir sejak dalam kandungan (Hakim-hakim 13:5). Hana berjanji bahwa pisau cukur tidak akan menyentuh kepala Samuel (1 Samuel 1:11). Tentang Yohanes Pembaptis dikatakan bahwa ia tidak akan minum anggur (Lukas 1:15). Paulus juga pernah mencukur rambutnya karena nazar (Kisah Para Rasul 18:18).</p>
${SRC([["Hak 13",U("judges",13)],["1 Sam 1",U("1samuel",1)],["Luk 1",U("luke",1)],["Kis 18",U("acts",18)]])}`,
43:`<h3>❓ Apa makna tiang awan bagi orang Kristen?</h3>
<p>${T_G} Paulus menulis bahwa leluhur Israel "dibaptis dalam awan dan dalam laut" (1 Korintus 10:1–2). Ketika Yesus dimuliakan di gunung, awan menaungi para murid dan terdengar suara dari dalam awan (Lukas 9:34–35).</p>
${SRC([["1 Kor 10",U("1corinthians",10)],["Luk 9",U("luke",9)]])}`,
44:`<h3>❓ Siapa perempuan Kush yang dinikahi Musa?</h3>
<p>${T_R} Kush adalah daerah di hulu sungai Nil, kemudian disebut Nubia, kini bagian selatan Mesir dan utara Sudan. Istri Musa yang dikenal adalah Zipora, orang Midian (Keluaran 2:21). Ada yang berpendapat perempuan Kush itu adalah Zipora sendiri, ada pula yang berpendapat ia istri kedua.</p>
<p>${T_R} Para ahli juga mencatat bahwa soal pernikahan itu hanya dalih; masalah sebenarnya adalah kedudukan Musa (12:2).</p>
${SRC([["Komentar penerjemahan Bil 12:1 (UBS)","https://tips.translation.bible/?p=25567"],["Claude Mariottini","https://claudemariottini.com/page/955/"]])}`,
45:`<h3>❓ Benarkah ada raksasa di Kanaan?</h3>
<p>${T_G} Laporan "kami seperti belalang" (13:33) disebut sendiri oleh teks sebagai kabar busuk dari para pengintai (13:32). Catatan Gereja untuk Kejadian 6:4 menjelaskan bahwa pada zaman itu orang umum percaya bahwa dahulu pernah hidup manusia bertubuh raksasa, dan Alkitab umumnya memandang mereka secara negatif.</p>
${SRC([["Bil 13",U("numbers",13)],["Catatan Kej 6",U("genesis",6)]])}`,
46:`<h3>❓ Di mana tongkat Harun disimpan?</h3>
<p>${T_G} Tuhan menyuruh tongkat itu diletakkan di depan tabut sebagai tanda (Bilangan 17:10). Surat Ibrani menyebut bahwa di dalam tabut ada buli-buli berisi manna, tongkat Harun yang pernah bertunas, dan loh-loh perjanjian (Ibrani 9:4). Pada zaman Salomo, di dalam tabut hanya ada dua loh batu (1 Raja-raja 8:9).</p>
${SRC([["Ibr 9",U("hebrews",9)],["1 Raj 8",U("1kings",8)]])}`,
47:`<h3>❓ Apa sebenarnya kesalahan Musa di Meriba?</h3>
<p>${T_G} Catatan Gereja menjelaskan bahwa apa yang melatarbelakangi kurangnya kepercayaan Musa dan Harun tidak dijelaskan teks. "Kekudusan" menyinggung nama tempat itu, Kadesh, yang berarti "kudus"; Meriba berarti "pertengkaran". Musa memukul batu dua kali, mungkin karena ia tidak cukup percaya bahwa mukjizat akan terjadi dengan pukulan pertama.</p>
<p>${T_G} Catatan New American Bible yang lama menyebut dosa mereka adalah meragukan belas kasih Allah kepada bangsa yang terus memberontak.</p>
${SRC([["Catatan Bil 20:12–13",U("numbers","20?2")],["Catatan Bil 20:11",U("nm",20)],["Catatan NAB lama (vatican.va)","https://press.vatican.va/archive/ENG0839/_P3Y.HTM"]])}`,
48:`<h3>❓ Bileam orang baik atau jahat?</h3>
<p>${T_G} Bileam mengucapkan berkat bagi Israel, tetapi kemudian ia menasihati orang Midian untuk menyesatkan Israel di Peor (Bilangan 31:16). Perjanjian Baru mengingatnya sebagai orang yang mencintai upah kejahatan dan mengajar orang lain jatuh dalam dosa (2 Petrus 2:15; Wahyu 2:14).</p>
${SRC([["Bil 31",U("numbers",31)],["2 Ptr 2",U("2peter",2)],["Why 2",U("revelation",2)]])}`,
49:`<h3>❓ Peristiwa Baal-Peor diingat di mana lagi?</h3>
<p>${T_G} Peristiwa ini diingat dalam Mazmur 106:28–31 dan Hosea 9:10. Paulus memakainya sebagai peringatan bagi jemaat Korintus (1 Korintus 10:8).</p>
${SRC([["Mzm 106",U("psalms",106)],["1 Kor 10",U("1corinthians",10)]])}`,
50:`<h3>❓ Apakah orang Kristen masih boleh bernazar?</h3>
<p>${T_G} Pengkhotbah pasal 5 menasihati agar nazar kepada Allah tidak ditunda-tunda, dan lebih baik tidak bernazar daripada bernazar tetapi tidak menepatinya. Yesus mengajarkan: "Jika ya, hendaklah kamu katakan ya; jika tidak, hendaklah kamu katakan tidak" (Matius 5:37). Paulus sendiri pernah bernazar (Kisah Para Rasul 18:18).</p>
${SRC([["Pkh 5",U("ecclesiastes",5)],["Mat 5",U("matthew",5)],["Kis 18",U("acts",18)]])}`,
51:`<h3>❓ Bagaimana memahami kisah perang yang kejam di Alkitab?</h3>
<p>${T_G} Paus Benediktus XVI dalam <i>Verbum Domini</i> no. 42 membahas bagian-bagian Kitab Suci yang "gelap" karena kekerasan dan amoralitas di dalamnya. Ia mengajarkan bahwa wahyu berakar dalam sejarah: Allah memilih suatu bangsa dan dengan sabar membimbing serta mendidiknya. Kitab Suci mencatat tindakan-tindakan zaman itu, termasuk kekerasan, tanpa selalu mengecamnya secara eksplisit. Para nabi kemudian menentang segala bentuk ketidakadilan dan kekerasan. Bagian-bagian ini perlu dibaca dalam terang misteri Kristus.</p>
${SRC([["Verbum Domini 42 (National Catholic Register)","https://www.ncregister.com/blog/pope-benedict-on-the-dark-passages-of-scripture"],["Catholic Answers","https://www.catholic.com/audio/cot/pope-benedict-xvi-vs-the-dark-passages-of-scripture"]])}`,
52:`<h3>❓ Apa hubungan kota perlindungan dengan iman kita?</h3>
<p>${T_G} Orang yang membunuh tanpa sengaja harus tinggal di kota perlindungan sampai imam besar meninggal (35:25). Surat Ibrani memakai bahasa yang sama untuk orang beriman: "kita yang mencari perlindungan" dan berpegang pada pengharapan yang ditawarkan Allah (Ibrani 6:18).</p>
${SRC([["Bil 35",U("numbers",35)],["Ibr 6",U("hebrews",6)]])}`,
53:`<h3>❓ Mengapa Israel dilarang memerangi Edom, Moab, dan Amon?</h3>
<p>${T_G} Teks menyebut alasannya: Edom adalah saudara mereka, keturunan Esau (2:4–5), sedangkan Moab dan Amon adalah keturunan Lot (2:9, 19). Allah sendiri telah memberikan tanah itu kepada mereka.</p>
${SRC([["Ul 2",U("deuteronomy",2)]])}`,
54:`<h3>❓ Mengapa alasan Sabat di Ulangan berbeda dengan Keluaran?</h3>
<p>${T_G} Di Keluaran 20:11, alasannya adalah penciptaan: Allah berhenti pada hari ketujuh. Di Ulangan 5:14–15, alasannya adalah pembebasan: ingatlah bahwa kamu dulu budak di Mesir, dan biarkan hambamu beristirahat seperti engkau.</p>
${SRC([["Ul 5",U("deuteronomy",5)],["Kel 20",U("exodus",20)]])}`,
55:`<h3>❓ Mengapa Israel disuruh tidak bergaul dengan bangsa-bangsa Kanaan?</h3>
<p>${T_G} Teks menyebut dua alasan: supaya Israel tidak terseret menyembah ilah lain (7:3–4), dan karena kefasikan bangsa-bangsa itu, bukan karena Israel lebih benar (9:4–5). Untuk memahami bagian yang keras ini, lihat juga penjelasan Hari 51 tentang <i>Verbum Domini</i> 42.</p>
${SRC([["Ul 7",U("deuteronomy",7)],["Ul 9",U("deuteronomy",9)]])}`,
56:`<h3>❓ Mengapa hanya boleh beribadah di satu tempat?</h3>
<p>${T_G} Menurut pengantar Gereja, salah satu perhatian pokok Kitab Ulangan adalah pemusatan ibadah. Kitab ini berhubungan dengan "kitab Taurat" yang ditemukan di Bait Allah pada zaman raja Yosia, sekitar 622 SM; Yosia kemudian menghapus tempat-tempat pengorbanan lain (2 Raja-raja 23:8–9).</p>
<p>${T_G} Yesus berkata bahwa saatnya akan tiba orang menyembah Bapa dalam roh dan kebenaran, bukan hanya di satu gunung (Yohanes 4:21–23).</p>
${SRC([["Pengantar Ulangan",U("deuteronomy",0)],["2 Raj 23",U("2kings",23)],["Yoh 4",U("john",4)]])}`,
57:`<h3>❓ "Tidak akan ada orang miskin" atau "orang miskin selalu ada"?</h3>
<p>${T_G} Keduanya ada di pasal yang sama (15:4 dan 15:11). Yesus mengutip 15:11 (Markus 14:7). Kisah Para Rasul mencatat bahwa dalam jemaat perdana tidak ada seorang pun yang berkekurangan, karena mereka saling berbagi (Kisah Para Rasul 4:34).</p>
${SRC([["Ul 15",U("deuteronomy",15)],["Mrk 14",U("mark",14)],["Kis 4",U("acts",4)]])}`,
58:`<h3>❓ Mengapa ramalan dan bertanya kepada arwah dilarang?</h3>
<p>${T_G} Katekismus (no. 2116) mengajarkan bahwa segala bentuk ramalan harus ditolak: meminta bantuan setan, memanggil arwah, atau praktik lain yang dikira bisa "membuka" masa depan. Horoskop, astrologi, membaca garis tangan, menafsirkan pertanda, dan pergi ke medium menyembunyikan keinginan untuk berkuasa atas waktu, sejarah, dan sesama. Katekismus juga menegaskan bahwa Allah dapat menyatakan masa depan kepada para nabi dan orang kudus-Nya (no. 2115).</p>
${SRC([["Katekismus 2115–2116","https://www.vatican.va/archive/ENG0015/__P7E.HTM"],["Ul 18",U("deuteronomy",18)]])}`,
59:`<h3>❓ "Terkutuklah orang yang digantung" (21:23), apa hubungannya dengan salib?</h3>
<p>${T_G} Paulus mengutip ayat ini: Kristus menjadi kutuk karena kita, untuk menebus kita dari kutuk hukum Taurat (Galatia 3:13). Para rasul berkhotbah bahwa Yesus "digantung pada kayu salib" (Kisah Para Rasul 10:39).</p>
${SRC([["Gal 3",U("galatians",3)],["Kis 10",U("acts",10)]])}`,
60:`<h3>❓ Ulangan mengizinkan surat cerai; bagaimana kata Yesus?</h3>
<p>${T_G} Ketika ditanya tentang Ulangan 24:1, Yesus menjawab bahwa Musa mengizinkannya karena ketegaran hati mereka, tetapi sejak semula tidaklah demikian (Matius 19:7–8; Markus 10:2–9).</p>
${SRC([["Mat 19",U("matthew",19)],["Mrk 10",U("mark",10)]])}`,
61:`<h3>❓ Mengapa ipar harus mengawini janda saudaranya?</h3>
<p>${T_G} Tujuannya disebut di teks: supaya nama saudara yang meninggal tidak terhapus dari Israel (25:6). Orang Saduki mengajukan pertanyaan kepada Yesus berdasarkan hukum ini (Matius 22:23–30). Kebiasaan sejenis tampak dalam kisah Rut dan Boas (Rut 4), leluhur Daud dan Yesus (Matius 1:5).</p>
${SRC([["Ul 25",U("deuteronomy",25)],["Mat 22",U("matthew",22)],["Rut 4",U("ruth",4)]])}`,
62:`<h3>❓ "Firman itu dekat", siapa yang mengutipnya?</h3>
<p>${T_G} Paulus mengutip Ulangan 30:12–14 untuk menjelaskan iman kepada Kristus: firman itu dekat, di dalam mulutmu dan di dalam hatimu, yaitu firman iman yang kami beritakan (Roma 10:6–8).</p>
${SRC([["Rm 10",U("romans",10)],["Ul 30",U("deuteronomy",30)]])}`,
63:`<h3>❓ Mengapa Allah disebut "Gunung Batu"?</h3>
<p>${T_G} Nyanyian Musa berulang kali menyebut Allah "Gunung Batu" (32:4, 15, 18): kokoh, tidak berubah, tempat berlindung. Paulus menulis tentang batu karang yang menyertai Israel di padang gurun: "batu karang itu ialah Kristus" (1 Korintus 10:4).</p>
${SRC([["Ul 32",U("deuteronomy",32)],["1 Kor 10",U("1corinthians",10)]])}`,
64:`<h3>❓ Siapa yang menulis kisah kematian Musa?</h3>
<p>${T_R} Talmud (Bava Batra 14b–15a) memuat dua pendapat: Yosua menulis delapan ayat terakhir Taurat (Ulangan 34:5–12), atau Musa menuliskannya atas dikte Allah sambil menangis.</p>
<p>${T_G} Pengantar Gereja untuk Ulangan mencatat adanya tanda-tanda penyuntingan kemudian dalam kitab ini. Gereja mengajarkan bahwa Allah memakai penulis-penulis manusia sebagai pengarang sejati, sehingga yang mereka tulis adalah sabda Allah (Dei Verbum 11).</p>
${SRC([["Bava Batra (Sefaria)","https://www.sefaria.org.il/sheets/6002"],["My Jewish Learning","https://www.myjewishlearning.com/article/menachot-30/"],["Pengantar Ulangan",U("deuteronomy",0)],["Dei Verbum","https://www.intratext.com/IXT/ENG0037/_P4.HTM"]])}`,
65:`<h3>❓ Rahab berbohong, kok dipuji?</h3>
<p>${T_G} Ibrani 11:31 dan Yakobus 2:25 memuji iman Rahab dan tindakannya menyambut serta menyelamatkan para pengintai, tanpa memuji kebohongannya. Santo Agustinus menulis bahwa yang diganjar pada Rahab bukan tipuannya, melainkan kebaikan hatinya. Rahab kemudian tercatat dalam silsilah Yesus (Matius 1:5).</p>
${SRC([["Our Sunday Visitor","https://www.oursundayvisitor.com/?p=4412"],["Crossway","https://crossway.org/articles/does-rahab-show-us-that-its-sometimes-okay-to-lie-joshua-2"],["Ibr 11",U("hebrews",11)]])}`,
66:`<h3>❓ Apakah tembok Yerikho benar-benar runtuh?</h3>
<p>${T_R} Pada 1930 John Garstang mengira menemukan tembok zaman Yosua. Kathleen Kenyon (penggalian 1952–1958) menunjukkan bahwa tembok itu jauh lebih tua, dan benteng Yerikho runtuh sekitar 1550 SM, sebelum perkiraan zaman Yosua. Arkeolog Bryant Wood kemudian berpendapat Kenyon salah menanggal temuannya dan bahwa kehancuran terjadi pada akhir abad ke-15 SM. Perdebatan ini belum selesai.</p>
<p>${T_G} Pengantar Gereja mengingatkan bahwa Kitab Yosua menyajikan gambaran yang diidealkan, sebagai pelajaran iman.</p>
${SRC([["Kathleen Kenyon (Bible Odyssey)","https://www.bibleodyssey.org/articles/kathleen-kenyon-and-jericho/"],["Tembok Yerikho (Bible Odyssey)","https://m.bibleodyssey.org/articles/the-walls-of-jericho/"],["Bryant Wood","https://biblearchaeology.org/?p=70451"],["Pengantar Yosua","https://biblehub.com/nabre/joshua/intro.htm"]])}`,
67:`<h3>❓ Di mana kota Ai?</h3>
<p>${T_R} Dalam bahasa Ibrani, "Ai" berarti "reruntuhan". Kota ini sering diidentikkan dengan et-Tell ("gundukan reruntuhan") dekat Betel; namun menurut kronologi arkeologi, et-Tell tidak berpenghuni pada zaman perkiraan Yosua. Ada usulan lokasi lain, seperti Khirbet el-Maqatir dan Khirbet Nisya. Para ahli belum sepakat.</p>
${SRC([["Et-Tell","https://en.wikipedia.org/wiki/Et-Tell"],["Aish","https://aish.com/fact-checking-the-bible-the-lost-city-of-ai/"]])}`,
68:`<h3>❓ Apakah matahari benar-benar berhenti?</h3>
<p>${T_G} Catatan Gereja menjelaskan bahwa ayat 10:13 merujuk bagian puisi sebelumnya, yang dikutip dari Kitab Orang Jujur, sebuah kitab yang mengisahkan kepahlawanan Israel dalam gaya epik, seperti Kitab Peperangan TUHAN (Bilangan 21:14). Ayat yang sulit ini bisa berarti hari yang lebih panjang dari biasanya karena matahari berhenti bergerak, atau matahari berhenti bersinar, mungkin karena gerhana.</p>
${SRC([["Catatan Yos 10",U("joshua",10)]])}`,
69:`<h3>❓ Mengapa orang Yebus di Yerusalem tidak dapat dihalau?</h3>
<p>${T_G} Kitab Yosua mengakuinya terus terang (15:63). Baru pada zaman Daud kubu Sion direbut dan dinamai Kota Daud (2 Samuel 5:6–9). Pengantar Gereja menjelaskan bahwa Israel menjadi kekuatan utama di negeri itu secara perlahan dan sedikit demi sedikit.</p>
${SRC([["2 Sam 5",U("2samuel",5)],["Pengantar Yosua","https://biblehub.com/nabre/joshua/intro.htm"]])}`,
70:`<h3>❓ Apa yang terjadi dengan Silo kemudian?</h3>
<p>${T_G} Silo menjadi tempat ibadah Israel: keluarga Elkana dan Hana berziarah ke sana (1 Samuel 1:3). Kemudian tabut dibawa dari Silo ke medan perang dan dirampas orang Filistin (1 Samuel 4:3–11). Berabad-abad kemudian, Tuhan melalui Yeremia memakai Silo sebagai peringatan: "Pergilah ke tempat-Ku yang di Silo" (Yeremia 7:12).</p>
${SRC([["1 Sam 1",U("1samuel",1)],["1 Sam 4",U("1samuel",4)],["Yer 7",U("jeremiah",7)]])}`

/* ===== Pembaca ayat ===== */
const BOLLS="https://bolls.life";
const NT_EN=["Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];
const ALIASES={"Psalm":["psalms","psalm"],"Song of Solomon":["songofsolomon","songofsongs","canticles","song"],"Wisdom":["wisdom","wisdomofsolomon"],"Sirach":["sirach","ecclesiasticus","sira","bensira"],"Revelation":["revelation","revelationofjohn","apocalypse"]};
function norm(s){return String(s).toLowerCase().replace(/^i\s/,"1 ").replace(/^ii\s/,"2 ").replace(/^iii\s/,"3 ").replace(/[^a-z0-9]/g,"");}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function parseCh(s){ // "5" | "3:24-90" | "10:4-13"
  const m=String(s).match(/^(\d+)(?::(\d+)-(\d+))?$/); if(!m) return {ch:+s};
  return {ch:+m[1], from:m[2]?+m[2]:null, to:m[3]?+m[3]:null};
}
let LANGS=null; const BOOKS_CACHE={};
async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }
async function pickTranslations(){
  if(LANGS) return LANGS;
  const data=await getJSON(BOLLS+"/static/bolls/app/views/languages.json");
  const all=data.flatMap(l=>(l.translations||[]).map(t=>({code:t.short_name, name:t.full_name||t.short_name})));
  const find=(tests)=>{ for(const t of tests){ const hit=all.find(x=>t(x)); if(hit) return hit; } return null; };
  LANGS={
    heb: find([x=>x.code==="WLC", x=>/leningrad/i.test(x.name)]),
    lxx: find([x=>x.code==="LXX", x=>/septuag/i.test(x.name)]),
    gnt: find([x=>/^SBLGNT$/i.test(x.code), x=>/tischendorf/i.test(x.name), x=>/westcott/i.test(x.name), x=>/textus receptus/i.test(x.name), x=>/byzantine/i.test(x.name)]),
    eng: find([x=>/^WEB$/i.test(x.code), x=>/world english/i.test(x.name), x=>x.code==="KJV"])
  };
  return LANGS;
}
async function bookId(tr, enBook){
  if(!BOOKS_CACHE[tr]) BOOKS_CACHE[tr]=await getJSON(`${BOLLS}/get-books/${tr}/`);
  const keys=ALIASES[enBook]||[norm(enBook)];
  const hit=BOOKS_CACHE[tr].find(b=>keys.includes(norm(b.name||"")));
  return hit?hit.bookid:null;
}
function clean(t){ return String(t||"").replace(/<S>\d+<\/S>/gi,"").replace(/<sup>.*?<\/sup>/gi,"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim(); }
async function loadText(kind, u){
  const L=await pickTranslations();
  const tr = kind==="eng" ? L.eng : (NT_EN.includes(u.en) ? L.gnt : (u.sec==="DK" ? L.lxx : L.heb));
  if(!tr) throw new Error("no translation");
  const bid=await bookId(tr.code, u.en);
  if(!bid) return {tr, html:`<p class="empty">Kitab ini tidak tersedia dalam ${esc(tr.name)}.</p>`};
  const p=parseCh(u.ch); let vs=[];
  try{ vs=await getJSON(`${BOLLS}/get-text/${tr.code}/${bid}/${p.ch}/`); }catch(e){}
  vs=vs.filter(v=>(p.from==null||v.verse>=p.from)&&(p.to==null||v.verse<=p.to));
  return {tr, html: vs.length ? vs.map(v=>`<p class="rv"><sup>${v.verse}</sup> ${esc(clean(v.text))}</p>`).join("") : `<p class="empty">Pasal ini tidak tersedia di sumber ini (penomoran bisa berbeda).</p>`};
}
function readerHTML(){
  return `<div class="reader"><div class="rtabs"><button data-k="id" class="on">🇮🇩 Indonesia (LAI)</button><button data-k="orig">Bahasa asli</button><button data-k="eng">English</button></div><div class="rbody"></div></div>`;
}
async function showReader(box, u, kind){
  const body=box.querySelector(".rbody");
  box.querySelectorAll(".rtabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===kind));
  if(kind==="id"){
    if(!u.sab){ body.innerHTML=`<p class="empty">Kitab Deuterokanonika tidak tersedia di Alkitab SABDA. Silakan baca dari Alkitab Deuterokanonika LAI cetak, atau pilih tab "Bahasa asli" / "English".</p>`; return; }
    const url=`https://alkitab.sabda.org/passage.php?passage=${encodeURIComponent(u.sab+" "+u.ch)}`;
    body.innerHTML=`<iframe class="rframe" src="${url}" loading="lazy" title="Alkitab SABDA"></iframe>
      <p class="rnote">Teks: Alkitab Terjemahan Baru © LAI, ditampilkan dari situs Alkitab SABDA. Kalau tidak tampil, <a href="${url}" target="_blank" rel="noopener">buka di sini</a>.</p>`;
    return;
  }
  body.innerHTML=`<p class="empty">Memuat…</p>`;
  try{
    const {tr, html}=await loadText(kind==="eng"?"eng":"orig", u);
    const rtl = kind==="orig" && LANGS.heb && tr.code===LANGS.heb.code;
    body.innerHTML=`<div class="rtext ${rtl?'rtl':''}">${html}</div><p class="rnote">Teks: ${esc(tr.name)} (${esc(tr.code)}), dari bolls.life.</p>`;
  }catch(e){ body.innerHTML=`<p class="empty">Gagal memuat teks. Pastikan HP terhubung internet, lalu coba lagi.</p>`; }
}

    <ul><li><b>Ringkasan pasal</b> adalah kata-kata kami untuk membantu mengikuti alur cerita. Itu <b>bukan ayat</b>; pegangannya tetap teks Alkitab.</li>
    <li><b>Sumber utama:</b> penjelasan berlabel ⛪ Gereja diambil dari catatan kaki dan pengantar <b>NABRE</b> (<i>New American Bible, Revised Edition</i>, Alkitab Katolik terbitan Konferensi Waligereja Amerika Serikat/USCCB), kecuali bila disebut sumber lain seperti Katekismus (KGK), Dei Verbum, atau New Catholic Bible.</li>
    <li><b>Penjelasan 5W 1H</b> harus punya sumber yang bisa diklik. ${T_G} = ajaran atau catatan resmi Gereja. ${T_R} = museum, universitas, jurnal, atau ensiklopedia terpercaya.</li>
    <li><b>Tidak ada data, tidak ditulis.</b> Kalau sumber berbeda pendapat, perbedaannya ditampilkan.</li></ul></div>
  <div class="card sec"><div class="h2">Yang sudah tersedia</div>
    <ul><li>Ringkasan pasal: ${nSum} pasal (Kejadian sampai Yosua 18). Kitab lain menyusul.</li><li>Penjelasan 5W 1H: ${nEx} pasal.</li><li>Pertanyaan yang sering muncul: ${Object.keys(TANYA).length} hari.</li><li>Renungan anak & orang tua: ${Object.keys(RENUNGAN).length} hari.</li>
    <li>Tambahan Ester dan Tambahan Daniel memakai penomoran pasal Alkitab Deuterokanonika LAI; di tab Bahasa asli/English penomorannya bisa berbeda.</li></ul>
    <p class="srcs">📚 Urutan kitab Deuterokanonika LAI–LBI: <a href="https://www.gramedia.com/products/alkitab-deuterokanonika-tb-062-ti-dc-sl" target="_blank" rel="noopener">deskripsi Alkitab Deuterokanonika (Gramedia)</a></p></div>`;
}
function show(v){
  ["today","ren","all","family","about"].forEach(x=>$("#v-"+x).classList.toggle("hide",x!==v));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="all") renderAll(); if(v==="family") renderFamily(); if(v==="about") renderAbout(); if(v==="today") renderDay(current); if(v==="ren") renderRen();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
renderDay(current);
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}

</script>
